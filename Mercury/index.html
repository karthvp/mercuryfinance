            setLoadError(err.message);
            setIsLoading(false);
          });
      }, []);

      const saveToServer = useCallback(() => {
        if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);
        saveTimeoutRef.current = setTimeout(() => {
          const data = {
            version: DATA_VERSION,
            initialBalances,
            payrolls,
            recurringExpenses,
            oneOffExpenses,
            oneOffIncomes,
            debts,
            balanceOverrides,
            currentYear: activeYear,
            archivedYears
          };
          setSaveState('saving');
          api.saveData(data)
            .then(() => {
              setSaveState('saved');
              if (savedTimeoutRef.current) clearTimeout(savedTimeoutRef.current);
              savedTimeoutRef.current = setTimeout(() => setSaveState('idle'), 1800);
            })
            .catch(err => {
              console.error('Save failed:', err);
              setSaveState('error');
              if (savedTimeoutRef.current) clearTimeout(savedTimeoutRef.current);
              savedTimeoutRef.current = setTimeout(() => setSaveState('idle'), 3000);
            });
        }, 500);
      }, [initialBalances, payrolls, recurringExpenses, oneOffExpenses, oneOffIncomes, debts, balanceOverrides, activeYear, archivedYears]);

      useEffect(() => {
        if (!isLoading) saveToServer();
      }, [initialBalances, payrolls, recurringExpenses, oneOffExpenses, oneOffIncomes, debts, balanceOverrides, activeYear, archivedYears]);

      const datesForYear = useMemo(() => generateDatesForYear(activeYear), [activeYear]);
      const availableYears = useMemo(() => Array.from(new Set([activeYear, ...archivedYears])).sort((a, b) => b - a), [activeYear, archivedYears]);

      const todayKey = toDateKey(today);

      // Debt payoff plan — pure over (debts, recurringExpenses). Drives both the Debt
      // view and the payoff-based termination of linked expenses in the forecast.
      const debtPlan = useMemo(() => computeDebtPlan(debts, recurringExpenses, today), [debts, recurringExpenses, todayKey]);
      const payoffDateByDebtId = debtPlan.payoffDateByDebtId;
      const debtProjectionStd = useMemo(() => computeDebtProjection(debts, debtPlan, today, 'independent'), [debts, debtPlan, todayKey]);
      const debtProjectionSnow = useMemo(() => computeDebtProjection(debts, debtPlan, today, 'snowball'), [debts, debtPlan, todayKey]);
      const debtProjection = snowballMode ? debtProjectionSnow : debtProjectionStd;

      // ===== Year rollover =====
      // When the real calendar year has advanced past the stored year, archive each
      // completed year and carry its Dec 31 ending balance into the next year's start
      // (only when that start isn't already set). Idempotent and non-destructive.
      const performRollover = useCallback(() => {
        if (realCurrentYear <= activeYear) return;
        const inits = { ...initialBalances };
        const archived = [...archivedYears];
        const summary = [];
        for (let y = activeYear; y < realCurrentYear; y++) {
          const occ = generateOccurrences(y, payrolls, recurringExpenses, oneOffExpenses, oneOffIncomes, payoffDateByDebtId);
          const startBal = inits[y] != null ? inits[y] : 5000;
          const series = buildYearSeries(y, occ, startBal, balanceOverrides, today, todayKey);
          const yearEnd = series.length ? series[series.length - 1].endingBalance : startBal;
          if (!archived.includes(y)) archived.push(y);
          if (inits[y + 1] === undefined) { inits[y + 1] = yearEnd; summary.push({ year: y, carried: yearEnd, preset: false }); }
          else { summary.push({ year: y, carried: inits[y + 1], preset: true }); }
        }
        setInitialBalances(inits);
        setArchivedYears(archived);
        setActiveYear(realCurrentYear);
        setDashboardYear(realCurrentYear);
        setRolloverNotice(summary);
      }, [realCurrentYear, activeYear, initialBalances, archivedYears, payrolls, recurringExpenses, oneOffExpenses, oneOffIncomes, payoffDateByDebtId, balanceOverrides, todayKey]);

      // Run the rollover once, after the user's data has loaded.
      useEffect(() => {
        if (isLoading || didRolloverRef.current) return;
        didRolloverRef.current = true;
        performRollover();
      }, [isLoading, performRollover]);

      // Expand all rules (+ one-offs) into dated occurrences for the active year.
      const activeOccurrences = useMemo(
        () => generateOccurrences(activeYear, payrolls, recurringExpenses, oneOffExpenses, oneOffIncomes, payoffDateByDebtId),
        [activeYear, payrolls, recurringExpenses, oneOffExpenses, oneOffIncomes, payoffDateByDebtId]
      );

      const financialData = useMemo(
        () => buildYearSeries(activeYear, activeOccurrences, initialBalances[activeYear] || 5000, balanceOverrides, today, todayKey),
        [activeYear, activeOccurrences, initialBalances, balanceOverrides, todayKey]
      );

      // Per-day balance series for the viewed year. Reuses financialData for the
      // active year; recomputes for archived/other years. This is the single source
      // the dashboard chart and all aggregate stats read from.
      const dashboardSeries = useMemo(() => {
        if (dashboardYear === activeYear) return financialData;
        const occ = generateOccurrences(dashboardYear, payrolls, recurringExpenses, oneOffExpenses, oneOffIncomes, payoffDateByDebtId);
        return buildYearSeries(dashboardYear, occ, initialBalances[dashboardYear] || 5000, balanceOverrides, today, todayKey);
      }, [financialData, dashboardYear, activeYear, initialBalances, payrolls, recurringExpenses, oneOffExpenses, oneOffIncomes, payoffDateByDebtId, balanceOverrides, todayKey]);

      const stats = useMemo(() => {
        const yearData = dashboardSeries;

        // Optimize: compute lowest balance in single pass instead of twice
        let lowestBalance = Infinity;
        let lowestBalanceDate = null;
        yearData.forEach(d => {
          if (d.endingBalance < lowestBalance) {
            lowestBalance = d.endingBalance;
            lowestBalanceDate = d.date;
          }
        });

        // Optimize: compute aggregates in single pass instead of 12+ reduce calls
        const aggregates = { hist: { rec: 0, oneOff: 0, total: 0, payroll: 0 }, future: { rec: 0, oneOff: 0, total: 0, payroll: 0 }, full: { rec: 0, oneOff: 0, total: 0, payroll: 0 } };
        yearData.forEach(d => {
          const bucket = d.isPast ? aggregates.hist : aggregates.future;
          bucket.rec += d.recurringExpenses;
          bucket.oneOff += d.oneOffExpenses;
          bucket.total += d.expenses;
          bucket.payroll += d.payrollAmount;
          aggregates.full.rec += d.recurringExpenses;
          aggregates.full.oneOff += d.oneOffExpenses;
          aggregates.full.total += d.expenses;
          aggregates.full.payroll += d.payrollAmount;
        });

        return {
          initialBalance: initialBalances[dashboardYear] || 5000,
          endOfYearBalance: yearData[yearData.length - 1]?.endingBalance || 0,
          lowestBalance,
          lowestBalanceDate,
          historicalRecurringExpensesPaid: aggregates.hist.rec,
          historicalOneOffExpensesPaid: aggregates.hist.oneOff,
          historicalTotalExpensesPaid: aggregates.hist.total,
          historicalPayrollReceived: aggregates.hist.payroll,
          forecastedRecurringExpenses: aggregates.future.rec,
          forecastedOneOffExpenses: aggregates.future.oneOff,
          forecastedTotalExpenses: aggregates.future.total,
          forecastedPayroll: aggregates.future.payroll,
          totalRecurringExpensesForYear: aggregates.full.rec,
          totalOneOffExpensesForYear: aggregates.full.oneOff,
          totalExpensesForYear: aggregates.full.total,
          totalPayrollForYear: aggregates.full.payroll,
          netAnnual: aggregates.full.payroll - aggregates.full.total,
        };
      }, [dashboardSeries, dashboardYear, initialBalances]);

      // How far through the viewed year we are (frames "so far" vs "ahead").
      const yearProgress = useMemo(() => {
        const now = new Date();
        if (dashboardYear < now.getFullYear()) return 100;
        if (dashboardYear > now.getFullYear()) return 0;
        const start = new Date(dashboardYear, 0, 1).getTime();
        const end = new Date(dashboardYear + 1, 0, 1).getTime();
        return Math.round(((now.getTime() - start) / (end - start)) * 100);
      }, [dashboardYear]);

      // The "will I run out of money?" model: current balance, the lowest point still
      // AHEAD of today, the first day (if any) the balance goes negative, this-month
      // cash flow, and the balance check-ins (formerly "overrides") for this year.
      const forecast = useMemo(() => {
        const series = dashboardSeries;
        const isCurrentYear = dashboardYear === realCurrentYear;
        const isFutureYear = dashboardYear > realCurrentYear;
        const todayIdx = isCurrentYear ? series.findIndex(d => d.isToday) : -1;

        let currentBalance;
        if (isCurrentYear && todayIdx >= 0) currentBalance = series[todayIdx].endingBalance;
        else if (isFutureYear) currentBalance = initialBalances[dashboardYear] || 5000;
        else currentBalance = series[series.length - 1]?.endingBalance ?? 0;

        // Window of days still ahead (for the current year); whole year otherwise.
        const aheadStart = isCurrentYear && todayIdx >= 0 ? todayIdx : 0;
        let lowestAheadBal = Infinity, lowestAheadDate = null, firstNegDate = null;
        for (let i = aheadStart; i < series.length; i++) {
          const d = series[i];
          if (d.endingBalance < lowestAheadBal) { lowestAheadBal = d.endingBalance; lowestAheadDate = d.date; }
          if (firstNegDate === null && d.endingBalance < 0) firstNegDate = d.date;
        }
        if (lowestAheadBal === Infinity) { lowestAheadBal = currentBalance; lowestAheadDate = null; }

        // This-month cash flow (current year only).
        let monthIncome = 0, monthExpenses = 0;
        if (isCurrentYear) {
          const m = today.getMonth();
          series.forEach(d => { if (d.date.getMonth() === m) { monthIncome += d.payrollAmount; monthExpenses += d.expenses; } });
        }

        const checkIns = Object.keys(balanceOverrides)
          .filter(k => k.startsWith(String(dashboardYear) + '-'))
          .map(k => ({ date: k, balance: balanceOverrides[k] }))
          .sort((a, b) => a.date.localeCompare(b.date));
        const latestCheckIn = isCurrentYear
          ? [...checkIns].reverse().find(c => c.date <= todayKey) || null
          : (checkIns[checkIns.length - 1] || null);

        return {
          isCurrentYear, isFutureYear, currentBalance,
          lowestAheadBal, lowestAheadDate, firstNegDate,
          monthIncome, monthExpenses, monthNet: monthIncome - monthExpenses,
          checkIns, latestCheckIn,
          avgMonthlyNet: stats.netAnnual / 12,
        };
      }, [dashboardSeries, dashboardYear, realCurrentYear, initialBalances, balanceOverrides, todayKey, stats.netAnnual]);

      // Occurrences for the viewed year (reuses the active-year expansion when possible).
      const dashboardOccurrences = useMemo(
        () => dashboardYear === activeYear ? activeOccurrences : generateOccurrences(dashboardYear, payrolls, recurringExpenses, oneOffExpenses, oneOffIncomes, payoffDateByDebtId),
        [dashboardYear, activeYear, activeOccurrences, payrolls, recurringExpenses, oneOffExpenses, oneOffIncomes, payoffDateByDebtId]
      );

      const ytdExpensesByName = useMemo(() => {
        const cutoffDate = getYearCutoffDate(dashboardYear);
        const expenseTotals = {};
        Object.entries(dashboardOccurrences.expenseByDate).forEach(([dateKey, items]) => {
          if (dateKey > cutoffDate) return;
          items.forEach(it => { expenseTotals[it.name] = (expenseTotals[it.name] || 0) + it.amount; });
        });
        return Object.entries(expenseTotals)
          .map(([name, amount]) => ({ name, amount }))
          .sort((a, b) => b.amount - a.amount);
      }, [dashboardYear, dashboardOccurrences]);

const { theme, isDark } = useTheme();

      // Sankey diagram data computation
      const sankeyRef = useRef(null);
      const [sankeyTooltip, setSankeyTooltip] = useState(null);
      const [selectedCategory, setSelectedCategory] = useState(null);
      const [sankeyTick, setSankeyTick] = useState(0);

      // Re-render the Sankey when the viewport (and therefore the container width) changes
      useEffect(() => {
        if (activeView !== 'cashflow') return;
        let t;
        const onResize = () => { clearTimeout(t); t = setTimeout(() => setSankeyTick(v => v + 1), 160); };
        window.addEventListener('resize', onResize);
        window.addEventListener('orientationchange', onResize);
        return () => { clearTimeout(t); window.removeEventListener('resize', onResize); window.removeEventListener('orientationchange', onResize); };
      }, [activeView]);

      const sankeyData = useMemo(() => {
        const cutoffDate = getYearCutoffDate(dashboardYear);

        // Income & expenses by name, summed from expanded occurrences up to the cutoff.
        // This reflects per-occurrence adjustments, moves, skips, and one-off income.
        const incomeTotals = {};
        Object.entries(dashboardOccurrences.incomeByDate).forEach(([dateKey, items]) => {
          if (dateKey > cutoffDate) return;
          items.forEach(it => { incomeTotals[it.name] = (incomeTotals[it.name] || 0) + it.amount; });
        });

        const expenseTotals = {};
        const expenseDetails = {};
        Object.entries(dashboardOccurrences.expenseByDate).forEach(([dateKey, items]) => {
          if (dateKey > cutoffDate) return;
          items.forEach(it => {
            expenseTotals[it.name] = (expenseTotals[it.name] || 0) + it.amount;
            if (!expenseDetails[it.name]) expenseDetails[it.name] = [];
            expenseDetails[it.name].push({ name: it.name, amount: it.amount, type: it.kind === 'oneoff' ? 'one-off' : 'recurring', date: dateKey });
          });
        });

        const totalIncome = Object.values(incomeTotals).reduce((sum, v) => sum + v, 0);
        const totalExpenses = Object.values(expenseTotals).reduce((sum, v) => sum + v, 0);

        if (totalIncome === 0 && totalExpenses === 0) {
          return { nodes: [], links: [], totalIncome: 0, totalExpenses: 0, expenseDetails: {} };
        }

        // Build nodes array
        const nodes = [];
        const nodeIndex = {};
        let idx = 0;

        // Add income source nodes
        Object.keys(incomeTotals).forEach(name => {
          nodeIndex[`income-${name}`] = idx++;
          nodes.push({ id: `income-${name}`, name, type: 'income', value: incomeTotals[name] });
        });

        // Add total income node (aggregator)
        if (totalIncome > 0) {
          nodeIndex['total-income'] = idx++;
          nodes.push({ id: 'total-income', name: 'Total Income', type: 'aggregate', value: totalIncome });
        }

        // Add expense category nodes
        const sortedExpenses = Object.entries(expenseTotals).sort((a, b) => b[1] - a[1]);
        sortedExpenses.forEach(([name, amount]) => {
          nodeIndex[`expense-${name}`] = idx++;
          nodes.push({ id: `expense-${name}`, name, type: 'expense', value: amount, percent: ((amount / totalExpenses) * 100).toFixed(1) });
        });

        // Build links array
        const links = [];

        // Links from income sources to total income
        Object.entries(incomeTotals).forEach(([name, amount]) => {
          links.push({
            source: nodeIndex[`income-${name}`],
            target: nodeIndex['total-income'],
            value: amount,
            sourceName: name,
            targetName: 'Total Income'
          });
        });

        // Links from total income to expense categories
        sortedExpenses.forEach(([name, amount]) => {
          links.push({
            source: nodeIndex['total-income'],
            target: nodeIndex[`expense-${name}`],
            value: amount,
            sourceName: 'Total Income',
            targetName: name
          });
        });

        return {
          nodes,
          links,
          totalIncome,
          totalExpenses,
          netCashFlow: totalIncome - totalExpenses,
          expenseDetails,
          incomeSources: Object.entries(incomeTotals).map(([name, amount]) => ({ name, amount }))
        };
      }, [dashboardYear, dashboardOccurrences, payrolls]);

      useEffect(() => {
        if (activeView !== 'dashboard' || ytdExpensesByName.length === 0) return;
        const raf = requestAnimationFrame(() => {
        const el = ytdChartRef.current;
        if (!el) return;
        try {
        if (ytdChartInstance.current) { ytdChartInstance.current.destroy(); ytdChartInstance.current = null; }

        const ctx = el.getContext('2d');
        // Purple-free categorical palette tuned for the Quicksilver theme
        const colors = ['#22d3ee', '#34d399', '#fb7185', '#fbbf24', '#38bdf8', '#2dd4bf', '#f97316', '#f472b6', '#a3e635', '#60a5fa'];
        
        const tooltipBg = isDark ? 'rgba(10, 18, 28, 0.95)' : 'rgba(255, 255, 255, 0.96)';
        const tooltipTitle = isDark ? '#eef5f8' : '#0c1b26';
        const gridColor = isDark ? 'rgba(255, 255, 255, 0.05)' : 'rgba(12, 27, 38, 0.08)';
        const tickColor = isDark ? '#6f8693' : '#5c7382';
        const labelColor = isDark ? '#eef5f8' : '#0c1b26';
        
        ytdChartInstance.current = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: ytdExpensesByName.map(e => e.name),
            datasets: [{
              data: ytdExpensesByName.map(e => e.amount),
              backgroundColor: ytdExpensesByName.map((_, i) => colors[i % colors.length] + '80'),
              borderColor: ytdExpensesByName.map((_, i) => colors[i % colors.length]),
              borderWidth: 1,
              borderRadius: 4,
            }]
          },
          options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: tooltipBg,
                titleColor: tooltipTitle,
                bodyColor: isDark ? '#22d3ee' : '#0e9bb8',
                borderColor: isDark ? 'rgba(34, 211, 238, 0.35)' : 'rgba(14, 155, 184, 0.45)',
                borderWidth: 1,
                callbacks: {
                  label: (context) => `$${context.raw.toLocaleString('en-US', { minimumFractionDigits: 2 })}`
                }
              }
            },
            scales: {
              x: {
                grid: { color: gridColor },
                ticks: { color: tickColor, callback: (value) => '$' + value.toLocaleString() }
              },
              y: {

                ticks: { color: labelColor, font: { size: 11 } }
              }
            }
          }
        });
        } catch (err) { console.error('Category chart render failed:', err); }
        });

        return () => { cancelAnimationFrame(raf); if (ytdChartInstance.current) { ytdChartInstance.current.destroy(); ytdChartInstance.current = null; } };
      }, [ytdExpensesByName, activeView, isDark]);

      // Balance-over-time line chart — the centerpiece of the dashboard.
      // Shows the daily ending-balance trajectory: past solid / future dashed,
      // negative regions shaded red, with today and balance check-ins marked.
      useEffect(() => {
        if (activeView !== 'dashboard') return;
        // Defer to the next frame so the glass panel has finished laying out — otherwise
        // Chart.js can capture a 0-size container and render a blank chart.
        const raf = requestAnimationFrame(() => {
        const el = balanceChartRef.current;
        if (!el) return;
        try {
        if (balanceChartInstance.current) { balanceChartInstance.current.destroy(); balanceChartInstance.current = null; }

        const series = dashboardSeries;
        const ctx = el.getContext('2d');
        const todayIdx = forecast.isCurrentYear ? series.findIndex(d => d.isToday) : -1;

        const accent = isDark ? '#22d3ee' : '#0e9bb8';
        const danger = isDark ? '#fb7185' : '#e11d48';
        const success = isDark ? '#34d399' : '#059669';
        const grid = isDark ? 'rgba(255,255,255,0.05)' : 'rgba(12,27,38,0.08)';
        const tick = isDark ? '#6f8693' : '#5c7382';

        balanceChartInstance.current = new Chart(ctx, {
          type: 'line',
          data: {
            labels: series.map(d => d.date),
            datasets: [{
              data: series.map(d => d.endingBalance),
              borderColor: accent,
              borderWidth: 2,
              tension: 0.15,
              pointRadius: series.map(d => d.isToday ? 5 : (d.isOverridden ? 4 : 0)),
              pointHoverRadius: series.map(d => d.isToday ? 7 : (d.isOverridden ? 6 : 4)),
              pointBackgroundColor: series.map(d => d.isToday ? accent : (d.isOverridden ? success : accent)),
              pointBorderColor: isDark ? '#06121c' : '#ffffff',
              pointBorderWidth: 2,
              fill: {
                target: 'origin',
                above: isDark ? 'rgba(34,211,238,0.10)' : 'rgba(14,155,184,0.10)',
                below: isDark ? 'rgba(251,113,133,0.20)' : 'rgba(225,29,72,0.16)',
              },
              segment: {
                borderColor: (c) => (c.p0.parsed.y < 0 || c.p1.parsed.y < 0) ? danger : accent,
                borderDash: (c) => (todayIdx >= 0 && c.p0DataIndex >= todayIdx) ? [5, 4] : undefined,
              },
            }],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { intersect: false, mode: 'index' },
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: isDark ? 'rgba(10,18,28,0.95)' : 'rgba(255,255,255,0.96)',
                titleColor: isDark ? '#eef5f8' : '#0c1b26',
                bodyColor: isDark ? '#a3b6c1' : '#3c5260',
                borderColor: isDark ? 'rgba(34,211,238,0.35)' : 'rgba(14,155,184,0.45)',
                borderWidth: 1,
                padding: 12,
                callbacks: {
                  title: (items) => formatFullDate(series[items[0].dataIndex].date),
                  label: (item) => 'Balance: ' + formatCurrency(item.raw),
                  afterBody: (items) => {
                    const d = series[items[0].dataIndex];
                    const lines = [];
                    if (d.payrollAmount > 0) lines.push('Income  +' + formatCurrency(d.payrollAmount));
                    if (d.expenses > 0) lines.push('Expenses  −' + formatCurrency(d.expenses));
                    if (d.isOverridden) lines.push('● Balance check-in');
                    return lines;
                  },

            },
            scales: {
              x: {
                grid: { display: false },
                ticks: {
                  color: tick, maxRotation: 0, autoSkip: false,
                  callback: (val, idx) => { const d = series[idx] && series[idx].date; return d && d.getDate() === 1 ? months[d.getMonth()].slice(0, 3) : ''; },
                },
              },
              y: {
                grid: { color: grid },
                ticks: { color: tick, callback: (v) => '$' + Math.round(v).toLocaleString() },
              },
            },
          },
        });
        } catch (err) { console.error('Balance chart render failed:', err); }
        });

        return () => { cancelAnimationFrame(raf); if (balanceChartInstance.current) { balanceChartInstance.current.destroy(); balanceChartInstance.current = null; } };
      }, [dashboardSeries, forecast, activeView, isDark]);

      // Debt-payoff projection chart — total debt shrinking toward $0 (motivating!).
      // In snowball mode it overlays the standard line (dashed) so the acceleration shows.
      useEffect(() => {
        if (activeView !== 'debt') return;
        const raf = requestAnimationFrame(() => {
          const el = debtChartRef.current;
          if (!el || debtProjectionStd.points.length === 0) return;
          try {
            if (debtChartInstance.current) { debtChartInstance.current.destroy(); debtChartInstance.current = null; }
            const stdPts = debtProjectionStd.points;
            const snowPts = debtProjectionSnow.points;
            // Use the longer timeline (standard) for labels; pad the shorter series with 0.
            const base = stdPts.length >= snowPts.length ? stdPts : snowPts;
            const labels = base.map(p => p.date);
            const padTo = (pts) => labels.map((_, i) => i < pts.length ? pts[i].total : 0);
            const success = isDark ? '#34d399' : '#059669';
            const muted = isDark ? '#6f8693' : '#94a3b8';
            const grid = isDark ? 'rgba(255,255,255,0.05)' : 'rgba(12,27,38,0.08)';
            const tick = isDark ? '#6f8693' : '#5c7382';
            const active = snowballMode ? debtProjectionSnow : debtProjectionStd;
            const datasets = [];
            datasets.push({
              label: snowballMode ? 'Snowball' : 'Payoff',
              data: padTo(active.points),

          </div>
        );
      }

      const renderDashboard = () => {
        const negative = forecast.firstNegDate !== null;
        const checkInCount = forecast.checkIns.length;
        const balanceLabel = forecast.isCurrentYear ? 'Balance today' : forecast.isFutureYear ? `Projected start of ${dashboardYear}` : `${dashboardYear} year-end`;
        const ytdNet = stats.historicalPayrollReceived - stats.historicalTotalExpensesPaid;
        const legendDot = (color, filled) => ({ width: '10px', height: '10px', borderRadius: '50%', background: filled ? color : 'transparent', border: `2px solid ${color}`, display: 'inline-block' });

        const yearOneOffIncomes = oneOffIncomes.filter(e => e.date.startsWith(String(dashboardYear))).sort((a, b) => a.date.localeCompare(b.date));

        return (
        <div>
          {rolloverNotice && rolloverNotice.length > 0 && (
            <div style={{ display: 'flex', alignItems: 'flex-start', gap: '0.625rem', padding: '0.875rem 1.125rem', background: 'var(--accent-bg)', border: '1px solid var(--accent-border)', borderRadius: '14px', marginBottom: '1.5rem', lineHeight: 1.5 }}>

                  ? `${r.year} archived (you'd already set ${r.year + 1}'s starting balance).`
                  : `${r.year} archived; carried its year-end of ${formatCurrency(r.carried)} into ${r.year + 1}.`).join(' ')}
              </div>
              <button onClick={() => setRolloverNotice(null)} aria-label="Dismiss" className="icon-btn" style={{ background: 'transparent', border: 'none', color: 'var(--text-muted)', cursor: 'pointer', display: 'flex', padding: '0.25rem', flexShrink: 0 }}><Icons.X /></button>
            </div>

          <div className="app-year-selector" style={{ ...styles.yearSelector, justifyContent: 'space-between', flexWrap: 'wrap' }}>

              <select value={dashboardYear} onChange={(e) => setDashboardYear(parseInt(e.target.value))} style={styles.yearSelect}>

              {dashboardYear !== activeYear && <span style={{ fontSize: '0.6875rem', color: 'var(--warning)' }}>(Archived)</span>}

            <div className="app-initial-balance-section" style={{ display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
              <span style={styles.initialBalanceLabel}>Starting Balance (Jan 1, {dashboardYear}):</span>
              <input type="number" value={initialBalances[dashboardYear] || 5000} onChange={(e) => updateInitialBalance(dashboardYear, e.target.value)} style={styles.initialBalanceInput} />
            </div>
          </div>

          {/* ===== Status hero — answers "will I run out of money?" ===== */}
          <div className="app-panel" style={{ ...styles.panel, marginBottom: '1.5rem', display: 'flex', flexWrap: 'wrap', gap: '1.5rem', alignItems: 'center', justifyContent: 'space-between' }}>
            <div style={{ display: 'flex', flexDirection: 'column', gap: '0.75rem', flex: '1 1 340px', minWidth: 0 }}>
              <div style={{ display: 'inline-flex', alignItems: 'center', gap: '0.5rem', alignSelf: 'flex-start', padding: '0.375rem 0.875rem', borderRadius: '999px', fontSize: '0.75rem', fontWeight: 600, letterSpacing: '0.03em', textTransform: 'uppercase', background: negative ? 'var(--danger-bg)' : 'var(--success-bg)', border: `1px solid ${negative ? 'var(--danger)' : 'var(--success)'}`, color: negative ? 'var(--danger)' : 'var(--success)' }}>

                {negative ? 'Heads up' : 'On track'}
              </div>
              <div style={{ fontSize: '1.0625rem', lineHeight: 1.55, color: 'var(--text-secondary)' }}>
                {negative ? (
                  <>Your balance is projected to fall below <strong style={{ color: 'var(--danger)' }}>$0</strong> on <strong style={{ color: 'var(--text-primary)' }}>{formatFullDate(forecast.firstNegDate)}</strong>, bottoming out at <strong style={{ color: 'var(--danger)' }}>{formatCurrency(forecast.lowestAheadBal)}</strong>. Trim expenses or add income before then.</>
                ) : (
                  <>You stay above zero {forecast.isCurrentYear ? 'all the way to Dec 31' : 'all year'}. Your tightest point {forecast.isCurrentYear ? 'ahead' : ''} is <strong style={{ color: 'var(--text-primary)' }}>{formatCurrency(forecast.lowestAheadBal)}</strong>{forecast.lowestAheadDate ? <> on <strong style={{ color: 'var(--text-primary)' }}>{formatFullDate(forecast.lowestAheadDate)}</strong></> : ''}.</>

              </div>
            </div>
            <div style={{ textAlign: 'right', flex: '0 0 auto' }}>
              <div style={styles.statLabel}>{balanceLabel}</div>
              <div style={{ fontFamily: '"Playfair Display", serif', fontSize: 'clamp(2rem, 5vw, 2.75rem)', fontWeight: 600, color: forecast.currentBalance >= 0 ? 'var(--text-primary)' : 'var(--danger)', letterSpacing: '-0.02em', lineHeight: 1.1 }}>{formatCurrency(forecast.currentBalance)}</div>
              {forecast.latestCheckIn && <div style={styles.statSubtext}>Anchored to your {formatFullDate(parseDateKey(forecast.latestCheckIn.date))} check-in</div>}

          </div>

          {/* ===== Key forecast numbers ===== */}
          <div className="app-dashboard-grid" style={styles.dashboardGrid}>

            <div style={{ height: 320 }}><canvas ref={balanceChartRef}></canvas></div>

          {/* ===== This month cash flow (current year only) ===== */}
          {forecast.isCurrentYear && (
            <>
              <div style={styles.sectionTitle}><Icons.Money /> This Month · {months[today.getMonth()]} {dashboardYear}</div>
              <div className="app-dashboard-grid" style={styles.dashboardGrid}>
                <div className="app-stat-card" style={styles.statCard()}><div style={styles.statCardAccent('var(--success)')} /><div style={styles.statLabel}>Income</div><div className="app-stat-value" style={styles.statValue('var(--success)')}>+{formatCurrency(forecast.monthIncome)}</div></div>

              </div>
            </>

          {ytdExpensesByName.length > 0 && (
            <div className="app-panel" style={{ ...styles.panel, marginTop: '1.5rem', marginBottom: '1.5rem' }}>
              <div style={styles.panelTitle}><Icons.Expense /> Spending by Category{forecast.isCurrentYear ? ' · year to date' : ''}</div>
              <div style={{ height: Math.max(200, ytdExpensesByName.length * 35 + 40), padding: '1rem 0' }}>
                <canvas ref={ytdChartRef}></canvas>
              </div>

                            <div style={{ fontSize: '1.0625rem', fontWeight: 600, color: 'var(--text-primary)', display: 'flex', alignItems: 'center', gap: '0.5rem', flexWrap: 'wrap' }}>

                              <span style={{ fontSize: '0.625rem', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.04em', color: 'var(--text-muted)', background: 'var(--bg-surface)', border: '1px solid var(--border-light)', borderRadius: '999px', padding: '0.125rem 0.5rem' }}>{debtTypeLabels[debt.type] || 'Other'}</span>
                            </div>
                            <div style={{ fontSize: '0.8125rem', color: 'var(--text-muted)', marginTop: '0.25rem' }}>
                              {debt.apr}% APR · {p.payment ? <>{formatCurrency(p.payment)}/mo {p.linkedNames && p.linkedNames.length > 0 ? <>from <strong style={{ color: 'var(--text-secondary)' }}>{p.linkedNames.join(', ')}</strong></> : '(manual)'}</> : 'no payment set'}
                            </div>
                          </div>
                          <div style={{ textAlign: 'right', flexShrink: 0 }}>
                            <div style={{ fontFamily: '"Playfair Display", serif', fontSize: '1.5rem', fontWeight: 600, color: 'var(--danger)', lineHeight: 1.1 }}>{formatCurrency(debt.balance)}</div>
                            <div style={{ display: 'flex', gap: '0.5rem', justifyContent: 'flex-end', marginTop: '0.5rem' }}>
                              <button className="icon-btn" aria-label={`Edit debt ${debt.name}`} style={editBtn} onClick={() => editDebt(debt)}><Icons.Edit /></button>
                              <button className="icon-btn" aria-label={`Delete debt ${debt.name}`} style={styles.deleteBtn} onClick={() => deleteDebt(debt.id)}><Icons.Trash /></button>
                            </div>
                          </div>
                        </div>

                        {(p.noSource || p.neverPays) ? (
                          <div style={warnBox}>
                            <span style={{ display: 'flex', flexShrink: 0 }}><Icons.Warning /></span>
                            {p.noSource ? 'No payment source — link a recurring expense or set a monthly payment to see the payoff.' : 'The payment doesn’t cover the monthly interest, so this debt never pays off. Increase the payment or add an extra payment.'}
                          </div>
                        ) : (
                          <>
                            <div style={{ display: 'flex', gap: '1.5rem', flexWrap: 'wrap', marginTop: '0.875rem', fontSize: '0.8125rem' }}>
                              <div><span style={{ color: 'var(--text-muted)' }}>Payoff </span><strong style={{ color: 'var(--text-primary)' }}>{p.payoffDateKey ? formatFullDate(parseDateKey(p.payoffDateKey)) : '—'}</strong>{p.months != null && <span style={{ color: 'var(--text-dim)' }}> ({p.months} mo)</span>}</div>
                              <div><span style={{ color: 'var(--text-muted)' }}>Total interest </span><strong style={{ color: 'var(--warning)' }}>{formatCurrency(p.totalInterest || 0)}</strong></div>
                            </div>
                            <div style={{ marginTop: '0.625rem', height: '8px', borderRadius: '999px', overflow: 'hidden', display: 'flex', background: 'var(--bg-surface)', border: '1px solid var(--border-subtle)' }} title={`Principal ${formatCurrency(principalW)} vs interest ${formatCurrency(interestW)}`}>
                              <div style={{ width: `${(principalW / totalW) * 100}%`, background: 'var(--accent)' }} />
                              <div style={{ width: `${(interestW / totalW) * 100}%`, background: 'var(--warning)' }} />
                            </div>
                            <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: '0.375rem', fontSize: '0.6875rem', color: 'var(--text-dim)' }}>
                              <span>Principal {formatCurrency(principalW)}</span>
                              <span>Interest {formatCurrency(interestW)}</span>
                            </div>
                          </>
                        )}
                      </div>
                    );
                  })}
                </div>
              </>
            )}
          </div>
        );
      };

      const renderCalendar = () => {
        return (
          <div className="app-table-container" style={styles.tableContainer}>
            <div className="app-month-selector" style={styles.monthSelector}>
              {months.map((month, idx) => (<button key={month} style={styles.monthBtn(scrollToMonth === idx)} onClick={() => setScrollToMonth(idx)}>{month.slice(0, 3)}</button>))}
            </div>
            <div className="app-table-header" style={styles.tableHeader}>
              <div className="app-table-header-cell" style={styles.tableHeaderCell}>Date</div>
              <div className="app-table-header-cell app-hide-xs" style={styles.tableHeaderCell}>Day</div>
              <div className="app-table-header-cell" style={styles.tableHeaderCell}>Activity</div>
              <div className="app-table-header-cell" style={styles.tableHeaderCell}>Starting</div>
              <div className="app-table-header-cell app-hide-mobile" style={styles.tableHeaderCell}>Expenses</div>
              <div className="app-table-header-cell" style={styles.tableHeaderCell}>Ending</div>
              <div className="app-table-header-cell app-hide-mobile" style={styles.tableHeaderCell}></div>
            </div>
            <div style={styles.tableBody}>
              {financialData.map((day, idx) => {
                const isMonthStart = day.dayOfMonth === 1;
                const prevMonth = idx > 0 ? financialData[idx - 1].month : -1;
                const showMonthDivider = day.month !== prevMonth;

                return (
                  <Fragment key={day.dateKey}>
                    {showMonthDivider && (<div style={styles.monthDivider} ref={el => monthRefs.current[day.month] = el}><span style={styles.monthLabel}>{months[day.month]} {day.year}</span></div>)}
                    <div ref={day.isToday ? todayRowRef : null} className="app-table-row" style={styles.tableRow(day.isToday, day.isPast, isMonthStart)} onDragOver={handleDragOver} onDrop={(e) => handleDrop(e, day.dateKey)}>
                      <div className="app-table-cell" style={styles.tableCell}>{formatDate(day.date)}</div>
                      <div className="app-table-cell app-hide-xs" style={styles.tableCell}>{day.dayOfWeek}</div>
                      <div className="app-table-cell" style={{ ...styles.tableCell, flexWrap: 'wrap' }}>
                        <div style={styles.expensesList}>
                          {day.payrollDetails.map((p, i) => (
                            p.kind === 'recurring'
                              ? <span key={i} draggable="true" onDragStart={(ev) => handleDragStart(ev, { type: 'recurringIncome', id: p.id, origin: p.origin })} onDragEnd={handleDragEnd} onClick={() => openOccurrenceEditor('income', p, day.dateKey)} style={{ ...styles.payrollBadge, cursor: 'grab' }} title="Drag to move · click to adjust or skip">+{formatCurrency(p.amount)} {p.name}{(p.moved || p.adjusted) ? ' ✎' : ''}</span>
                              : <span key={i} draggable="true" onDragStart={(ev) => handleDragStart(ev, { type: 'oneoffIncome', id: p.id })} onDragEnd={handleDragEnd} onClick={() => editOneOffIncome(p)} style={{ ...styles.payrollBadge, cursor: 'grab' }} title="Drag to move · click to edit">+{formatCurrency(p.amount)} {p.name}</span>
                          ))}
                          {day.expenseDetails.map((e, i) => (
                            e.isRecurring
                              ? <span key={i} draggable="true" onDragStart={(ev) => handleDragStart(ev, { type: 'recurringExpense', id: e.id, origin: e.origin })} onDragEnd={handleDragEnd} onClick={() => openOccurrenceEditor('expense', e, day.dateKey)} style={{ ...styles.recurringExpenseBadge, cursor: 'grab' }} title="Drag to move · click to adjust or skip">-{formatCurrency(e.amount)} {e.name}{(e.moved || e.adjusted) ? ' ✎' : ''}</span>
                              : <span key={i} draggable="true" onDragStart={(ev) => handleDragStart(ev, { type: 'oneoffExpense', id: e.id })} onDragEnd={handleDragEnd} onClick={() => editOneOffExpense(e)} style={{ ...styles.oneOffExpenseBadge, cursor: 'grab' }} title="Drag to move · click to edit">-{formatCurrency(e.amount)} {e.name}</span>
                          ))}
                        </div>
                      </div>
                      <div className="app-table-cell" style={styles.tableCell}>
                        {editingCell === day.dateKey ? (
                          <div style={{ display: 'flex', alignItems: 'center' }}>
                            <input type="number" value={editValue} onChange={(e) => setEditValue(e.target.value)} style={styles.inlineInput} autoFocus onKeyDown={(e) => { if (e.key === 'Enter') handleOverrideBalance(day.dateKey, editValue); if (e.key === 'Escape') setEditingCell(null); }} />
                            <div style={styles.inlineActions}>
                              <button className="icon-btn" aria-label="Save balance check-in" style={{ ...styles.inlineBtn('52, 211, 153'), color: 'var(--success)' }} onClick={() => handleOverrideBalance(day.dateKey, editValue)}><Icons.Check /></button>
                              <button className="icon-btn" aria-label="Cancel edit" style={{ ...styles.inlineBtn('251, 113, 133'), color: 'var(--danger)' }} onClick={() => setEditingCell(null)}><Icons.X /></button>
                            </div>
                          </div>
                        ) : (
                          <span style={day.startingBalance >= 0 ? styles.balancePositive : styles.balanceNegative}>
                            {formatCurrency(day.startingBalance)}
                            {day.isOverridden && (<span style={styles.overrideBadge} onClick={() => clearOverride(day.dateKey)} title="Click to remove this check-in">Check-in</span>)}
                            <button className="icon-btn" aria-label="Record actual balance (check-in)" title="Record actual balance here" style={styles.editButton} onClick={() => { setEditingCell(day.dateKey); setEditValue(day.startingBalance.toString()); }}><Icons.Edit /></button>
                          </span>
                        )}
                      </div>
                      <div className="app-table-cell app-hide-mobile" style={{ ...styles.tableCell, ...styles.expenseCell }}>{day.expenses > 0 ? `-${formatCurrency(day.expenses)}` : '-'}</div>
                      <div className="app-table-cell" style={styles.tableCell}><span style={day.endingBalance >= 0 ? styles.balancePositive : styles.balanceNegative}>{formatCurrency(day.endingBalance)}</span></div>
                      <div className="app-table-cell app-hide-mobile" style={styles.tableCell}><button className="icon-btn" aria-label="Add one-off expense on this day" style={styles.addExpenseBtn} onClick={() => openOneOffFormForDate(day.dateKey)} title="Add expense"><Icons.Plus /></button></div>
                    </div>
                  </Fragment>
                );
              })}
            </div>
          </div>
        );
      };

      return (
        <div style={styles.container}>
          <header className="app-header" style={styles.header}>
            <div className="app-header-content" style={styles.headerContent}>
              <div className="app-header-brand" style={styles.logo} onClick={onBackToHome}><div style={styles.logoIcon}><Icons.Mercury /></div><span className="app-logo-text" style={styles.logoText}>Mercury</span><span className="app-year-badge" style={styles.yearBadge}>{activeYear}</span></div>
              <nav className="app-nav" style={styles.nav}><button className="app-nav-btn" style={styles.navButton(activeView === 'dashboard')} onClick={() => setActiveView('dashboard')}><Icons.Dashboard /> Dashboard</button><button className="app-nav-btn" style={styles.navButton(activeView === 'cashflow')} onClick={() => setActiveView('cashflow')}><Icons.CashFlow /> Cash Flow</button><button className="app-nav-btn" style={styles.navButton(activeView === 'debt')} onClick={() => setActiveView('debt')}><Icons.Debt /> Debt</button><button className="app-nav-btn" style={styles.navButton(activeView === 'calendar')} onClick={() => setActiveView('calendar')}><Icons.Calendar /> Calendar</button></nav>
              <div className="app-header-actions" style={styles.headerActions}>
                <div className="app-hide-mobile" style={styles.saveIndicator(saveState)} role="status" aria-live="polite">
                  {saveState === 'saving' ? <><Icons.Cloud /> Saving…</> : saveState === 'error' ? <><Icons.Warning /> Save failed</> : <><Icons.Check /> Saved</>}
                </div>
                {user && (
                  <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', padding: '0.3125rem 0.5rem 0.3125rem 0.625rem', background: 'var(--bg-surface)', borderRadius: '999px', border: '1px solid var(--border-light)' }}>
                    {user.profile_image ? (
                      <img src={user.profile_image} alt="" style={{ width: '28px', height: '28px', borderRadius: '50%', objectFit: 'cover', border: '2px solid var(--accent-border-strong)' }} />
                    ) : (
                      <div style={{ width: '28px', height: '28px', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'var(--accent-bg)', color: 'var(--accent)' }}><Icons.User /></div>
                    )}
                    <span className="app-hide-mobile" title={user.email || ''} style={{ color: 'var(--text-primary)', fontSize: '0.8125rem', fontWeight: '500', maxWidth: '140px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{user.first_name || (user.email ? user.email.split('@')[0] : 'User')}</span>
                    <a href="/api/logout" className="icon-btn" style={{ display: 'flex', alignItems: 'center', color: 'var(--text-muted)', padding: '0.375rem', borderRadius: '50%', transition: 'color 0.2s, background 0.2s' }} title="Sign out" aria-label="Sign out"><Icons.LogOut /></a>
                  </div>
                )}
              </div>
            </div>
          </header>
          <main className="app-main" style={styles.main}>{activeView === 'dashboard' ? renderDashboard() : activeView === 'cashflow' ? renderCashFlow() : activeView === 'debt' ? renderDebt() : renderCalendar()}</main>

          {showPayrollForm && (
            <div style={styles.formOverlay} onClick={() => setShowPayrollForm(false)}>
              <div className="app-form-card" style={styles.formCard} onClick={e => e.stopPropagation()}>
                <h3 style={styles.formTitle}>{isEditing ? 'Edit Income Source' : 'Add Income Source'}</h3>
                <div style={styles.formGroup}><label style={styles.formLabel}>Name</label><input type="text" placeholder="e.g., Salary, Freelance" value={newPayroll.name} onChange={e => setNewPayroll(p => ({ ...p, name: e.target.value }))} style={styles.formInput} /></div>
                <div style={styles.formGroup}><label style={styles.formLabel}>Amount (per payment)</label><input type="number" placeholder="0.00" value={newPayroll.amount} onChange={e => setNewPayroll(p => ({ ...p, amount: e.target.value }))} style={styles.formInput} /></div>
                <div style={styles.formGroup}><label style={styles.formLabel}>Frequency</label><select value={newPayroll.frequency} onChange={e => setNewPayroll(p => ({ ...p, frequency: e.target.value }))} style={styles.formSelect}><option value="weekly">Weekly</option><option value="biweekly">Biweekly</option><option value="monthly">Monthly (specific day)</option><option value="semimonthly">Semi-monthly (15th & EOM weekdays)</option><option value="last-weekday-15th">Last weekday before 15th only</option><option value="last-weekday-eom">Last weekday of month only</option></select></div>
                {['weekly', 'biweekly', 'monthly'].includes(newPayroll.frequency) && (<div style={styles.formGroup}><label style={styles.formLabel}>{newPayroll.frequency === 'monthly' ? 'Day of Month (1-31)' : 'Start Day (1-31)'}</label><input type="number" min="1" max="31" value={newPayroll.startDay} onChange={e => setNewPayroll(p => ({ ...p, startDay: e.target.value }))} style={styles.formInput} /><div style={styles.formHint}>{newPayroll.frequency === 'biweekly' && 'First paycheck date in January, then every 14 days'}{newPayroll.frequency === 'weekly' && 'First paycheck date in January, then every 7 days'}</div></div>)}
                <div className="app-form-actions" style={styles.formActions}><button style={styles.cancelBtn} onClick={() => setShowPayrollForm(false)}>Cancel</button><button style={styles.submitBtn} onClick={addPayroll}>{isEditing ? 'Save Changes' : 'Add Income'}</button></div>
              </div>
            </div>
          )}

          {showRecurringExpenseForm && (
            <div style={styles.formOverlay} onClick={() => setShowRecurringExpenseForm(false)}>
              <div className="app-form-card" style={styles.formCard} onClick={e => e.stopPropagation()}>
                <h3 style={styles.formTitle}>{isEditing ? 'Edit Recurring Expense' : 'Add Recurring Expense'}</h3>
                <div style={styles.formGroup}><label style={styles.formLabel}>Name</label><input type="text" placeholder="e.g., Rent, Netflix, Groceries" value={newRecurringExpense.name} onChange={e => setNewRecurringExpense(p => ({ ...p, name: e.target.value }))} style={styles.formInput} /></div>
                <div style={styles.formGroup}><label style={styles.formLabel}>Amount</label><input type="number" placeholder="0.00" value={newRecurringExpense.amount} onChange={e => setNewRecurringExpense(p => ({ ...p, amount: e.target.value }))} style={styles.formInput} /></div>
                <div style={styles.formGroup}><label style={styles.formLabel}>Frequency</label><select value={newRecurringExpense.frequency} onChange={e => setNewRecurringExpense(p => ({ ...p, frequency: e.target.value }))} style={styles.formSelect}><option value="weekly">Weekly</option><option value="semimonthly">Twice a month (15th &amp; EOM)</option><option value="monthly">Monthly</option><option value="yearly">Yearly</option></select></div>
                {newRecurringExpense.frequency === 'weekly' && (<div style={styles.formGroup}><label style={styles.formLabel}>Day of Week</label><select value={newRecurringExpense.dayOfWeek} onChange={e => setNewRecurringExpense(p => ({ ...p, dayOfWeek: parseInt(e.target.value) }))} style={styles.formSelect}>{dayNames.map((day, idx) => <option key={day} value={idx}>{day}</option>)}</select></div>)}
                {newRecurringExpense.frequency === 'monthly' && (<div style={styles.formGroup}><label style={styles.formLabel}>Day of Month (1-31)</label><input type="number" min="1" max="31" value={newRecurringExpense.dayOfMonth} onChange={e => setNewRecurringExpense(p => ({ ...p, dayOfMonth: e.target.value }))} style={styles.formInput} /></div>)}
                {newRecurringExpense.frequency === 'yearly' && (<><div style={styles.formGroup}><label style={styles.formLabel}>Month</label><select value={newRecurringExpense.month} onChange={e => setNewRecurringExpense(p => ({ ...p, month: parseInt(e.target.value) }))} style={styles.formSelect}>{months.map((month, idx) => <option key={month} value={idx}>{month}</option>)}</select></div><div style={styles.formGroup}><label style={styles.formLabel}>Day</label><input type="number" min="1" max="31" value={newRecurringExpense.day} onChange={e => setNewRecurringExpense(p => ({ ...p, day: e.target.value }))} style={styles.formInput} /></div></>)}
                {debts.length > 0 && (
                  <div style={styles.formGroup}>
                    <label style={styles.formLabel}>Link to debt (optional)</label>
                    <select value={newRecurringExpense.debtId || ''} onChange={e => setNewRecurringExpense(p => ({ ...p, debtId: e.target.value }))} style={styles.formSelect}>
                      <option value="">None</option>
                      {debts.map(d => <option key={d.id} value={d.id}>{d.name}</option>)}
                    </select>
                    {newRecurringExpense.debtId && <div style={styles.formHint}>This payment drives the linked debt&rsquo;s payoff, and stops automatically once the debt is cleared.</div>}
                  </div>
                )}
                <div className="app-form-actions" style={styles.formActions}><button style={styles.cancelBtn} onClick={() => setShowRecurringExpenseForm(false)}>Cancel</button><button style={styles.submitBtn} onClick={addRecurringExpense}>{isEditing ? 'Save Changes' : 'Add Expense'}</button></div>
              </div>
            </div>
          )}

          {showOneOffExpenseForm && (
            <div style={styles.formOverlay} onClick={() => { setShowOneOffExpenseForm(false); setAddOneOffFromCalendar(null); }}>
              <div className="app-form-card" style={styles.formCard} onClick={e => e.stopPropagation()}>
                <h3 style={styles.formTitle}>{isEditing ? 'Edit One-Off Expense' : 'Add One-Off Expense'}</h3>
                <div style={styles.formGroup}><label style={styles.formLabel}>Name</label><input type="text" placeholder="e.g., Car repair, Gift, Trip" value={newOneOffExpense.name} onChange={e => setNewOneOffExpense(p => ({ ...p, name: e.target.value }))} style={styles.formInput} /></div>
                <div style={styles.formGroup}><label style={styles.formLabel}>Amount</label><input type="number" placeholder="0.00" value={newOneOffExpense.amount} onChange={e => setNewOneOffExpense(p => ({ ...p, amount: e.target.value }))} style={styles.formInput} /></div>
                <div style={styles.formGroup}><label style={styles.formLabel}>Date</label><input type="date" value={newOneOffExpense.date} onChange={e => setNewOneOffExpense(p => ({ ...p, date: e.target.value }))} style={styles.formInput} />{addOneOffFromCalendar && <div style={styles.formHint}>Selected: {formatFullDate(new Date(addOneOffFromCalendar + 'T00:00:00'))}</div>}</div>
                <div className="app-form-actions" style={styles.formActions}><button style={styles.cancelBtn} onClick={() => { setShowOneOffExpenseForm(false); setAddOneOffFromCalendar(null); }}>Cancel</button><button style={styles.submitBtn} onClick={addOneOffExpense}>{isEditing ? 'Save Changes' : 'Add Expense'}</button></div>
              </div>
            </div>
          )}

          {showOneOffIncomeForm && (
            <div style={styles.formOverlay} onClick={() => setShowOneOffIncomeForm(false)}>
              <div className="app-form-card" style={styles.formCard} onClick={e => e.stopPropagation()}>
                <h3 style={styles.formTitle}>{isEditing ? 'Edit One-Off Income' : 'Add One-Off Income'}</h3>
                <div style={styles.formGroup}><label style={styles.formLabel}>Name</label><input type="text" placeholder="e.g., Bonus, Tax refund, Gift" value={newOneOffIncome.name} onChange={e => setNewOneOffIncome(p => ({ ...p, name: e.target.value }))} style={styles.formInput} /></div>
                <div style={styles.formGroup}><label style={styles.formLabel}>Amount</label><input type="number" placeholder="0.00" value={newOneOffIncome.amount} onChange={e => setNewOneOffIncome(p => ({ ...p, amount: e.target.value }))} style={styles.formInput} /></div>
                <div style={styles.formGroup}><label style={styles.formLabel}>Date</label><input type="date" value={newOneOffIncome.date} onChange={e => setNewOneOffIncome(p => ({ ...p, date: e.target.value }))} style={styles.formInput} /></div>
                <div className="app-form-actions" style={styles.formActions}><button style={styles.cancelBtn} onClick={() => setShowOneOffIncomeForm(false)}>Cancel</button><button style={styles.submitBtn} onClick={addOneOffIncome}>{isEditing ? 'Save Changes' : 'Add Income'}</button></div>
              </div>
            </div>
          )}

          {showDebtForm && (
            <div style={styles.formOverlay} onClick={() => setShowDebtForm(false)}>
              <div className="app-form-card" style={styles.formCard} onClick={e => e.stopPropagation()}>
                <h3 style={styles.formTitle}>{isEditing ? 'Edit Debt' : 'Add Debt'}</h3>
                <div style={styles.formGroup}><label style={styles.formLabel}>Name</label><input type="text" placeholder="e.g., Chase Sapphire, Car loan" value={newDebt.name} onChange={e => setNewDebt(p => ({ ...p, name: e.target.value }))} style={styles.formInput} /></div>
                <div style={styles.formGroup}><label style={styles.formLabel}>Type</label><select value={newDebt.type} onChange={e => setNewDebt(p => ({ ...p, type: e.target.value }))} style={styles.formSelect}><option value="credit-card">Credit card</option><option value="loan">Loan</option><option value="auto">Auto loan</option><option value="student">Student loan</option><option value="other">Other</option></select></div>
                <div style={styles.formGroup}><label style={styles.formLabel}>Current Balance</label><input type="number" placeholder="0.00" value={newDebt.balance} onChange={e => setNewDebt(p => ({ ...p, balance: e.target.value }))} style={styles.formInput} /></div>
                <div style={styles.formGroup}><label style={styles.formLabel}>APR (annual %)</label><input type="number" step="0.01" placeholder="e.g., 19.99" value={newDebt.apr} onChange={e => setNewDebt(p => ({ ...p, apr: e.target.value }))} style={styles.formInput} /></div>
                <div style={styles.formGroup}><label style={styles.formLabel}>Monthly Payment (optional)</label><input type="number" placeholder="Used only if no recurring expense is linked" value={newDebt.monthlyPayment} onChange={e => setNewDebt(p => ({ ...p, monthlyPayment: e.target.value }))} style={styles.formInput} /><div style={styles.formHint}>Tip: instead, link the recurring expense that pays this debt — its amount becomes the source of truth.</div></div>
                <div style={styles.formGroup}><label style={styles.formLabel}>Extra Monthly Payment (optional)</label><input type="number" placeholder="0.00" value={newDebt.extraPayment} onChange={e => setNewDebt(p => ({ ...p, extraPayment: e.target.value }))} style={styles.formInput} /></div>
                <div className="app-form-actions" style={styles.formActions}><button style={styles.cancelBtn} onClick={() => setShowDebtForm(false)}>Cancel</button><button style={styles.submitBtn} onClick={addDebt}>{isEditing ? 'Save Changes' : 'Add Debt'}</button></div>
              </div>
            </div>
          )}

          {occEditor && <OccurrenceEditor editor={occEditor} onClose={() => setOccEditor(null)} onApply={applyOccurrenceException} onReset={resetOccurrence} styles={styles} />}
        </div>
      );
    }

    function AppShell() {
      const getInitialView = () => {
        const hash = window.location.hash;
        if (hash.startsWith('#app')) return 'app';
        return 'home';
      };

      const [currentView, setCurrentView] = useState(getInitialView);
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);

      const changeView = (view) => {
        setCurrentView(view);
        if (view === 'home') {
          window.history.replaceState(null, '', window.location.pathname);
        } else {
          const m = window.location.hash.match(/#app(\/[a-z]+)?/);
          const subView = (m && m[1]) ? m[1] : '/dashboard';
          window.history.replaceState(null, '', '#app' + subView);
        }
      };

      useEffect(() => {
        const handleHashChange = () => {
          const hash = window.location.hash;
          if (hash.startsWith('#app')) {
            setCurrentView('app');
          } else {
            setCurrentView('home');
          }
        };
        window.addEventListener('hashchange', handleHashChange);
        return () => window.removeEventListener('hashchange', handleHashChange);
      }, []);

      useEffect(() => {
        api.getUser()
          .then(userData => {
            setUser(userData);
            setAuthLoading(false);
          })
          .catch(() => {
            setAuthLoading(false);
          });
      }, []);

      if (authLoading) {
        return (
          <div className="loading-screen">
            <div className="loading-spinner"></div>
            <span>Loading Mercury...</span>
          </div>
        );
      }

      if (currentView === 'app' && !user) {
        window.location.href = '/api/login';
        return null;
      }

      return currentView === 'home' 
        ? <HomePage onEnterApp={() => changeView('app')} user={user} />
        : <FinancialTracker onBackToHome={() => changeView('home')} user={user} />;
    }

    ReactDOM.render(<AppShell />, document.getElementById('root'));
  </script>
</body>
</html>
