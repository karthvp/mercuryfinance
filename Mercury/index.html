        const totalDebt = debts.reduce((s, d) => s + (d.balance || 0), 0);
        const totalMonthly = debts.reduce((s, d) => { const p = debtPlan.byDebt[d.id]; return s + (p && p.payment ? p.payment : 0); }, 0);
        const weightedApr = totalDebt > 0 ? debts.reduce((s, d) => s + (d.balance || 0) * (d.apr || 0), 0) / totalDebt : 0;
        let latestPayoff = null, anyUnresolved = false;
        debts.forEach(d => { const p = debtPlan.byDebt[d.id]; if (p && p.payoffDateKey) { if (!latestPayoff || p.payoffDateKey > latestPayoff) latestPayoff = p.payoffDateKey; } if (p && (p.neverPays || p.noSource)) anyUnresolved = true; });
        const editBtn = { padding: '0.375rem', background: 'var(--accent-bg)', border: '1px solid var(--accent-border)', borderRadius: '6px', color: 'var(--accent)', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' };
        const warnBox = { display: 'flex', alignItems: 'center', gap: '0.5rem', marginTop: '0.875rem', padding: '0.625rem 0.875rem', background: 'var(--warning-bg)', border: '1px solid var(--warning)', borderRadius: '10px', fontSize: '0.8125rem', color: 'var(--warning)', lineHeight: 1.45 };
        const payablePlanCount = debts.filter(d => { const pp = debtPlan.byDebt[d.id]; return pp && pp.payment && !pp.neverPays && !pp.noSource; }).length;
        const snowballAvailable = payablePlanCount >= 2;
        const monthsSaved = debtProjectionStd.months - debtProjectionSnow.months;
        const interestSaved = debtProjectionStd.totalInterest - debtProjectionSnow.totalInterest;
        const segBtn = (active) => ({ padding: '0.3125rem 0.75rem', fontSize: '0.75rem', fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit', border: '1px solid ' + (active ? 'var(--accent-border-strong)' : 'var(--border-light)'), background: active ? 'var(--accent-bg)' : 'transparent', color: active ? 'var(--accent)' : 'var(--text-muted)', transition: 'all 0.2s ease' });

        return (
          <div>
            <div style={{ ...styles.yearSelector, justifyContent: 'space-between', flexWrap: 'wrap' }} className="app-year-selector">
              <div style={styles.panelTitle}><Icons.Debt /> Debt Payoff Planner</div>
              <button style={styles.addButton} onClick={() => setShowDebtForm(true)}><Icons.Plus /> Add Debt</button>
            </div>

            {debts.length === 0 ? (
              <div className="app-panel" style={styles.panel}>
                <div style={{ ...styles.emptyState, padding: '2.5rem 1.5rem', lineHeight: 1.6 }}>
                  No debts yet. Add a credit card, loan, or other debt — then link it to the recurring expense that pays it, and Mercury will project your payoff date, interest, and stop the payment in your forecast once it&rsquo;s cleared.
                </div>
              </div>
            ) : (
              <>
                <div className="app-dashboard-grid" style={styles.dashboardGrid}>
                  <div className="app-stat-card" style={styles.statCard()}><div style={styles.statCardAccent('var(--danger)')} /><div style={styles.statLabel}>Total Debt</div><div className="app-stat-value" style={styles.statValue('var(--danger)')}>{formatCurrency(totalDebt)}</div></div>
                  <div className="app-stat-card" style={styles.statCard()}><div style={styles.statCardAccent('var(--accent)')} /><div style={styles.statLabel}>Monthly Debt Payment</div><div className="app-stat-value" style={styles.statValue('var(--accent)')}>{formatCurrency(totalMonthly)}</div><div style={styles.statSubtext}>Across all debts</div></div>
                  <div className="app-stat-card" style={styles.statCard()}><div style={styles.statCardAccent('var(--warning)')} /><div style={styles.statLabel}>Avg APR (weighted)</div><div className="app-stat-value" style={styles.statValue('var(--warning)')}>{weightedApr.toFixed(2)}%</div></div>
                  <div className="app-stat-card" style={styles.statCard()}><div style={styles.statCardAccent('var(--success)')} /><div style={styles.statLabel}>Debt-Free By</div><div className="app-stat-value" style={styles.statValue(anyUnresolved ? 'var(--warning)' : 'var(--success)')}>{latestPayoff ? formatFullDate(parseDateKey(latestPayoff)) : '—'}</div><div style={styles.statSubtext}>{anyUnresolved ? 'Some debts need a payment' : (latestPayoff ? 'Latest payoff across debts' : '')}</div></div>
                </div>

                {debtProjection.points.length > 0 && (
                  <>
                    <div style={{ display: 'flex', alignItems: 'flex-start', gap: '0.625rem', padding: '0.875rem 1.125rem', background: 'var(--success-bg)', border: '1px solid var(--success)', borderRadius: '14px', marginBottom: '1.5rem', lineHeight: 1.5 }}>
                      <span style={{ color: 'var(--success)', display: 'flex', flexShrink: 0, marginTop: '2px' }}><Icons.TrendUp /></span>
                      <div style={{ fontSize: '0.9375rem', color: 'var(--text-secondary)' }}>
                        On your current plan you&rsquo;ll be <strong style={{ color: 'var(--text-primary)' }}>debt-free in {debtProjection.months} months</strong>{latestPayoff && <> — by <strong style={{ color: 'var(--success)' }}>{formatFullDate(parseDateKey(latestPayoff))}</strong></>}, paying <strong style={{ color: 'var(--warning)' }}>{formatCurrency(debtProjection.totalInterest)}</strong> in interest along the way. Even a small extra payment each month gets you there sooner and saves interest.{debtProjection.hasResidual && <span style={{ color: 'var(--text-muted)' }}> (Some debts have no payment plan yet — set one to include them.)</span>}
                      </div>
                    </div>

                    <div className="app-panel" style={{ ...styles.panel, marginBottom: '1.5rem' }}>
                      <div className="app-panel-header" style={styles.panelHeader}>
                        <div style={styles.panelTitle}><Icons.TrendUp /> Watch your debt disappear</div>
                        {snowballAvailable && (
                          <div style={{ display: 'inline-flex', borderRadius: '8px', overflow: 'hidden', flexShrink: 0 }} role="group" aria-label="Payoff strategy">
                            <button style={{ ...segBtn(!snowballMode), borderTopRightRadius: 0, borderBottomRightRadius: 0 }} onClick={() => setSnowballMode(false)}>Standard</button>
                            <button style={{ ...segBtn(snowballMode), borderLeft: 'none', borderTopLeftRadius: 0, borderBottomLeftRadius: 0 }} onClick={() => setSnowballMode(true)}>Snowball</button>
                          </div>
                        )}
                      </div>
                      <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)', margin: '0 0 0.5rem' }}>
                        {snowballMode
                          ? 'Snowball: when a debt is cleared, its payment rolls into the next-smallest debt — so the total falls faster (dashed line = paying each separately).'
                          : 'Projected total balance across debts with a payment plan, shrinking to $0.'}
                      </div>
                      {snowballAvailable && snowballMode && monthsSaved > 0 && (
                        <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', marginBottom: '0.75rem', padding: '0.625rem 0.875rem', background: 'var(--success-bg)', border: '1px solid var(--success)', borderRadius: '10px', fontSize: '0.8125rem', color: 'var(--text-secondary)' }}>
                          <span style={{ color: 'var(--success)', display: 'flex', flexShrink: 0 }}><Icons.TrendUp /></span>
                          <span>Snowballing clears your debt <strong style={{ color: 'var(--success)' }}>{monthsSaved} month{monthsSaved !== 1 ? 's' : ''} sooner</strong> and saves <strong style={{ color: 'var(--success)' }}>{formatCurrency(interestSaved)}</strong> in interest — at no extra cost to your budget.</span>
                        </div>
                      )}
                      <div style={{ height: 280 }}><canvas ref={debtChartRef}></canvas></div>
                    </div>
                  </>
                )}

                <div style={{ marginTop: '0.5rem' }}>
                  {debts.map(debt => {
                    const p = debtPlan.byDebt[debt.id] || {};
                    const principalW = (debt.balance || 0);
                    const interestW = isFinite(p.totalInterest) ? p.totalInterest : 0;
                    const totalW = principalW + interestW || 1;
                    return (
                      <div key={debt.id} className="app-panel" style={{ ...styles.panel, marginBottom: '1rem' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: '1rem', flexWrap: 'wrap' }}>
                          <div style={{ minWidth: 0 }}>
                            <div style={{ fontSize: '1.0625rem', fontWeight: 600, color: 'var(--text-primary)', display: 'flex', alignItems: 'center', gap: '0.5rem', flexWrap: 'wrap' }}>
                              {debt.name}
                              <span style={{ fontSize: '0.625rem', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.04em', color: 'var(--text-muted)', background: 'var(--bg-surface)', border: '1px solid var(--border-light)', borderRadius: '999px', padding: '0.125rem 0.5rem' }}>{debtTypeLabels[debt.type] || 'Other'}</span>
                            </div>
                            <div style={{ fontSize: '0.8125rem', color: 'var(--text-muted)', marginTop: '0.25rem' }}>
                              {debt.apr}% APR · {p.payment ? <>{formatCurrency(p.payment)}/mo {p.linkedNames && p.linkedNames.length > 0 ? <>from <strong style={{ color: 'var(--text-secondary)' }}>{p.linkedNames.join(', ')}</strong></> : '(manual)'}</> : 'no payment set'}
                            </div>
                          </div>
                          <div style={{ textAlign: 'right', flexShrink: 0 }}>
                            <div className="app-debt-balance" style={{ fontFamily: '"Playfair Display", serif', fontSize: '1.5rem', fontWeight: 600, color: 'var(--danger)', lineHeight: 1.1 }}>{formatCurrency(debt.balance)}</div>
                            <div style={{ display: 'flex', gap: '0.5rem', justifyContent: 'flex-end', marginTop: '0.5rem' }}>
                              <button className="icon-btn" aria-label={`Edit debt ${debt.name}`} style={editBtn} onClick={() => editDebt(debt)}><Icons.Edit /></button>
                              <button className="icon-btn" aria-label={`Delete debt ${debt.name}`} style={styles.deleteBtn} onClick={() => deleteDebt(debt.id)}><Icons.Trash /></button>
                            </div>
                          </div>
                        </div>

                        {(p.noSource || p.neverPays) ? (
                          <div style={warnBox}>
                            <span style={{ display: 'flex', flexShrink: 0 }}><Icons.Warning /></span>
                            {p.noSource ? 'No payment source — link a recurring expense or set a monthly payment to see the payoff.' : 'The payment doesn’t cover the monthly interest, so this debt never pays off. Increase the payment or add an extra payment.'}
                          </div>
                        ) : (
                          <>
                            <div style={{ display: 'flex', gap: '1.5rem', flexWrap: 'wrap', marginTop: '0.875rem', fontSize: '0.8125rem' }}>
                              <div><span style={{ color: 'var(--text-muted)' }}>Payoff </span><strong style={{ color: 'var(--text-primary)' }}>{p.payoffDateKey ? formatFullDate(parseDateKey(p.payoffDateKey)) : '—'}</strong>{p.months != null && <span style={{ color: 'var(--text-dim)' }}> ({p.months} mo)</span>}</div>
                              <div><span style={{ color: 'var(--text-muted)' }}>Total interest </span><strong style={{ color: 'var(--warning)' }}>{formatCurrency(p.totalInterest || 0)}</strong></div>
                            </div>
                            <div style={{ marginTop: '0.625rem', height: '8px', borderRadius: '999px', overflow: 'hidden', display: 'flex', background: 'var(--bg-surface)', border: '1px solid var(--border-subtle)' }} title={`Principal ${formatCurrency(principalW)} vs interest ${formatCurrency(interestW)}`}>
                              <div style={{ width: `${(principalW / totalW) * 100}%`, background: 'var(--accent)' }} />
                              <div style={{ width: `${(interestW / totalW) * 100}%`, background: 'var(--warning)' }} />
                            </div>
                            <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: '0.375rem', fontSize: '0.6875rem', color: 'var(--text-dim)' }}>
                              <span>Principal {formatCurrency(principalW)}</span>
                              <span>Interest {formatCurrency(interestW)}</span>
                            </div>
                          </>
                        )}
                      </div>
                    );
                  })}
                </div>
              </>
            )}
          </div>
        );
      };

      const renderCalendar = () => {
        return (
          <div className="app-table-container" style={styles.tableContainer}>
            <div className="app-month-selector" style={styles.monthSelector}>
              {months.map((month, idx) => (<button key={month} style={styles.monthBtn(scrollToMonth === idx)} onClick={() => setScrollToMonth(idx)}>{month.slice(0, 3)}</button>))}
            </div>
            <div className="app-table-header" style={styles.tableHeader}>
              <div className="app-table-header-cell" style={styles.tableHeaderCell}>Date</div>
              <div className="app-table-header-cell app-hide-xs" style={styles.tableHeaderCell}>Day</div>
              <div className="app-table-header-cell" style={styles.tableHeaderCell}>Activity</div>
              <div className="app-table-header-cell" style={styles.tableHeaderCell}>Starting</div>
              <div className="app-table-header-cell app-hide-mobile" style={styles.tableHeaderCell}>Expenses</div>
              <div className="app-table-header-cell" style={styles.tableHeaderCell}>Ending</div>
              <div className="app-table-header-cell app-hide-mobile" style={styles.tableHeaderCell}></div>
            </div>
            <div style={styles.tableBody}>
              {financialData.map((day, idx) => {
                const isMonthStart = day.dayOfMonth === 1;
                const prevMonth = idx > 0 ? financialData[idx - 1].month : -1;
                const showMonthDivider = day.month !== prevMonth;

                return (
                  <Fragment key={day.dateKey}>
                    {showMonthDivider && (<div style={styles.monthDivider} ref={el => monthRefs.current[day.month] = el}><span style={styles.monthLabel}>{months[day.month]} {day.year}</span></div>)}
                    <div ref={day.isToday ? todayRowRef : null} className="app-table-row" style={styles.tableRow(day.isToday, day.isPast, isMonthStart)} onDragOver={handleDragOver} onDrop={(e) => handleDrop(e, day.dateKey)}>
                      <div className="app-table-cell" style={styles.tableCell}>{formatDate(day.date)}</div>
                      <div className="app-table-cell app-hide-xs" style={styles.tableCell}>{day.dayOfWeek}</div>
                      <div className="app-table-cell" style={{ ...styles.tableCell, flexWrap: 'wrap' }}>
                        <div style={styles.expensesList}>
                          {ledgerState && <>
                            {visibleLedgerOccurrences.filter(o => o.date === day.dateKey).map(o => <button key={o.key} type="button" style={{ ...styles.recurringExpenseBadge, color: o.direction === 'income' ? 'var(--success)' : 'var(--text-secondary)', cursor: 'pointer', textAlign: 'left' }} onClick={() => {
                              const detail = { ...o, amount: o.amountCents / 100 };
                              if (o.kind === 'recurring') openOccurrenceEditor(o.direction, detail, day.dateKey);
                              else if (o.direction === 'income') editOneOffIncome({ ...detail, date: o.date });
                              else editOneOffExpense({ ...detail, date: o.date });
                            }} title="Edit this planned occurrence">{o.direction === 'income' ? '+' : '−'}{MercuryLedger.money(o.amountCents)} {o.name} · {o.status}{o.remainingCents > 0 && o.allocatedCents > 0 ? ` · ${MercuryLedger.money(o.remainingCents)} remaining` : ''}</button>)}
                            {ledgerState.ledger.transactions.filter(t => t.date === day.dateKey && (ledgerAccount === 'all' || t.accountId === ledgerAccount)).map(t => {
                              const allocated = ledgerState.ledger.allocations.filter(a => a.transactionId === t.id).reduce((sum, a) => sum + a.amountCents, 0);
                              return <button key={t.id} type="button" style={{ ...styles.payrollBadge, cursor: 'pointer', textAlign: 'left' }} onClick={() => setActiveView('accounts')}>{t.direction === 'income' ? '+' : '−'}{MercuryLedger.money(t.amountCents)} {t.description} · Actual · {allocated === t.amountCents ? 'Matched' : `Unmatched ${MercuryLedger.money(t.amountCents - allocated)}`}</button>;
                            })}
                          </>}
                          {!ledgerState && <>
                          {day.payrollDetails.map((p, i) => (
                            p.kind === 'recurring'
                              ? <span key={i} draggable="true" onDragStart={(ev) => handleDragStart(ev, { type: 'recurringIncome', id: p.id, origin: p.origin })} onDragEnd={handleDragEnd} onClick={() => openOccurrenceEditor('income', p, day.dateKey)} style={{ ...styles.payrollBadge, cursor: 'grab' }} title="Drag to move · click to adjust or skip">+{formatCurrency(p.amount)} {p.name}{(p.moved || p.adjusted) ? ' ·' : ''}</span>
                              : <span key={i} draggable="true" onDragStart={(ev) => handleDragStart(ev, { type: 'oneoffIncome', id: p.id })} onDragEnd={handleDragEnd} onClick={() => editOneOffIncome(p)} style={{ ...styles.payrollBadge, cursor: 'grab' }} title="Drag to move · click to edit">+{formatCurrency(p.amount)} {p.name}</span>
                          ))}
                          {day.expenseDetails.map((e, i) => (
                            e.isRecurring
                              ? <span key={i} draggable="true" onDragStart={(ev) => handleDragStart(ev, { type: 'recurringExpense', id: e.id, origin: e.origin })} onDragEnd={handleDragEnd} onClick={() => openOccurrenceEditor('expense', e, day.dateKey)} style={{ ...styles.recurringExpenseBadge, cursor: 'grab' }} title="Drag to move · click to adjust or skip">-{formatCurrency(e.amount)} {e.name}{(e.moved || e.adjusted) ? ' ·' : ''}</span>
                              : <span key={i} draggable="true" onDragStart={(ev) => handleDragStart(ev, { type: 'oneoffExpense', id: e.id })} onDragEnd={handleDragEnd} onClick={() => editOneOffExpense(e)} style={{ ...styles.oneOffExpenseBadge, cursor: 'grab' }} title="Drag to move · click to edit">-{formatCurrency(e.amount)} {e.name}</span>
                          ))}
                          </>}
                        </div>
                      </div>
                      <div className="app-table-cell" style={styles.tableCell}>
                        {editingCell === day.dateKey ? (
                          <div style={{ display: 'flex', alignItems: 'center' }}>
                            <input type="number" value={editValue} onChange={(e) => setEditValue(e.target.value)} style={styles.inlineInput} autoFocus onKeyDown={(e) => { if (e.key === 'Enter') handleOverrideBalance(day.dateKey, editValue); if (e.key === 'Escape') setEditingCell(null); }} />
                            <div style={styles.inlineActions}>
                              <button className="icon-btn" aria-label="Save balance check-in" style={{ ...styles.inlineBtn('52, 211, 153'), color: 'var(--success)' }} onClick={() => handleOverrideBalance(day.dateKey, editValue)}><Icons.Check /></button>
                              <button className="icon-btn" aria-label="Cancel edit" style={{ ...styles.inlineBtn('251, 113, 133'), color: 'var(--danger)' }} onClick={() => setEditingCell(null)}><Icons.X /></button>

                          </div>

                          <span style={day.startingBalance >= 0 ? styles.balancePositive : styles.balanceNegative}>
                            {formatCurrency(day.startingBalance)}

                            <button className="icon-btn" aria-label="Record actual balance (check-in)" title="Start-of-day checkpoint. Select a single account first when using multiple accounts." style={styles.editButton} onClick={() => {
                              if (ledgerState && ledgerAccount === 'all' && ledgerState.ledger.accounts.length > 1) { setLedgerError('Choose one forecast account before recording its starting balance.'); return; }
                              setEditingCell(day.dateKey); setEditValue(day.startingBalance.toString());
                            }}><Icons.Edit /></button>
                          </span>
                        )}
                      </div>
                      <div className="app-table-cell app-hide-mobile" style={{ ...styles.tableCell, ...styles.expenseCell }}>{day.expenses > 0 ? `-${formatCurrency(day.expenses)}` : '-'}</div>
                      <div className="app-table-cell" style={styles.tableCell}><span style={day.endingBalance >= 0 ? styles.balancePositive : styles.balanceNegative}>{formatCurrency(day.endingBalance)}</span></div>
                      <div className="app-table-cell app-hide-mobile" style={styles.tableCell}><button className="icon-btn" aria-label="Add one-off expense on this day" style={styles.addExpenseBtn} onClick={() => openOneOffFormForDate(day.dateKey)} title="Add expense"><Icons.Plus /></button></div>
                    </div>
                  </Fragment>
                );
              })}
            </div>
          </div>
        );
      };

      return (
        <div style={styles.container}>
          <header className="app-header" style={styles.header}>
            <div className="app-header-content" style={styles.headerContent}>
              <div className="app-header-brand" style={styles.logo} onClick={onBackToHome}><div style={styles.logoIcon}><Icons.Mercury /></div><span className="app-logo-text" style={styles.logoText}>Mercury</span><span className="app-year-badge" style={styles.yearBadge}>{activeYear}</span></div>
              <nav className="app-nav" style={styles.nav}>
                <button className="app-nav-btn" style={styles.navButton(activeView === 'dashboard')} onClick={() => setActiveView('dashboard')}><Icons.Dashboard /> Dashboard</button>
                <button className="app-nav-btn" style={styles.navButton(activeView === 'cashflow')} onClick={() => setActiveView('cashflow')}><Icons.CashFlow /> Cash Flow</button>
                <button className="app-nav-btn" style={styles.navButton(activeView === 'debt')} onClick={() => setActiveView('debt')}><Icons.Debt /> Debt</button>
                <button className="app-nav-btn" style={styles.navButton(activeView === 'calendar')} onClick={() => setActiveView('calendar')}><Icons.Calendar /> Calendar</button>
                <button className="app-nav-btn" style={styles.navButton(activeView === 'accounts')} onClick={() => setActiveView('accounts')}>Actuals</button>
              </nav>
              <div className="app-header-actions" style={styles.headerActions}>
                <button type="button" className="theme-toggle" onClick={toggleTheme} aria-label={isDark ? 'Switch to light theme' : 'Switch to dark theme'} title={isDark ? 'Switch to light theme' : 'Switch to dark theme'}>
                  {isDark ? <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg> : <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M20.4 15.5A8.4 8.4 0 0 1 8.5 3.6 8.5 8.5 0 1 0 20.4 15.5Z"/></svg>}
                </button>
                <div className="app-hide-mobile" style={styles.saveIndicator(saveState)} role="status" aria-live="polite">
                  {saveState === 'saving' ? <><Icons.Cloud /> Saving…</> : saveState === 'error' ? <><Icons.Warning /> Save failed</> : <><Icons.Check /> Saved</>}
                </div>
                {user && (
                  <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', padding: '0.3125rem 0.5rem 0.3125rem 0.625rem', background: 'var(--bg-surface)', borderRadius: '999px', border: '1px solid var(--border-light)' }}>
                    {user.profile_image ? (
                      <img src={user.profile_image} alt="" style={{ width: '28px', height: '28px', borderRadius: '50%', objectFit: 'cover', border: '2px solid var(--accent-border-strong)' }} />
                    ) : (
                      <div style={{ width: '28px', height: '28px', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'var(--accent-bg)', color: 'var(--accent)' }}><Icons.User /></div>
                    )}
                    <span className="app-hide-mobile" title={user.email || ''} style={{ color: 'var(--text-primary)', fontSize: '0.8125rem', fontWeight: '500', maxWidth: '140px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{user.first_name || (user.email ? user.email.split('@')[0] : 'User')}</span>
                    <button type="button" onClick={handleLogout} className="icon-btn" style={{ display: 'flex', alignItems: 'center', color: 'var(--text-muted)', padding: '0.375rem', borderRadius: '50%', transition: 'color 0.2s, background 0.2s' }} title="Sign out" aria-label="Sign out"><Icons.LogOut /></button>
                  </div>
                )}
              </div>
            </div>
          </header>
          <main className="app-main" style={styles.main}>
            {planSaveError && <div role="alert" className="lw-notice is-error">Plan changes were not saved: {planSaveError}. Your last saved plan is preserved. <button type="button" onClick={() => setActiveView('accounts')}>Review matches</button></div>}
            {ledgerError && activeView !== 'accounts' && <div role="alert" className="lw-notice is-error">{ledgerError} <button onClick={() => setActiveView('accounts')}>Review accounts</button></div>}
            {ledgerState && activeView !== 'accounts' && <section className="lw-card" style={{ marginBottom: '1.5rem', padding: '1rem' }}>
              <label className="lw-field">Forecast account
                <select aria-label="Forecast account" value={ledgerAccount} onChange={e => setLedgerAccount(e.target.value)}>
                  <option value="all">All accounts · combined only</option>
                  {ledgerState.ledger.accounts.map(a => <option key={a.id} value={a.id}>{a.name}{a.archived ? ' · archived' : ''}</option>)}
                </select>
              </label>
              <p className="lw-help">Provisional forecast: {ledgerUnreviewed} actual transactions with unallocated amounts · {ledgerOverdue} overdue plans to review. Savings do not automatically fund checking.</p>
              {ledgerRisks.map(({ account, day }) => <p key={account.id} role="status" className="lw-help"><strong>{account.name}</strong>: projected shortfall {MercuryLedger.money(day.endingCents)} on {day.date}, even when the combined balance is positive. Review this account’s plan.</p>)}
              <p className="lw-help">Opening-account history before {ledgerState.ledger.cutoverDate} is your legacy plan, not confirmed bank activity. Legacy checkpoints are estimates until you verify them. New checkpoints mean start of day in {ledgerState.ledger.timeZone}; same-day transactions follow that balance.</p>
              <button type="button" className="lw-text-button" onClick={() => setActiveView('accounts')}>Accounts, balances &amp; matching</button>
            </section>}
            {activeView === 'accounts'
              ? ledgerState
                ? <window.LedgerWorkspace ledger={ledgerState.ledger} plan={reconciliationPlan} year={dashboardYear} today={todayKey} onSave={saveLedger} onRefresh={refreshLedger} busy={ledgerBusy} error={ledgerError} />
                : <section className="lw-card"><h2>Accounts &amp; actuals</h2><p role={ledgerError ? 'alert' : 'status'}>{ledgerError || 'Loading your reconciliation workspace…'}</p>{ledgerError && <button onClick={() => refreshLedger().catch(() => {})}>Retry loading</button>}</section>
              : activeView === 'dashboard' ? renderDashboard() : activeView === 'cashflow' ? renderCashFlow() : activeView === 'debt' ? renderDebt() : renderCalendar()}
          </main>

          {showPayrollForm && (
            <div style={styles.formOverlay} onClick={() => setShowPayrollForm(false)}>
              <div className="app-form-card" style={styles.formCard} onClick={e => e.stopPropagation()}>
                <h3 style={styles.formTitle}>{isEditing ? 'Edit Income Source' : 'Add Income Source'}</h3>
                <div style={styles.formGroup}><label style={styles.formLabel}>Name</label><input type="text" placeholder="e.g., Salary, Freelance" value={newPayroll.name} onChange={e => setNewPayroll(p => ({ ...p, name: e.target.value }))} style={styles.formInput} /></div>
                <div style={styles.formGroup}><label style={styles.formLabel}>Amount (per payment)</label><input type="number" placeholder="0.00" value={newPayroll.amount} onChange={e => setNewPayroll(p => ({ ...p, amount: e.target.value }))} style={styles.formInput} /></div>
                <div style={styles.formGroup}><label style={styles.formLabel}>Frequency</label><select value={newPayroll.frequency} onChange={e => setNewPayroll(p => ({ ...p, frequency: e.target.value }))} style={styles.formSelect}><option value="weekly">Weekly</option><option value="biweekly">Biweekly</option><option value="monthly">Monthly (specific day)</option><option value="semimonthly">Semi-monthly (15th & EOM weekdays)</option><option value="last-weekday-15th">Last weekday before 15th only</option><option value="last-weekday-eom">Last weekday of month only</option></select></div>
                {['weekly', 'biweekly', 'monthly'].includes(newPayroll.frequency) && (<div style={styles.formGroup}><label style={styles.formLabel}>{newPayroll.frequency === 'monthly' ? 'Day of Month (1-31)' : 'Start Day (1-31)'}</label><input type="number" min="1" max="31" value={newPayroll.startDay} onChange={e => setNewPayroll(p => ({ ...p, startDay: e.target.value }))} style={styles.formInput} /><div style={styles.formHint}>{newPayroll.frequency === 'biweekly' && 'First paycheck date in January, then every 14 days'}{newPayroll.frequency === 'weekly' && 'First paycheck date in January, then every 7 days'}</div></div>)}
                <div className="app-form-actions" style={styles.formActions}><button style={styles.cancelBtn} onClick={() => setShowPayrollForm(false)}>Cancel</button><button style={styles.submitBtn} onClick={addPayroll}>{isEditing ? 'Save Changes' : 'Add Income'}</button></div>
              </div>
            </div>
          )}

          {showRecurringExpenseForm && (
            <div style={styles.formOverlay} onClick={() => setShowRecurringExpenseForm(false)}>
              <div className="app-form-card" style={styles.formCard} onClick={e => e.stopPropagation()}>
                <h3 style={styles.formTitle}>{isEditing ? 'Edit Recurring Expense' : 'Add Recurring Expense'}</h3>
                <div style={styles.formGroup}><label style={styles.formLabel}>Name</label><input type="text" placeholder="e.g., Rent, Netflix, Groceries" value={newRecurringExpense.name} onChange={e => setNewRecurringExpense(p => ({ ...p, name: e.target.value }))} style={styles.formInput} /></div>
                <div style={styles.formGroup}><label style={styles.formLabel}>Amount</label><input type="number" placeholder="0.00" value={newRecurringExpense.amount} onChange={e => setNewRecurringExpense(p => ({ ...p, amount: e.target.value }))} style={styles.formInput} /></div>
                <div style={styles.formGroup}><label style={styles.formLabel}>Frequency</label><select value={newRecurringExpense.frequency} onChange={e => setNewRecurringExpense(p => ({ ...p, frequency: e.target.value }))} style={styles.formSelect}><option value="weekly">Weekly</option><option value="semimonthly">Twice a month (15th &amp; EOM)</option><option value="monthly">Monthly</option><option value="yearly">Yearly</option></select></div>
                {newRecurringExpense.frequency === 'weekly' && (<div style={styles.formGroup}><label style={styles.formLabel}>Day of Week</label><select value={newRecurringExpense.dayOfWeek} onChange={e => setNewRecurringExpense(p => ({ ...p, dayOfWeek: parseInt(e.target.value) }))} style={styles.formSelect}>{dayNames.map((day, idx) => <option key={day} value={idx}>{day}</option>)}</select></div>)}
                {newRecurringExpense.frequency === 'monthly' && (<div style={styles.formGroup}><label style={styles.formLabel}>Day of Month (1-31)</label><input type="number" min="1" max="31" value={newRecurringExpense.dayOfMonth} onChange={e => setNewRecurringExpense(p => ({ ...p, dayOfMonth: e.target.value }))} style={styles.formInput} /></div>)}
                {newRecurringExpense.frequency === 'yearly' && (<><div style={styles.formGroup}><label style={styles.formLabel}>Month</label><select value={newRecurringExpense.month} onChange={e => setNewRecurringExpense(p => ({ ...p, month: parseInt(e.target.value) }))} style={styles.formSelect}>{months.map((month, idx) => <option key={month} value={idx}>{month}</option>)}</select></div><div style={styles.formGroup}><label style={styles.formLabel}>Day</label><input type="number" min="1" max="31" value={newRecurringExpense.day} onChange={e => setNewRecurringExpense(p => ({ ...p, day: e.target.value }))} style={styles.formInput} /></div></>)}
                {debts.length > 0 && (
                  <div style={styles.formGroup}>
                    <label style={styles.formLabel}>Link to debt (optional)</label>
                    <select value={newRecurringExpense.debtId || ''} onChange={e => setNewRecurringExpense(p => ({ ...p, debtId: e.target.value }))} style={styles.formSelect}>
                      <option value="">None</option>
                      {debts.map(d => <option key={d.id} value={d.id}>{d.name}</option>)}
                    </select>
                    {newRecurringExpense.debtId && <div style={styles.formHint}>This payment drives the linked debt&rsquo;s payoff, and stops automatically once the debt is cleared.</div>}
                  </div>
                )}
                <div className="app-form-actions" style={styles.formActions}><button style={styles.cancelBtn} onClick={() => setShowRecurringExpenseForm(false)}>Cancel</button><button style={styles.submitBtn} onClick={addRecurringExpense}>{isEditing ? 'Save Changes' : 'Add Expense'}</button></div>
              </div>
            </div>
          )}

          {showOneOffExpenseForm && (
            <div style={styles.formOverlay} onClick={() => { setShowOneOffExpenseForm(false); setAddOneOffFromCalendar(null); }}>
              <div className="app-form-card" style={styles.formCard} onClick={e => e.stopPropagation()}>
                <h3 style={styles.formTitle}>{isEditing ? 'Edit One-Off Expense' : 'Add One-Off Expense'}</h3>
                <div style={styles.formGroup}><label style={styles.formLabel}>Name</label><input type="text" placeholder="e.g., Car repair, Gift, Trip" value={newOneOffExpense.name} onChange={e => setNewOneOffExpense(p => ({ ...p, name: e.target.value }))} style={styles.formInput} /></div>
                <div style={styles.formGroup}><label style={styles.formLabel}>Amount</label><input type="number" placeholder="0.00" value={newOneOffExpense.amount} onChange={e => setNewOneOffExpense(p => ({ ...p, amount: e.target.value }))} style={styles.formInput} /></div>
                <div style={styles.formGroup}><label style={styles.formLabel}>Date</label><input type="date" value={newOneOffExpense.date} onChange={e => setNewOneOffExpense(p => ({ ...p, date: e.target.value }))} style={styles.formInput} />{addOneOffFromCalendar && <div style={styles.formHint}>Selected: {formatFullDate(new Date(addOneOffFromCalendar + 'T00:00:00'))}</div>}</div>
                <div className="app-form-actions" style={styles.formActions}><button style={styles.cancelBtn} onClick={() => { setShowOneOffExpenseForm(false); setAddOneOffFromCalendar(null); }}>Cancel</button><button style={styles.submitBtn} onClick={addOneOffExpense}>{isEditing ? 'Save Changes' : 'Add Expense'}</button></div>
              </div>
            </div>
          )}

          {showOneOffIncomeForm && (
            <div style={styles.formOverlay} onClick={() => setShowOneOffIncomeForm(false)}>
              <div className="app-form-card" style={styles.formCard} onClick={e => e.stopPropagation()}>
                <h3 style={styles.formTitle}>{isEditing ? 'Edit One-Off Income' : 'Add One-Off Income'}</h3>
                <div style={styles.formGroup}><label style={styles.formLabel}>Name</label><input type="text" placeholder="e.g., Bonus, Tax refund, Gift" value={newOneOffIncome.name} onChange={e => setNewOneOffIncome(p => ({ ...p, name: e.target.value }))} style={styles.formInput} /></div>
                <div style={styles.formGroup}><label style={styles.formLabel}>Amount</label><input type="number" placeholder="0.00" value={newOneOffIncome.amount} onChange={e => setNewOneOffIncome(p => ({ ...p, amount: e.target.value }))} style={styles.formInput} /></div>
                <div style={styles.formGroup}><label style={styles.formLabel}>Date</label><input type="date" value={newOneOffIncome.date} onChange={e => setNewOneOffIncome(p => ({ ...p, date: e.target.value }))} style={styles.formInput} /></div>
                <div className="app-form-actions" style={styles.formActions}><button style={styles.cancelBtn} onClick={() => setShowOneOffIncomeForm(false)}>Cancel</button><button style={styles.submitBtn} onClick={addOneOffIncome}>{isEditing ? 'Save Changes' : 'Add Income'}</button></div>
              </div>
            </div>
          )}

          {showDebtForm && (
            <div style={styles.formOverlay} onClick={() => setShowDebtForm(false)}>
              <div className="app-form-card" style={styles.formCard} onClick={e => e.stopPropagation()}>
                <h3 style={styles.formTitle}>{isEditing ? 'Edit Debt' : 'Add Debt'}</h3>
                <div style={styles.formGroup}><label style={styles.formLabel}>Name</label><input type="text" placeholder="e.g., Chase Sapphire, Car loan" value={newDebt.name} onChange={e => setNewDebt(p => ({ ...p, name: e.target.value }))} style={styles.formInput} /></div>
                <div style={styles.formGroup}><label style={styles.formLabel}>Type</label><select value={newDebt.type} onChange={e => setNewDebt(p => ({ ...p, type: e.target.value }))} style={styles.formSelect}><option value="credit-card">Credit card</option><option value="loan">Loan</option><option value="auto">Auto loan</option><option value="student">Student loan</option><option value="other">Other</option></select></div>
                <div style={styles.formGroup}><label style={styles.formLabel}>Current Balance</label><input type="number" placeholder="0.00" value={newDebt.balance} onChange={e => setNewDebt(p => ({ ...p, balance: e.target.value }))} style={styles.formInput} /></div>
                <div style={styles.formGroup}><label style={styles.formLabel}>APR (annual %)</label><input type="number" step="0.01" placeholder="e.g., 19.99" value={newDebt.apr} onChange={e => setNewDebt(p => ({ ...p, apr: e.target.value }))} style={styles.formInput} /></div>
                <div style={styles.formGroup}><label style={styles.formLabel}>Monthly Payment (optional)</label><input type="number" placeholder="Used only if no recurring expense is linked" value={newDebt.monthlyPayment} onChange={e => setNewDebt(p => ({ ...p, monthlyPayment: e.target.value }))} style={styles.formInput} /><div style={styles.formHint}>Tip: instead, link the recurring expense that pays this debt — its amount becomes the source of truth.</div></div>
                <div style={styles.formGroup}><label style={styles.formLabel}>Extra Monthly Payment (optional)</label><input type="number" placeholder="0.00" value={newDebt.extraPayment} onChange={e => setNewDebt(p => ({ ...p, extraPayment: e.target.value }))} style={styles.formInput} /></div>
                <div className="app-form-actions" style={styles.formActions}><button style={styles.cancelBtn} onClick={() => setShowDebtForm(false)}>Cancel</button><button style={styles.submitBtn} onClick={addDebt}>{isEditing ? 'Save Changes' : 'Add Debt'}</button></div>
              </div>
            </div>
          )}

          {occEditor && <OccurrenceEditor editor={occEditor} onClose={() => setOccEditor(null)} onApply={applyOccurrenceException} onReset={resetOccurrence} styles={styles} />}
        </div>
      );
    }

    function AppShell() {
      const getInitialView = () => {
        const hash = window.location.hash;
        if (hash.startsWith('#app')) return 'app';
        return 'home';
      };

      const [currentView, setCurrentView] = useState(getInitialView);
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);

      const changeView = (view) => {
        setCurrentView(view);
        if (view === 'home') {
          window.history.replaceState(null, '', window.location.pathname);
        } else {
          const m = window.location.hash.match(/#app(\/[a-z]+)?/);
          const subView = (m && m[1]) ? m[1] : '/dashboard';
          window.history.replaceState(null, '', '#app' + subView);
        }
      };

      useEffect(() => {
        const handleHashChange = () => {
          const hash = window.location.hash;
          if (hash.startsWith('#app')) {
            setCurrentView('app');
          } else {
            setCurrentView('home');
          }
        };
        window.addEventListener('hashchange', handleHashChange);
        return () => window.removeEventListener('hashchange', handleHashChange);
      }, []);

      useEffect(() => {
        api.getUser()
          .then(userData => {
            setUser(userData);
            setAuthLoading(false);
          })
          .catch(() => {
            setAuthLoading(false);
          });
      }, []);

      if (authLoading) {
        return (
          <div className="loading-screen">
            <div className="loading-spinner"></div>
            <span>Loading Mercury...</span>
          </div>
        );
      }

      if (currentView === 'app' && !user) {
        window.location.href = '/api/login';
        return null;
      }

      return currentView === 'home' 
        ? <HomePage onEnterApp={() => changeView('app')} user={user} />
        : <FinancialTracker onBackToHome={() => changeView('home')} user={user} />;
    }

    ReactDOM.render(<AppShell />, document.getElementById('root'));
  </script>
</body>
</html>
