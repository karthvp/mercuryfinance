<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mercury</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: linear-gradient(160deg, #0a0f1a 0%, #0d1929 40%, #0f1d2f 100%); min-height: 100vh; }
    #root { min-height: 100vh; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
    ::-webkit-scrollbar-thumb { background: rgba(212,175,55,0.25); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(212,175,55,0.4); }
    input:focus, select:focus { border-color: rgba(212,175,55,0.5) !important; outline: none; }
    option { background: #0d1929; color: #f5f5f0; }
    ::selection { background: rgba(212,175,55,0.3); color: #fff; }
    .loading-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; color: #d4af37; }
    .loading-spinner { width: 40px; height: 40px; border: 3px solid rgba(212,175,55,0.2); border-top-color: #d4af37; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root"><div class="loading-screen"><div class="loading-spinner"></div><span>Loading Mercury...</span></div></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo, Fragment, useCallback, useRef } = React;

    // Data version for migration support
    const DATA_VERSION = 1;

    // API functions for server persistence
    const api = {
      async loadData() {
        const res = await fetch('/api/data');
        if (!res.ok) throw new Error('Failed to load data');
        return res.json();
      },
      async saveData(data) {
        const res = await fetch('/api/data', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        if (!res.ok) throw new Error('Failed to save data');
        return res.json();
      },
      async updateField(field, value) {
        const res = await fetch(`/api/data/${field}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ value })
        });
        if (!res.ok) throw new Error('Failed to update field');
        return res.json();
      }
    };

    const formatCurrency = (amount) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2 }).format(amount);
    const formatDate = (date) => date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    const formatFullDate = (date) => date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    const getDayOfWeek = (date) => date.toLocaleDateString('en-US', { weekday: 'short' });
    const getDayOfWeekIndex = (date) => date.getDay();
    const isWeekday = (date) => { const day = date.getDay(); return day !== 0 && day !== 6; };

    const getLastWeekdayOnOrBefore = (year, month, targetDay) => {
      let date = new Date(year, month, targetDay);
      while (!isWeekday(date)) date.setDate(date.getDate() - 1);
      return date.getDate();
    };

    const getLastDayOfMonth = (year, month) => new Date(year, month + 1, 0).getDate();
    const getLastWeekdayOfMonth = (year, month) => getLastWeekdayOnOrBefore(year, month, getLastDayOfMonth(year, month));
    const isLeapYear = (year) => (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
    const getDaysInYear = (year) => isLeapYear(year) ? 366 : 365;

    const generateDatesForYear = (year) => {
      const dates = [];
      const daysInYear = getDaysInYear(year);
      const startDate = new Date(year, 0, 1);
      for (let i = 0; i < daysInYear; i++) {
        const date = new Date(startDate);
        date.setDate(startDate.getDate() + i);
        dates.push(date);
      }
      return dates;
    };

    const getCurrentYear = () => new Date().getFullYear();

    const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

    const Icons = {
      Dashboard: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>,
      Calendar: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>,
      Money: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>,
      Expense: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><line x1="8" y1="12" x2="16" y2="12"/></svg>,
      Plus: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
      Trash: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
      Edit: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
      Check: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>,
      X: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
      TrendUp: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>,
      Save: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>,
      Download: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
      Upload: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>,
      Database: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>,
      OneTime: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>,
      Recurring: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>,
      Warning: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>,
      Cloud: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>,
    };

    function FinancialTracker() {
      const today = new Date();
      const realCurrentYear = getCurrentYear();

      // Loading state
      const [isLoading, setIsLoading] = useState(true);
      const [loadError, setLoadError] = useState(null);

      // Data state
      const [activeYear, setActiveYear] = useState(realCurrentYear);
      const [dashboardYear, setDashboardYear] = useState(realCurrentYear);
      const [archivedYears, setArchivedYears] = useState([]);
      const [initialBalances, setInitialBalances] = useState({ [realCurrentYear]: 5000 });
      const [payrolls, setPayrolls] = useState([]);
      const [recurringExpenses, setRecurringExpenses] = useState([]);
      const [oneOffExpenses, setOneOffExpenses] = useState([]);
      const [balanceOverrides, setBalanceOverrides] = useState({});
      // UI state
      const [activeView, setActiveView] = useState('dashboard');
      const [editingCell, setEditingCell] = useState(null);
      const [editValue, setEditValue] = useState('');
      const [scrollToMonth, setScrollToMonth] = useState(today.getMonth());
      const [saveIndicator, setSaveIndicator] = useState(false);

      const [newPayroll, setNewPayroll] = useState({ name: '', amount: '', frequency: 'semimonthly', startDay: 1, dayOfWeek: 5 });
      const [newRecurringExpense, setNewRecurringExpense] = useState({ name: '', amount: '', frequency: 'monthly', dayOfMonth: 1, dayOfWeek: 5, month: 0, day: 1 });
      const [newOneOffExpense, setNewOneOffExpense] = useState({ name: '', amount: '', date: '' });
      const [showPayrollForm, setShowPayrollForm] = useState(false);
      const [showRecurringExpenseForm, setShowRecurringExpenseForm] = useState(false);
      const [showOneOffExpenseForm, setShowOneOffExpenseForm] = useState(false);
      const [addOneOffFromCalendar, setAddOneOffFromCalendar] = useState(null);

      // Save timeout ref for debouncing
      const saveTimeoutRef = useRef(null);

      // Load initial data from server
      useEffect(() => {
        api.loadData()
          .then(data => {
            if (data.initialBalances) setInitialBalances(data.initialBalances);
            if (data.payrolls) setPayrolls(data.payrolls);
            if (data.recurringExpenses) setRecurringExpenses(data.recurringExpenses);
            if (data.oneOffExpenses) setOneOffExpenses(data.oneOffExpenses);
            if (data.balanceOverrides) setBalanceOverrides(data.balanceOverrides);
            if (data.currentYear) {
              setActiveYear(data.currentYear);
              setDashboardYear(data.currentYear);
            }
            if (data.archivedYears) setArchivedYears(data.archivedYears);
            setIsLoading(false);
          })
          .catch(err => {
            console.error('Failed to load data:', err);
            setLoadError(err.message);
            setIsLoading(false);
          });
      }, []);

      // Debounced save to server
      const saveToServer = useCallback(() => {
        if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);
        saveTimeoutRef.current = setTimeout(() => {
          const data = {
            version: DATA_VERSION,
            initialBalances,
            payrolls,
            recurringExpenses,
            oneOffExpenses,
            balanceOverrides,
            currentYear: activeYear,
            archivedYears
          };
          api.saveData(data)
            .then(() => {
              setSaveIndicator(true);
              setTimeout(() => setSaveIndicator(false), 1500);
            })
            .catch(err => console.error('Save failed:', err));
        }, 500);
      }, [initialBalances, payrolls, recurringExpenses, oneOffExpenses, balanceOverrides, activeYear, archivedYears]);

      // Save whenever data changes
      useEffect(() => {
        if (!isLoading) saveToServer();
      }, [initialBalances, payrolls, recurringExpenses, oneOffExpenses, balanceOverrides, activeYear, archivedYears]);

      const datesForYear = useMemo(() => generateDatesForYear(activeYear), [activeYear]);
      const availableYears = useMemo(() => Array.from(new Set([activeYear, ...archivedYears])).sort((a, b) => b - a), [activeYear, archivedYears]);

      const financialData = useMemo(() => {
        const data = [];
        const initialBalance = initialBalances[activeYear] || 5000;
        let runningBalance = initialBalance;

        datesForYear.forEach((date) => {
          const dateKey = date.toISOString().split('T')[0];
          const dayOfMonth = date.getDate();
          const dayOfWeekIdx = getDayOfWeekIndex(date);
          const month = date.getMonth();
          const year = date.getFullYear();

          let startingBalance = balanceOverrides[dateKey] !== undefined ? balanceOverrides[dateKey] : runningBalance;

          let payrollAmount = 0;
          const payrollDetails = [];

          payrolls.forEach(payroll => {
            let isPayday = false;
            if (payroll.frequency === 'monthly' && dayOfMonth === payroll.startDay) isPayday = true;
            else if (payroll.frequency === 'biweekly') {
              const startDate = new Date(payroll.startYear || activeYear, 0, payroll.startDay);
              const diffDays = Math.floor((date - startDate) / (1000 * 60 * 60 * 24));
              if (diffDays >= 0 && diffDays % 14 === 0) isPayday = true;
            } else if (payroll.frequency === 'weekly') {
              const startDate = new Date(payroll.startYear || activeYear, 0, payroll.startDay);
              const diffDays = Math.floor((date - startDate) / (1000 * 60 * 60 * 24));
              if (diffDays >= 0 && diffDays % 7 === 0) isPayday = true;
            } else if (payroll.frequency === 'semimonthly') {
              const lastWeekdayBefore15th = getLastWeekdayOnOrBefore(year, month, 15);
              const lastWeekdayOfMonth = getLastWeekdayOfMonth(year, month);
              if (dayOfMonth === lastWeekdayBefore15th || dayOfMonth === lastWeekdayOfMonth) isPayday = true;
            } else if (payroll.frequency === 'last-weekday-15th') {
              if (dayOfMonth === getLastWeekdayOnOrBefore(year, month, 15)) isPayday = true;
            } else if (payroll.frequency === 'last-weekday-eom') {
              if (dayOfMonth === getLastWeekdayOfMonth(year, month)) isPayday = true;
            }
            if (isPayday) { payrollAmount += payroll.amount; payrollDetails.push(payroll); }
          });

          startingBalance += payrollAmount;

          let recurringExpenseAmount = 0;
          const recurringExpenseDetails = [];

          recurringExpenses.forEach(expense => {
            let isDue = false;
            if (expense.frequency === 'monthly' && expense.dayOfMonth === dayOfMonth) isDue = true;
            else if (expense.frequency === 'weekly' && expense.dayOfWeek === dayOfWeekIdx) isDue = true;
            else if (expense.frequency === 'yearly' && expense.month === month && expense.day === dayOfMonth) isDue = true;
            if (isDue) { recurringExpenseAmount += expense.amount; recurringExpenseDetails.push({ ...expense, isRecurring: true }); }
          });

          let oneOffExpenseAmount = 0;
          const oneOffExpenseDetails = [];
          oneOffExpenses.forEach(expense => {
            if (expense.date === dateKey) { oneOffExpenseAmount += expense.amount; oneOffExpenseDetails.push({ ...expense, isRecurring: false }); }
          });

          const totalExpenses = recurringExpenseAmount + oneOffExpenseAmount;
          const allExpenseDetails = [...recurringExpenseDetails, ...oneOffExpenseDetails];
          const endingBalance = startingBalance - totalExpenses;

          data.push({
            date, dateKey, dayOfWeek: getDayOfWeek(date), dayOfWeekIdx, dayOfMonth, month, year,
            startingBalance, endingBalance, expenses: totalExpenses,
            recurringExpenses: recurringExpenseAmount, oneOffExpenses: oneOffExpenseAmount,
            expenseDetails: allExpenseDetails, recurringExpenseDetails, oneOffExpenseDetails,
            payrollAmount, payrollDetails,
            isOverridden: balanceOverrides[dateKey] !== undefined,
            isPast: date < today, isToday: date.toDateString() === today.toDateString(),
          });

          runningBalance = endingBalance;
        });

        return data;
      }, [datesForYear, activeYear, initialBalances, payrolls, recurringExpenses, oneOffExpenses, balanceOverrides]);

      const stats = useMemo(() => {
        const yearData = dashboardYear === activeYear ? financialData : (() => {
          const dates = generateDatesForYear(dashboardYear);
          const initialBalance = initialBalances[dashboardYear] || 5000;
          let runningBalance = initialBalance;
          const data = [];

          dates.forEach((date) => {
            const dateKey = date.toISOString().split('T')[0];
            const dayOfMonth = date.getDate();
            const dayOfWeekIdx = getDayOfWeekIndex(date);
            const month = date.getMonth();
            const year = date.getFullYear();

            let startingBalance = balanceOverrides[dateKey] !== undefined ? balanceOverrides[dateKey] : runningBalance;

            let payrollAmount = 0;
            payrolls.forEach(payroll => {
              let isPayday = false;
              if (payroll.frequency === 'monthly' && dayOfMonth === payroll.startDay) isPayday = true;
              else if (payroll.frequency === 'biweekly') {
                const startDate = new Date(payroll.startYear || dashboardYear, 0, payroll.startDay);
                const diffDays = Math.floor((date - startDate) / (1000 * 60 * 60 * 24));
                if (diffDays >= 0 && diffDays % 14 === 0) isPayday = true;
              } else if (payroll.frequency === 'weekly') {
                const startDate = new Date(payroll.startYear || dashboardYear, 0, payroll.startDay);
                const diffDays = Math.floor((date - startDate) / (1000 * 60 * 60 * 24));
                if (diffDays >= 0 && diffDays % 7 === 0) isPayday = true;
              } else if (payroll.frequency === 'semimonthly') {
                const lastWeekdayBefore15th = getLastWeekdayOnOrBefore(year, month, 15);
                const lastWeekdayOfMonth = getLastWeekdayOfMonth(year, month);
                if (dayOfMonth === lastWeekdayBefore15th || dayOfMonth === lastWeekdayOfMonth) isPayday = true;
              } else if (payroll.frequency === 'last-weekday-15th') {
                if (dayOfMonth === getLastWeekdayOnOrBefore(year, month, 15)) isPayday = true;
              } else if (payroll.frequency === 'last-weekday-eom') {
                if (dayOfMonth === getLastWeekdayOfMonth(year, month)) isPayday = true;
              }
              if (isPayday) payrollAmount += payroll.amount;
            });

            startingBalance += payrollAmount;

            let recurringExp = 0;
            recurringExpenses.forEach(expense => {
              let isDue = false;
              if (expense.frequency === 'monthly' && expense.dayOfMonth === dayOfMonth) isDue = true;
              else if (expense.frequency === 'weekly' && expense.dayOfWeek === dayOfWeekIdx) isDue = true;
              else if (expense.frequency === 'yearly' && expense.month === month && expense.day === dayOfMonth) isDue = true;
              if (isDue) recurringExp += expense.amount;
            });

            let oneOffExp = 0;
            oneOffExpenses.forEach(expense => { if (expense.date === dateKey) oneOffExp += expense.amount; });

            const totalExpenses = recurringExp + oneOffExp;
            const endingBalance = startingBalance - totalExpenses;

            data.push({ date, dateKey, startingBalance, endingBalance, expenses: totalExpenses, recurringExpenses: recurringExp, oneOffExpenses: oneOffExp, payrollAmount, isPast: date < today });
            runningBalance = endingBalance;
          });

          return data;
        })();

        const pastDays = yearData.filter(d => d.isPast);
        const futureDays = yearData.filter(d => !d.isPast);

        return {
          initialBalance: initialBalances[dashboardYear] || 5000,
          endOfYearBalance: yearData[yearData.length - 1]?.endingBalance || 0,
          lowestBalance: Math.min(...yearData.map(d => d.endingBalance)),
          lowestBalanceDate: yearData.find(d => d.endingBalance === Math.min(...yearData.map(x => x.endingBalance)))?.date,
          historicalRecurringExpensesPaid: pastDays.reduce((sum, d) => sum + d.recurringExpenses, 0),
          historicalOneOffExpensesPaid: pastDays.reduce((sum, d) => sum + d.oneOffExpenses, 0),
          historicalTotalExpensesPaid: pastDays.reduce((sum, d) => sum + d.expenses, 0),
          historicalPayrollReceived: pastDays.reduce((sum, d) => sum + d.payrollAmount, 0),
          forecastedRecurringExpenses: futureDays.reduce((sum, d) => sum + d.recurringExpenses, 0),
          forecastedOneOffExpenses: futureDays.reduce((sum, d) => sum + d.oneOffExpenses, 0),
          forecastedTotalExpenses: futureDays.reduce((sum, d) => sum + d.expenses, 0),
          forecastedPayroll: futureDays.reduce((sum, d) => sum + d.payrollAmount, 0),
          totalRecurringExpensesForYear: yearData.reduce((sum, d) => sum + d.recurringExpenses, 0),
          totalOneOffExpensesForYear: yearData.reduce((sum, d) => sum + d.oneOffExpenses, 0),
          totalExpensesForYear: yearData.reduce((sum, d) => sum + d.expenses, 0),
          totalPayrollForYear: yearData.reduce((sum, d) => sum + d.payrollAmount, 0),
          netAnnual: yearData.reduce((sum, d) => sum + d.payrollAmount, 0) - yearData.reduce((sum, d) => sum + d.expenses, 0),
        };
      }, [financialData, dashboardYear, activeYear, initialBalances, payrolls, recurringExpenses, oneOffExpenses, balanceOverrides]);

      const handleOverrideBalance = (dateKey, newBalance) => { setBalanceOverrides(prev => ({ ...prev, [dateKey]: parseFloat(newBalance) })); setEditingCell(null); };
      const clearOverride = (dateKey) => { setBalanceOverrides(prev => { const n = { ...prev }; delete n[dateKey]; return n; }); };
      const addPayroll = () => { if (newPayroll.name && newPayroll.amount) { setPayrolls(prev => [...prev, { id: Date.now(), name: newPayroll.name, amount: parseFloat(newPayroll.amount), frequency: newPayroll.frequency, startDay: parseInt(newPayroll.startDay), dayOfWeek: parseInt(newPayroll.dayOfWeek), startYear: activeYear }]); setNewPayroll({ name: '', amount: '', frequency: 'semimonthly', startDay: 1, dayOfWeek: 5 }); setShowPayrollForm(false); } };

            <div style={styles.statCard()}><div style={styles.statCardAccent('#fbbf24')} /><div style={styles.statLabel}>Forecasted Total Expenses</div><div style={styles.statValue('#fbbf24')}>{formatCurrency(stats.forecastedTotalExpenses)}</div><div style={styles.statSubtext}>Recurring + One-off until Dec 31</div></div>
            <div style={styles.statCard()}><div style={styles.statCardAccent('#a855f7')} /><div style={styles.statLabel}>Paid Recurring Expenses YTD</div><div style={styles.statValue('#a855f7')}>{formatCurrency(stats.historicalRecurringExpensesPaid)}</div><div style={styles.statSubtext}>Year to date</div></div>
            <div style={styles.statCard()}><div style={styles.statCardAccent('#ec4899')} /><div style={styles.statLabel}>Paid Total Expenses YTD</div><div style={styles.statValue('#ec4899')}>{formatCurrency(stats.historicalTotalExpensesPaid)}</div><div style={styles.statSubtext}>Recurring + One-off YTD</div></div>
          </div>

          <div style={styles.sectionTitle}><Icons.Calendar /> Full Year Summary ({dashboardYear})</div>
          <div style={styles.dashboardGrid}>
            <div style={styles.statCard()}><div style={styles.statCardAccent('#22d3ee')} /><div style={styles.statLabel}>Total Income</div><div style={styles.statValue('#4ade80')}>{formatCurrency(stats.totalPayrollForYear)}</div></div>
            <div style={styles.statCard()}><div style={styles.statCardAccent('#6366f1')} /><div style={styles.statLabel}>Total Recurring Expenses</div><div style={styles.statValue('#f87171')}>{formatCurrency(stats.totalRecurringExpensesForYear)}</div></div>
            <div style={styles.statCard()}><div style={styles.statCardAccent('#f59e0b')} /><div style={styles.statLabel}>Total One-Off Expenses</div><div style={styles.statValue('#fbbf24')}>{formatCurrency(stats.totalOneOffExpensesForYear)}</div><div style={styles.statSubtext}>{oneOffExpenses.filter(e => e.date.startsWith(dashboardYear)).length} scheduled</div></div>
            <div style={styles.statCard()}><div style={styles.statCardAccent('#14b8a6')} /><div style={styles.statLabel}>Total All Expenses</div><div style={styles.statValue('#f87171')}>{formatCurrency(stats.totalExpensesForYear)}</div></div>
          </div>

          <div style={styles.threeColumn}>
            <div style={styles.panel}>
              <div style={styles.panelHeader}><div style={styles.panelTitle}><Icons.Money /> Income Sources</div><button style={styles.addButton} onClick={() => setShowPayrollForm(true)}><Icons.Plus /> Add</button></div>
              {payrolls.map(payroll => (
                <div key={payroll.id} style={styles.itemRow}>
                  <div><div style={styles.itemName}>{payroll.name}</div><div style={styles.itemMeta}>{frequencyLabels[payroll.frequency] || payroll.frequency}{['weekly', 'biweekly', 'monthly'].includes(payroll.frequency) && ` - Day ${payroll.startDay}`}</div></div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '0.4375rem' }}><div style={styles.itemAmount(true)}>+{formatCurrency(payroll.amount)}</div><button style={styles.deleteBtn} onClick={() => deletePayroll(payroll.id)}><Icons.Trash /></button></div>
                </div>
              ))}
              {payrolls.length === 0 && <div style={styles.emptyState}>No income sources added</div>}
            </div>

            <div style={styles.panel}>
              <div style={styles.panelHeader}><div style={styles.panelTitle}><Icons.Recurring /> Recurring Expenses</div><button style={styles.addButton} onClick={() => setShowRecurringExpenseForm(true)}><Icons.Plus /> Add</button></div>
              {recurringExpenses.map(expense => (
                <div key={expense.id} style={styles.itemRow}>
                  <div><div style={styles.itemName}>{expense.name}</div><div style={styles.itemMeta}>{getExpenseFrequencyLabel(expense)}</div></div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '0.4375rem' }}><div style={styles.itemAmount(false)}>-{formatCurrency(expense.amount)}</div><button style={styles.deleteBtn} onClick={() => deleteRecurringExpense(expense.id)}><Icons.Trash /></button></div>
                </div>
              ))}
              {recurringExpenses.length === 0 && <div style={styles.emptyState}>No recurring expenses added</div>}
            </div>

            <div style={styles.panel}>
              <div style={styles.panelHeader}><div style={styles.panelTitle}><Icons.OneTime /> One-Off Expenses</div><button style={styles.addButton} onClick={() => setShowOneOffExpenseForm(true)}><Icons.Plus /> Add</button></div>
              {oneOffExpenses.filter(e => e.date.startsWith(String(dashboardYear))).map(expense => (
                <div key={expense.id} style={styles.itemRow}>
                  <div><div style={styles.itemName}>{expense.name}</div><div style={styles.itemMeta}>{formatFullDate(new Date(expense.date + 'T00:00:00'))}</div></div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '0.4375rem' }}><div style={styles.itemAmount(false)}>-{formatCurrency(expense.amount)}</div><button style={styles.deleteBtn} onClick={() => deleteOneOffExpense(expense.id)}><Icons.Trash /></button></div>
                </div>
              ))}
              {oneOffExpenses.filter(e => e.date.startsWith(String(dashboardYear))).length === 0 && <div style={styles.emptyState}>No one-off expenses for {dashboardYear}</div>}
            </div>
          </div>

          <div style={{ marginTop: '1.75rem', textAlign: 'center' }}><button style={styles.clearButton} onClick={clearAllData}>Clear All Data</button></div>
        </div>
      );

      const renderCalendar = () => {
        let currentMonth = -1;
        return (
          <div style={styles.tableContainer}>
            <div style={styles.initialBalanceSection}>
              <span style={styles.initialBalanceLabel}>Year:</span><span style={styles.yearBadge}>{activeYear}</span>
              <span style={styles.initialBalanceLabel}>Starting Balance (Jan 1):</span>
              <input type="number" value={initialBalances[activeYear] || 5000} onChange={(e) => updateInitialBalance(activeYear, e.target.value)} style={styles.initialBalanceInput} />
            </div>
            <div style={styles.monthSelector}>{months.map((month, idx) => <button key={month} style={styles.monthBtn(scrollToMonth === idx)} onClick={() => { setScrollToMonth(idx); document.getElementById(`month-${idx}`)?.scrollIntoView({ behavior: 'smooth' }); }}>{month.slice(0, 3)}</button>)}</div>
            <div style={styles.tableHeader}>
              <div style={styles.tableHeaderCell}>Date</div><div style={styles.tableHeaderCell}>Day</div><div style={styles.tableHeaderCell}>Details</div><div style={styles.tableHeaderCell}>Starting</div><div style={styles.tableHeaderCell}>Expenses</div><div style={styles.tableHeaderCell}>Ending</div><div style={styles.tableHeaderCell}></div>
            </div>
            <div style={styles.tableBody}>
              {financialData.map((day) => {
                const showMonthDivider = day.month !== currentMonth;
                if (showMonthDivider) currentMonth = day.month;
                return (
                  <Fragment key={day.dateKey}>
                    {showMonthDivider && <div id={`month-${day.month}`} style={styles.monthDivider}><div style={styles.monthLabel}>{months[day.month]} {activeYear}</div></div>}
                    <div style={styles.tableRow(day.isToday, day.isPast, day.dayOfMonth === 1)} onMouseEnter={(e) => { if (!day.isToday) e.currentTarget.style.background = 'rgba(255, 255, 255, 0.02)'; }} onMouseLeave={(e) => { if (!day.isToday) e.currentTarget.style.background = day.dayOfMonth === 1 ? 'rgba(255, 255, 255, 0.03)' : 'transparent'; }}>
                      <div style={styles.tableCell}><span style={{ fontWeight: day.isToday ? '700' : '500' }}>{formatDate(day.date)}</span>{day.isToday && <span style={{ marginLeft: '0.25rem', fontSize: '0.5rem', color: '#d4af37', background: 'rgba(212, 175, 55, 0.2)', padding: '0.0625rem 0.1875rem', borderRadius: '2px' }}>TODAY</span>}</div>
                      <div style={styles.tableCell}><span style={{ color: ['Sat', 'Sun'].includes(day.dayOfWeek) ? '#8b5cf6' : '#8888a0' }}>{day.dayOfWeek}</span></div>
                      <div style={styles.tableCell}>
                        <div style={styles.expensesList}>
                          {day.payrollDetails.map(p => <span key={p.id} style={styles.payrollBadge}>+{formatCurrency(p.amount)} {p.name}</span>)}
                          {day.recurringExpenseDetails.map(exp => <span key={exp.id} style={styles.recurringExpenseBadge}>{exp.name}: -{formatCurrency(exp.amount)}</span>)}
                          {day.oneOffExpenseDetails.map(exp => <span key={exp.id} style={styles.oneOffExpenseBadge}>{exp.name}: -{formatCurrency(exp.amount)}</span>)}
                        </div>
                      </div>
                      <div style={styles.tableCell}>
                        {editingCell === day.dateKey ? (
                          <div style={{ display: 'flex', alignItems: 'center' }}>
                            <input type="number" value={editValue} onChange={(e) => setEditValue(e.target.value)} style={styles.inlineInput} autoFocus onKeyDown={(e) => { if (e.key === 'Enter') handleOverrideBalance(day.dateKey, editValue); if (e.key === 'Escape') setEditingCell(null); }} />
                            <div style={styles.inlineActions}><button style={{ ...styles.inlineBtn('74, 222, 128'), color: '#4ade80' }} onClick={() => handleOverrideBalance(day.dateKey, editValue)}><Icons.Check /></button><button style={{ ...styles.inlineBtn('248, 113, 113'), color: '#f87171' }} onClick={() => setEditingCell(null)}><Icons.X /></button></div>
                          </div>
                        ) : (
                          <><span style={day.startingBalance >= 0 ? styles.balancePositive : styles.balanceNegative}>{formatCurrency(day.startingBalance)}</span>{day.isOverridden && <span style={styles.overrideBadge} onClick={() => clearOverride(day.dateKey)} title="Click to remove override">✎</span>}<button style={styles.editButton} onClick={() => { setEditingCell(day.dateKey); setEditValue(day.startingBalance.toString()); }} title="Override balance"><Icons.Edit /></button></>
                        )}
                      </div>
                      <div style={styles.tableCell}>{day.expenses > 0 && <span style={styles.expenseCell}>-{formatCurrency(day.expenses)}</span>}</div>
                      <div style={styles.tableCell}><span style={day.endingBalance >= 0 ? styles.balancePositive : styles.balanceNegative}>{formatCurrency(day.endingBalance)}</span></div>
                      <div style={styles.tableCell}><button style={styles.addExpenseBtn} onClick={() => openOneOffFormForDate(day.dateKey)} title="Add one-off expense"><Icons.Plus /></button></div>
                    </div>
                  </Fragment>
                );
              })}
            </div>
          </div>
        );
      };

      return (
        <div style={styles.container}>
          <header style={styles.header}>
            <div style={styles.headerContent}>
              <div style={styles.logo}><div style={styles.logoIcon}><Icons.TrendUp /></div><span style={styles.logoText}>Mercury</span><span style={styles.yearBadge}>{activeYear}</span></div>
              <div style={styles.headerActions}>
                <div style={styles.cloudIndicator}><Icons.Cloud /> Cloud Sync</div>
                <div style={styles.saveIndicator}><Icons.Save /> Saved</div>
              </div>
              <nav style={styles.nav}><button style={styles.navButton(activeView === 'dashboard')} onClick={() => setActiveView('dashboard')}><Icons.Dashboard /> Dashboard</button><button style={styles.navButton(activeView === 'calendar')} onClick={() => setActiveView('calendar')}><Icons.Calendar /> Calendar</button></nav>
            </div>
          </header>
          <main style={styles.main}>{activeView === 'dashboard' ? renderDashboard() : renderCalendar()}</main>

          {showPayrollForm && (
            <div style={styles.formOverlay} onClick={() => setShowPayrollForm(false)}>
              <div style={styles.formCard} onClick={e => e.stopPropagation()}>
                <h3 style={styles.formTitle}>Add Income Source</h3>
                <div style={styles.formGroup}><label style={styles.formLabel}>Name</label><input type="text" placeholder="e.g., Salary, Freelance" value={newPayroll.name} onChange={e => setNewPayroll(p => ({ ...p, name: e.target.value }))} style={styles.formInput} /></div>
                <div style={styles.formGroup}><label style={styles.formLabel}>Amount (per payment)</label><input type="number" placeholder="0.00" value={newPayroll.amount} onChange={e => setNewPayroll(p => ({ ...p, amount: e.target.value }))} style={styles.formInput} /></div>
                <div style={styles.formGroup}><label style={styles.formLabel}>Frequency</label><select value={newPayroll.frequency} onChange={e => setNewPayroll(p => ({ ...p, frequency: e.target.value }))} style={styles.formSelect}><option value="weekly">Weekly</option><option value="biweekly">Biweekly</option><option value="monthly">Monthly (specific day)</option><option value="semimonthly">Semi-monthly (15th & EOM weekdays)</option><option value="last-weekday-15th">Last weekday before 15th only</option><option value="last-weekday-eom">Last weekday of month only</option></select></div>
                {['weekly', 'biweekly', 'monthly'].includes(newPayroll.frequency) && (<div style={styles.formGroup}><label style={styles.formLabel}>{newPayroll.frequency === 'monthly' ? 'Day of Month (1-31)' : 'Start Day (1-31)'}</label><input type="number" min="1" max="31" value={newPayroll.startDay} onChange={e => setNewPayroll(p => ({ ...p, startDay: e.target.value }))} style={styles.formInput} /><div style={styles.formHint}>{newPayroll.frequency === 'biweekly' && 'First paycheck date in January, then every 14 days'}{newPayroll.frequency === 'weekly' && 'First paycheck date in January, then every 7 days'}</div></div>)}
                <div style={styles.formActions}><button style={styles.cancelBtn} onClick={() => setShowPayrollForm(false)}>Cancel</button><button style={styles.submitBtn} onClick={addPayroll}>Add Income</button></div>
              </div>
            </div>
          )}

          {showRecurringExpenseForm && (
            <div style={styles.formOverlay} onClick={() => setShowRecurringExpenseForm(false)}>
              <div style={styles.formCard} onClick={e => e.stopPropagation()}>
                <h3 style={styles.formTitle}>Add Recurring Expense</h3>
                <div style={styles.formGroup}><label style={styles.formLabel}>Name</label><input type="text" placeholder="e.g., Rent, Netflix, Groceries" value={newRecurringExpense.name} onChange={e => setNewRecurringExpense(p => ({ ...p, name: e.target.value }))} style={styles.formInput} /></div>
                <div style={styles.formGroup}><label style={styles.formLabel}>Amount</label><input type="number" placeholder="0.00" value={newRecurringExpense.amount} onChange={e => setNewRecurringExpense(p => ({ ...p, amount: e.target.value }))} style={styles.formInput} /></div>
                <div style={styles.formGroup}><label style={styles.formLabel}>Frequency</label><select value={newRecurringExpense.frequency} onChange={e => setNewRecurringExpense(p => ({ ...p, frequency: e.target.value }))} style={styles.formSelect}><option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="yearly">Yearly</option></select></div>
                {newRecurringExpense.frequency === 'weekly' && (<div style={styles.formGroup}><label style={styles.formLabel}>Day of Week</label><select value={newRecurringExpense.dayOfWeek} onChange={e => setNewRecurringExpense(p => ({ ...p, dayOfWeek: parseInt(e.target.value) }))} style={styles.formSelect}>{dayNames.map((day, idx) => <option key={day} value={idx}>{day}</option>)}</select></div>)}
                {newRecurringExpense.frequency === 'monthly' && (<div style={styles.formGroup}><label style={styles.formLabel}>Day of Month (1-31)</label><input type="number" min="1" max="31" value={newRecurringExpense.dayOfMonth} onChange={e => setNewRecurringExpense(p => ({ ...p, dayOfMonth: e.target.value }))} style={styles.formInput} /></div>)}
                {newRecurringExpense.frequency === 'yearly' && (<><div style={styles.formGroup}><label style={styles.formLabel}>Month</label><select value={newRecurringExpense.month} onChange={e => setNewRecurringExpense(p => ({ ...p, month: parseInt(e.target.value) }))} style={styles.formSelect}>{months.map((month, idx) => <option key={month} value={idx}>{month}</option>)}</select></div><div style={styles.formGroup}><label style={styles.formLabel}>Day</label><input type="number" min="1" max="31" value={newRecurringExpense.day} onChange={e => setNewRecurringExpense(p => ({ ...p, day: e.target.value }))} style={styles.formInput} /></div></>)}
                <div style={styles.formActions}><button style={styles.cancelBtn} onClick={() => setShowRecurringExpenseForm(false)}>Cancel</button><button style={styles.submitBtn} onClick={addRecurringExpense}>Add Expense</button></div>
              </div>
            </div>
          )}

          {showOneOffExpenseForm && (
            <div style={styles.formOverlay} onClick={() => { setShowOneOffExpenseForm(false); setAddOneOffFromCalendar(null); }}>
              <div style={styles.formCard} onClick={e => e.stopPropagation()}>
                <h3 style={styles.formTitle}>Add One-Off Expense</h3>
                <div style={styles.formGroup}><label style={styles.formLabel}>Name</label><input type="text" placeholder="e.g., Car repair, Gift, Trip" value={newOneOffExpense.name} onChange={e => setNewOneOffExpense(p => ({ ...p, name: e.target.value }))} style={styles.formInput} /></div>
                <div style={styles.formGroup}><label style={styles.formLabel}>Amount</label><input type="number" placeholder="0.00" value={newOneOffExpense.amount} onChange={e => setNewOneOffExpense(p => ({ ...p, amount: e.target.value }))} style={styles.formInput} /></div>
                <div style={styles.formGroup}><label style={styles.formLabel}>Date</label><input type="date" value={newOneOffExpense.date} onChange={e => setNewOneOffExpense(p => ({ ...p, date: e.target.value }))} style={styles.formInput} />{addOneOffFromCalendar && <div style={styles.formHint}>Selected: {formatFullDate(new Date(addOneOffFromCalendar + 'T00:00:00'))}</div>}</div>
                <div style={styles.formActions}><button style={styles.cancelBtn} onClick={() => { setShowOneOffExpenseForm(false); setAddOneOffFromCalendar(null); }}>Cancel</button><button style={styles.submitBtn} onClick={addOneOffExpense}>Add Expense</button></div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<FinancialTracker />, document.getElementById('root'));
  </script>
</body>
</html>
