    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: linear-gradient(160deg, #0a0f1a 0%, #0d1929 40%, #0f1d2f 100%); min-height: 100vh; }
    #root { min-height: 100vh; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
    ::-webkit-scrollbar-thumb { background: rgba(212,175,55,0.25); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(212,175,55,0.4); }
    input:focus, select:focus { border-color: rgba(212,175,55,0.5) !important; outline: none; }
    option { background: #0d1929; color: #f5f5f0; }
    ::selection { background: rgba(212,175,55,0.3); color: #fff; }
    .loading-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; color: #d4af37; }
    .loading-spinner { width: 40px; height: 40px; border: 3px solid rgba(212,175,55,0.2); border-top-color: #d4af37; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-20px); } }
    @keyframes shimmer { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }
    @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.8; } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes glow { 0%, 100% { box-shadow: 0 0 20px rgba(212,175,55,0.3); } 50% { box-shadow: 0 0 40px rgba(212,175,55,0.5); } }
    
    /* Mobile Responsive Styles */
    @media (max-width: 768px) {
      .mobile-nav { padding: 1rem !important; }
      .mobile-nav-content { flex-wrap: wrap; gap: 0.75rem; }
      .mobile-logo-text { font-size: 1.25rem !important; }
      .mobile-nav-actions { flex-wrap: wrap; justify-content: center; gap: 0.5rem !important; }
      .mobile-nav-cta { padding: 0.5rem 1rem !important; font-size: 0.8125rem !important; }
      .mobile-user-info { padding: 0.375rem 0.75rem !important; }
      .mobile-user-name { display: none; }
      .mobile-logout-btn { padding: 0.375rem 0.75rem !important; }
      .mobile-hero { padding: 6rem 1rem 3rem !important; min-height: auto !important; }
      .mobile-hero-content { padding: 0 0.5rem; }
      .mobile-hero-subtitle { font-size: 1rem !important; margin-bottom: 2rem !important; }
      .mobile-hero-actions { flex-direction: column; width: 100%; }
      .mobile-primary-btn, .mobile-secondary-btn { width: 100%; justify-content: center; padding: 0.875rem 1.5rem !important; }
      .mobile-scroll-indicator { display: none !important; }
      .mobile-section { padding: 3rem 1rem !important; }
      .mobile-features-grid { grid-template-columns: 1fr !important; gap: 1rem !important; }
      .mobile-feature-card { padding: 1.5rem !important; }
      .mobile-stats-section { padding: 2rem 1rem !important; }
      .mobile-stats-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 1.5rem !important; }

<body>
  <div id="root"><div class="loading-screen"><div class="loading-spinner"></div><span>Loading Mercury...</span></div></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo, Fragment, useCallback, useRef } = React;

    const DATA_VERSION = 1;

    const api = {
      async getUser() {
        const res = await fetch('/api/auth/user', { credentials: 'include' });
        if (!res.ok) return null;
        const data = await res.json();
        return data.user;
      },
      async loadData() {
        const res = await fetch('/api/data', { credentials: 'include' });
        if (res.status === 401) throw new Error('Unauthorized');
        if (!res.ok) throw new Error('Failed to load data');
        return res.json();
      },
      async saveData(data) {
        const res = await fetch('/api/data', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
          credentials: 'include'
        });
        if (res.status === 401) throw new Error('Unauthorized');
        if (!res.ok) throw new Error('Failed to save data');
        return res.json();
      },
      async updateField(field, value) {
        const res = await fetch(`/api/data/${field}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ value }),
          credentials: 'include'
        });
        if (res.status === 401) throw new Error('Unauthorized');
        if (!res.ok) throw new Error('Failed to update field');
        return res.json();
      }
    };

    const formatCurrency = (amount) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2 }).format(amount);
    const formatDate = (date) => date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    const formatFullDate = (date) => date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    const getDayOfWeek = (date) => date.toLocaleDateString('en-US', { weekday: 'short' });
    const getDayOfWeekIndex = (date) => date.getDay();
    const isWeekday = (date) => { const day = date.getDay(); return day !== 0 && day !== 6; };

    const getLastWeekdayOnOrBefore = (year, month, targetDay) => {
      let date = new Date(year, month, targetDay);
      while (!isWeekday(date)) date.setDate(date.getDate() - 1);
      return date.getDate();
    };

    const getLastDayOfMonth = (year, month) => new Date(year, month + 1, 0).getDate();
    const getLastWeekdayOfMonth = (year, month) => getLastWeekdayOnOrBefore(year, month, getLastDayOfMonth(year, month));
    const isLeapYear = (year) => (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
    const getDaysInYear = (year) => isLeapYear(year) ? 366 : 365;

    const generateDatesForYear = (year) => {
      const dates = [];
      const daysInYear = getDaysInYear(year);
      const startDate = new Date(year, 0, 1);
      for (let i = 0; i < daysInYear; i++) {
        const date = new Date(startDate);
        date.setDate(startDate.getDate() + i);
        dates.push(date);
      }
      return dates;
    };

    const getCurrentYear = () => new Date().getFullYear();

    const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

      Upload: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>,
      Database: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>,
      OneTime: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>,

      Warning: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>,

    };

    function MoneyRain({ containerRef }) {
      const canvasRef = useRef(null);
      const mouseRef = useRef({ x: -1000, y: -1000 });
      const animationRef = useRef(null);
      
      useEffect(() => {
        const canvas = canvasRef.current;
        const container = containerRef?.current;
        if (!canvas || !container) return;
        
        const ctx = canvas.getContext('2d');
        const chars = '$$$$$¢¢€€£¥₿%0123456789.+-';
        const charArray = chars.split('');
        const fontSize = 18;
        
        let columns = Math.floor(container.offsetWidth / fontSize);
        let drops = new Array(columns).fill(0).map(() => Math.random() * -100);
        let speeds = new Array(columns).fill(0).map(() => 0.3 + Math.random() * 0.7);
        
        const handleResize = () => {
          canvas.width = container.offsetWidth;
          canvas.height = container.offsetHeight;
          columns = Math.floor(canvas.width / fontSize);
          drops = new Array(columns).fill(0).map(() => Math.random() * -100);
          speeds = new Array(columns).fill(0).map(() => 0.3 + Math.random() * 0.7);
        };
        handleResize();
        window.addEventListener('resize', handleResize);
        
        const handleMouseMove = (e) => {
          const rect = container.getBoundingClientRect();
          mouseRef.current = { x: e.clientX - rect.left, y: e.clientY - rect.top };
        };
        const handleMouseLeave = () => {
          mouseRef.current = { x: -1000, y: -1000 };
        };
        container.addEventListener('mousemove', handleMouseMove);
        container.addEventListener('mouseleave', handleMouseLeave);
        
        const draw = () => {
          ctx.fillStyle = 'rgba(10, 15, 26, 0.08)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          
          ctx.font = `${fontSize}px "Playfair Display", serif`;
          
          const { x: mouseX, y: mouseY } = mouseRef.current;
          const glowRadius = 200;
          
          for (let i = 0; i < drops.length; i++) {
            const char = charArray[Math.floor(Math.random() * charArray.length)];
            const x = i * fontSize;
            const y = drops[i] * fontSize;
            
            const dx = mouseX - x;
            const dy = mouseY - y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            if (distance < glowRadius) {
              const brightness = 1 - (distance / glowRadius);
              const alpha = 0.3 + brightness * 0.7;
              ctx.shadowBlur = 25 * brightness;
              ctx.shadowColor = '#d4af37';
              ctx.fillStyle = `rgba(212, 175, 55, ${alpha})`;
            } else {
              ctx.shadowBlur = 0;
              ctx.fillStyle = 'rgba(212, 175, 55, 0.15)';
            }
            
            ctx.fillText(char, x, y);
            
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.98) {
              drops[i] = 0;
            }
            drops[i] += speeds[i];
          }
          
          animationRef.current = requestAnimationFrame(draw);
        };
        
        draw();
        
        return () => {
          window.removeEventListener('resize', handleResize);
          container.removeEventListener('mousemove', handleMouseMove);
          container.removeEventListener('mouseleave', handleMouseLeave);
          if (animationRef.current) {
            cancelAnimationFrame(animationRef.current);
          }
        };
      }, [containerRef]);
      
      return (
        <canvas
          ref={canvasRef}
          style={{
            position: 'absolute',
            top: 0,
            left: 0,
            width: '100%',
            height: '100%',
            pointerEvents: 'none',
            zIndex: 0
          }}
        />
      );
    }

    function HomePage({ onEnterApp, user }) {
      const heroSectionRef = useRef(null);
      
      const heroStyles = {
        wrapper: { minHeight: '100vh', position: 'relative', overflow: 'hidden' },
        nav: { position: 'fixed', top: 0, left: 0, right: 0, zIndex: 100, padding: '1.5rem 2rem', background: 'rgba(10, 15, 26, 0.8)', backdropFilter: 'blur(20px)', borderBottom: '1px solid rgba(212, 175, 55, 0.1)' },
        navContent: { maxWidth: '1200px', margin: '0 auto', display: 'flex', justifyContent: 'space-between', alignItems: 'center' },
        logo: { display: 'flex', alignItems: 'center', gap: '0.75rem' },
        logoIcon: { width: '44px', height: '44px', background: 'linear-gradient(135deg, #d4af37, #c9a227, #b8860b)', borderRadius: '12px', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 4px 24px rgba(212, 175, 55, 0.3)', animation: 'glow 3s ease-in-out infinite' },
        logoText: { fontSize: '1.75rem', fontWeight: '600', fontFamily: '"Playfair Display", serif', background: 'linear-gradient(135deg, #d4af37, #f4e4ba)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' },
        navCta: { padding: '0.75rem 2rem', background: 'linear-gradient(135deg, #d4af37, #c9a227)', border: 'none', borderRadius: '10px', color: '#0a0f1a', fontSize: '0.9375rem', fontWeight: '600', cursor: 'pointer', fontFamily: 'inherit', boxShadow: '0 4px 20px rgba(212, 175, 55, 0.35)', transition: 'all 0.3s ease', display: 'flex', alignItems: 'center', gap: '0.5rem', textDecoration: 'none' },
        navActions: { display: 'flex', alignItems: 'center', gap: '1rem' },
        userInfo: { display: 'flex', alignItems: 'center', gap: '0.75rem', padding: '0.5rem 1rem', background: 'rgba(255, 255, 255, 0.05)', borderRadius: '10px', border: '1px solid rgba(255, 255, 255, 0.1)' },

    function FinancialTracker({ onBackToHome, user }) {
      const today = new Date();
      const realCurrentYear = getCurrentYear();

      const [isLoading, setIsLoading] = useState(true);
      const [loadError, setLoadError] = useState(null);

      const [activeYear, setActiveYear] = useState(realCurrentYear);
      const [dashboardYear, setDashboardYear] = useState(realCurrentYear);
      const [archivedYears, setArchivedYears] = useState([]);
      const [initialBalances, setInitialBalances] = useState({ [realCurrentYear]: 5000 });
      const [payrolls, setPayrolls] = useState([]);
      const [recurringExpenses, setRecurringExpenses] = useState([]);
      const [oneOffExpenses, setOneOffExpenses] = useState([]);
      const [balanceOverrides, setBalanceOverrides] = useState({});
      const [activeView, setActiveView] = useState('dashboard');
      const [editingCell, setEditingCell] = useState(null);
      const [editValue, setEditValue] = useState('');
      const [scrollToMonth, setScrollToMonth] = useState(today.getMonth());
      const [saveIndicator, setSaveIndicator] = useState(false);

      const [newPayroll, setNewPayroll] = useState({ name: '', amount: '', frequency: 'semimonthly', startDay: 1, dayOfWeek: 5 });
      const [newRecurringExpense, setNewRecurringExpense] = useState({ name: '', amount: '', frequency: 'monthly', dayOfMonth: 1, dayOfWeek: 5, month: 0, day: 1 });
      const [newOneOffExpense, setNewOneOffExpense] = useState({ name: '', amount: '', date: '' });
      const [showPayrollForm, setShowPayrollForm] = useState(false);
      const [showRecurringExpenseForm, setShowRecurringExpenseForm] = useState(false);
      const [showOneOffExpenseForm, setShowOneOffExpenseForm] = useState(false);
      const [addOneOffFromCalendar, setAddOneOffFromCalendar] = useState(null);

      const saveTimeoutRef = useRef(null);
      const monthRefs = useRef({});

      useEffect(() => {
        if (monthRefs.current[scrollToMonth]) {
          monthRefs.current[scrollToMonth].scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }, [scrollToMonth]);

      useEffect(() => {
        api.loadData()
          .then(data => {
            if (data.initialBalances) setInitialBalances(data.initialBalances);
            if (data.payrolls) setPayrolls(data.payrolls);
            if (data.recurringExpenses) setRecurringExpenses(data.recurringExpenses);
            if (data.oneOffExpenses) setOneOffExpenses(data.oneOffExpenses);
            if (data.balanceOverrides) setBalanceOverrides(data.balanceOverrides);
            if (data.currentYear) {
              setActiveYear(data.currentYear);
              setDashboardYear(data.currentYear);
            }
            if (data.archivedYears) setArchivedYears(data.archivedYears);
            setIsLoading(false);
          })
          .catch(err => {
            console.error('Failed to load data:', err);
            if (err.message === 'Unauthorized') {
              window.location.href = '/api/login';
              return;
            }
            setLoadError(err.message);
            setIsLoading(false);
          });
      }, []);

      const saveToServer = useCallback(() => {
        if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);
        saveTimeoutRef.current = setTimeout(() => {
          const data = {
            version: DATA_VERSION,
            initialBalances,
            payrolls,
            recurringExpenses,
            oneOffExpenses,
            balanceOverrides,
            currentYear: activeYear,
            archivedYears
          };
          api.saveData(data)
            .then(() => {
              setSaveIndicator(true);
              setTimeout(() => setSaveIndicator(false), 1500);
            })
            .catch(err => console.error('Save failed:', err));
        }, 500);
      }, [initialBalances, payrolls, recurringExpenses, oneOffExpenses, balanceOverrides, activeYear, archivedYears]);

      useEffect(() => {
        if (!isLoading) saveToServer();
      }, [initialBalances, payrolls, recurringExpenses, oneOffExpenses, balanceOverrides, activeYear, archivedYears]);

      const datesForYear = useMemo(() => generateDatesForYear(activeYear), [activeYear]);
      const availableYears = useMemo(() => Array.from(new Set([activeYear, ...archivedYears])).sort((a, b) => b - a), [activeYear, archivedYears]);

      const financialData = useMemo(() => {
        const data = [];
        const initialBalance = initialBalances[activeYear] || 5000;
        let runningBalance = initialBalance;

        datesForYear.forEach((date) => {
          const dateKey = date.toISOString().split('T')[0];
          const dayOfMonth = date.getDate();
          const dayOfWeekIdx = getDayOfWeekIndex(date);
          const month = date.getMonth();
          const year = date.getFullYear();

          let startingBalance = balanceOverrides[dateKey] !== undefined ? balanceOverrides[dateKey] : runningBalance;

          let payrollAmount = 0;
          const payrollDetails = [];

          payrolls.forEach(payroll => {
            let isPayday = false;
            if (payroll.frequency === 'monthly' && dayOfMonth === payroll.startDay) isPayday = true;
            else if (payroll.frequency === 'biweekly') {
              const startDate = new Date(payroll.startYear || activeYear, 0, payroll.startDay);
              const diffDays = Math.floor((date - startDate) / (1000 * 60 * 60 * 24));
              if (diffDays >= 0 && diffDays % 14 === 0) isPayday = true;
            } else if (payroll.frequency === 'weekly') {
              const startDate = new Date(payroll.startYear || activeYear, 0, payroll.startDay);
              const diffDays = Math.floor((date - startDate) / (1000 * 60 * 60 * 24));
              if (diffDays >= 0 && diffDays % 7 === 0) isPayday = true;
            } else if (payroll.frequency === 'semimonthly') {
              const lastWeekdayBefore15th = getLastWeekdayOnOrBefore(year, month, 15);
              const lastWeekdayOfMonth = getLastWeekdayOfMonth(year, month);
              if (dayOfMonth === lastWeekdayBefore15th || dayOfMonth === lastWeekdayOfMonth) isPayday = true;
            } else if (payroll.frequency === 'last-weekday-15th') {
              if (dayOfMonth === getLastWeekdayOnOrBefore(year, month, 15)) isPayday = true;
            } else if (payroll.frequency === 'last-weekday-eom') {
              if (dayOfMonth === getLastWeekdayOfMonth(year, month)) isPayday = true;
            }
            if (isPayday) { payrollAmount += payroll.amount; payrollDetails.push(payroll); }
          });

          startingBalance += payrollAmount;

          let recurringExpenseAmount = 0;
          const recurringExpenseDetails = [];

          recurringExpenses.forEach(expense => {
            let isDue = false;
            if (expense.frequency === 'monthly' && expense.dayOfMonth === dayOfMonth) isDue = true;
            else if (expense.frequency === 'weekly' && expense.dayOfWeek === dayOfWeekIdx) isDue = true;
            else if (expense.frequency === 'yearly' && expense.month === month && expense.day === dayOfMonth) isDue = true;
            if (isDue) { recurringExpenseAmount += expense.amount; recurringExpenseDetails.push({ ...expense, isRecurring: true }); }
          });

          let oneOffExpenseAmount = 0;
          const oneOffExpenseDetails = [];
          oneOffExpenses.forEach(expense => {
            if (expense.date === dateKey) { oneOffExpenseAmount += expense.amount; oneOffExpenseDetails.push({ ...expense, isRecurring: false }); }
          });

          const totalExpenses = recurringExpenseAmount + oneOffExpenseAmount;
          const allExpenseDetails = [...recurringExpenseDetails, ...oneOffExpenseDetails];
          const endingBalance = startingBalance - totalExpenses;

          data.push({
            date, dateKey, dayOfWeek: getDayOfWeek(date), dayOfWeekIdx, dayOfMonth, month, year,
            startingBalance, endingBalance, expenses: totalExpenses,
            recurringExpenses: recurringExpenseAmount, oneOffExpenses: oneOffExpenseAmount,
            expenseDetails: allExpenseDetails, recurringExpenseDetails, oneOffExpenseDetails,
            payrollAmount, payrollDetails,
            isOverridden: balanceOverrides[dateKey] !== undefined,
            isPast: date < today, isToday: date.toDateString() === today.toDateString(),
          });

          runningBalance = endingBalance;
        });

          <div style={styles.sectionTitle}><Icons.TrendUp /> Overview</div>
          <div className="app-dashboard-grid" style={styles.dashboardGrid}>
            <div className="app-stat-card" style={styles.statCard()}><div style={styles.statCardAccent('#4ade80')} /><div style={styles.statLabel}>Starting Balance (Jan 1)</div><div className="app-stat-value" style={styles.statValue('#4ade80')}>{formatCurrency(stats.initialBalance)}</div></div>
            <div className="app-stat-card" style={styles.statCard()}><div style={styles.statCardAccent('#8b5cf6')} /><div style={styles.statLabel}>Projected Year-End</div><div className="app-stat-value" style={styles.statValue(stats.endOfYearBalance >= 0 ? '#4ade80' : '#f87171')}>{formatCurrency(stats.endOfYearBalance)}</div><div style={styles.statSubtext}>Dec 31, {dashboardYear}</div></div>
            <div className="app-stat-card" style={styles.statCard()}><div style={styles.statCardAccent('#f87171')} /><div style={styles.statLabel}>Lowest Balance Point</div><div className="app-stat-value" style={styles.statValue('#f87171')}>{formatCurrency(stats.lowestBalance)}</div><div style={styles.statSubtext}>{stats.lowestBalanceDate && formatFullDate(stats.lowestBalanceDate)}</div></div>
            <div className="app-stat-card" style={styles.statCard()}><div style={styles.statCardAccent('#10b981')} /><div style={styles.statLabel}>Net Annual Cashflow</div><div className="app-stat-value" style={styles.statValue(stats.netAnnual >= 0 ? '#4ade80' : '#f87171')}>{formatCurrency(stats.netAnnual)}</div><div style={styles.statSubtext}>Income - Expenses</div></div>
          </div>

          <div style={styles.sectionTitle}><Icons.Expense /> Expense Tracking</div>
          <div className="app-dashboard-grid" style={styles.dashboardGrid}>
            <div className="app-stat-card" style={styles.statCard()}><div style={styles.statCardAccent('#f87171')} /><div style={styles.statLabel}>Forecasted Recurring Expenses</div><div className="app-stat-value" style={styles.statValue('#f87171')}>{formatCurrency(stats.forecastedRecurringExpenses)}</div><div style={styles.statSubtext}>Until Dec 31</div></div>
            <div className="app-stat-card" style={styles.statCard()}><div style={styles.statCardAccent('#fbbf24')} /><div style={styles.statLabel}>Forecasted Total Expenses</div><div className="app-stat-value" style={styles.statValue('#fbbf24')}>{formatCurrency(stats.forecastedTotalExpenses)}</div><div style={styles.statSubtext}>Recurring + One-off until Dec 31</div></div>
            <div className="app-stat-card" style={styles.statCard()}><div style={styles.statCardAccent('#a855f7')} /><div style={styles.statLabel}>Paid Recurring Expenses YTD</div><div className="app-stat-value" style={styles.statValue('#a855f7')}>{formatCurrency(stats.historicalRecurringExpensesPaid)}</div><div style={styles.statSubtext}>Year to date</div></div>
            <div className="app-stat-card" style={styles.statCard()}><div style={styles.statCardAccent('#ec4899')} /><div style={styles.statLabel}>Paid Total Expenses YTD</div><div className="app-stat-value" style={styles.statValue('#ec4899')}>{formatCurrency(stats.historicalTotalExpensesPaid)}</div><div style={styles.statSubtext}>Recurring + One-off YTD</div></div>
          </div>

          <div style={styles.sectionTitle}><Icons.Calendar /> Full Year Summary ({dashboardYear})</div>
          <div className="app-dashboard-grid" style={styles.dashboardGrid}>
            <div className="app-stat-card" style={styles.statCard()}><div style={styles.statCardAccent('#22d3ee')} /><div style={styles.statLabel}>Total Income</div><div className="app-stat-value" style={styles.statValue('#4ade80')}>{formatCurrency(stats.totalPayrollForYear)}</div></div>
            <div className="app-stat-card" style={styles.statCard()}><div style={styles.statCardAccent('#6366f1')} /><div style={styles.statLabel}>Total Recurring Expenses</div><div className="app-stat-value" style={styles.statValue('#f87171')}>{formatCurrency(stats.totalRecurringExpensesForYear)}</div></div>
            <div className="app-stat-card" style={styles.statCard()}><div style={styles.statCardAccent('#f59e0b')} /><div style={styles.statLabel}>Total One-Off Expenses</div><div className="app-stat-value" style={styles.statValue('#fbbf24')}>{formatCurrency(stats.totalOneOffExpensesForYear)}</div></div>
            <div className="app-stat-card" style={styles.statCard()}><div style={styles.statCardAccent('#ef4444')} /><div style={styles.statLabel}>Total All Expenses</div><div className="app-stat-value" style={styles.statValue('#f87171')}>{formatCurrency(stats.totalExpensesForYear)}</div></div>
          </div>

          <div className="app-three-column" style={styles.threeColumn}>
            <div className="app-panel" style={styles.panel}>
              <div className="app-panel-header" style={styles.panelHeader}>
                <div style={styles.panelTitle}><Icons.Money /> Income Sources</div>
                <button style={styles.addButton} onClick={() => setShowPayrollForm(true)}><Icons.Plus /> Add</button>
              </div>
              {payrolls.length === 0 ? <div style={styles.emptyState}>No income sources added yet</div> : payrolls.map(payroll => (
                <div key={payroll.id} className="app-item-row" style={styles.itemRow}>
                  <div><div style={styles.itemName}>{payroll.name}</div><div style={styles.itemMeta}>{frequencyLabels[payroll.frequency]}</div></div>
                  <div className="app-item-actions" style={{ display: 'flex', alignItems: 'center', gap: '0.75rem' }}><span style={styles.itemAmount(true)}>+{formatCurrency(payroll.amount)}</span><button style={styles.deleteBtn} onClick={() => deletePayroll(payroll.id)}><Icons.Trash /></button></div>
                </div>
              ))}
            </div>

            <div className="app-panel" style={styles.panel}>
              <div className="app-panel-header" style={styles.panelHeader}>
                <div style={styles.panelTitle}><Icons.Recurring /> Recurring Expenses</div>
                <button style={styles.addButton} onClick={() => setShowRecurringExpenseForm(true)}><Icons.Plus /> Add</button>
              </div>
              {recurringExpenses.length === 0 ? <div style={styles.emptyState}>No recurring expenses added yet</div> : recurringExpenses.map(expense => (
                <div key={expense.id} className="app-item-row" style={styles.itemRow}>
                  <div><div style={styles.itemName}>{expense.name}</div><div style={styles.itemMeta}>{getExpenseFrequencyLabel(expense)}</div></div>
                  <div className="app-item-actions" style={{ display: 'flex', alignItems: 'center', gap: '0.75rem' }}><span style={styles.itemAmount()}>-{formatCurrency(expense.amount)}</span><button style={styles.deleteBtn} onClick={() => deleteRecurringExpense(expense.id)}><Icons.Trash /></button></div>
                </div>
              ))}
            </div>

            <div className="app-panel" style={styles.panel}>
              <div className="app-panel-header" style={styles.panelHeader}>
                <div style={styles.panelTitle}><Icons.OneTime /> One-Off Expenses</div>
                <button style={styles.addButton} onClick={() => setShowOneOffExpenseForm(true)}><Icons.Plus /> Add</button>
              </div>
              {oneOffExpenses.filter(e => e.date.startsWith(String(dashboardYear))).length === 0 ? <div style={styles.emptyState}>No one-off expenses for {dashboardYear}</div> : oneOffExpenses.filter(e => e.date.startsWith(String(dashboardYear))).sort((a, b) => a.date.localeCompare(b.date)).map(expense => (
                <div key={expense.id} className="app-item-row" style={styles.itemRow}>
                  <div><div style={styles.itemName}>{expense.name}</div><div style={styles.itemMeta}>{formatFullDate(new Date(expense.date + 'T00:00:00'))}</div></div>
                  <div className="app-item-actions" style={{ display: 'flex', alignItems: 'center', gap: '0.75rem' }}><span style={styles.itemAmount()}>-{formatCurrency(expense.amount)}</span><button style={styles.deleteBtn} onClick={() => deleteOneOffExpense(expense.id)}><Icons.Trash /></button></div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );

      const renderCalendar = () => {
        return (
          <div className="app-table-container" style={styles.tableContainer}>
            <div className="app-initial-balance-section" style={styles.initialBalanceSection}>
              <span style={styles.initialBalanceLabel}>Initial Balance (Jan 1, {activeYear}):</span>
              <input type="number" value={initialBalances[activeYear] || 5000} onChange={(e) => updateInitialBalance(activeYear, e.target.value)} style={styles.initialBalanceInput} />
            </div>
            <div className="app-month-selector" style={styles.monthSelector}>
              {months.map((month, idx) => (<button key={month} style={styles.monthBtn(scrollToMonth === idx)} onClick={() => setScrollToMonth(idx)}>{month.slice(0, 3)}</button>))}
            </div>
            <div className="app-table-header" style={styles.tableHeader}>
              <div className="app-table-header-cell" style={styles.tableHeaderCell}>Date</div>
              <div className="app-table-header-cell" style={styles.tableHeaderCell}>Day</div>
              <div className="app-table-header-cell" style={styles.tableHeaderCell}>Activity</div>
              <div className="app-table-header-cell" style={styles.tableHeaderCell}>Starting</div>
              <div className="app-table-header-cell app-hide-mobile" style={styles.tableHeaderCell}>Expenses</div>
              <div className="app-table-header-cell" style={styles.tableHeaderCell}>Ending</div>
              <div className="app-table-header-cell app-hide-mobile" style={styles.tableHeaderCell}></div>
            </div>
            <div style={styles.tableBody}>
              {financialData.map((day, idx) => {
                const isMonthStart = day.dayOfMonth === 1;
                const prevMonth = idx > 0 ? financialData[idx - 1].month : -1;
                const showMonthDivider = day.month !== prevMonth;

                return (
                  <Fragment key={day.dateKey}>
                    {showMonthDivider && (<div style={styles.monthDivider} ref={el => monthRefs.current[day.month] = el}><span style={styles.monthLabel}>{months[day.month]} {day.year}</span></div>)}
                    <div className="app-table-row" style={styles.tableRow(day.isToday, day.isPast, isMonthStart)}>
                      <div className="app-table-cell" style={styles.tableCell}>{formatDate(day.date)}</div>
                      <div className="app-table-cell" style={styles.tableCell}>{day.dayOfWeek}</div>
                      <div className="app-table-cell" style={{ ...styles.tableCell, flexWrap: 'wrap' }}>
                        <div style={styles.expensesList}>
                          {day.payrollDetails.map((p, i) => (<span key={i} style={styles.payrollBadge}>+${p.amount} {p.name}</span>))}
                          {day.expenseDetails.map((e, i) => (<span key={i} style={e.isRecurring ? styles.recurringExpenseBadge : styles.oneOffExpenseBadge}>-${e.amount} {e.name}</span>))}
                        </div>
                      </div>
                      <div className="app-table-cell" style={styles.tableCell}>
                        {editingCell === day.dateKey ? (
                          <div style={{ display: 'flex', alignItems: 'center' }}>
                            <input type="number" value={editValue} onChange={(e) => setEditValue(e.target.value)} style={styles.inlineInput} autoFocus onKeyDown={(e) => { if (e.key === 'Enter') handleOverrideBalance(day.dateKey, editValue); if (e.key === 'Escape') setEditingCell(null); }} />
                            <div style={styles.inlineActions}>
                              <button style={styles.inlineBtn('76, 175, 80')} onClick={() => handleOverrideBalance(day.dateKey, editValue)}><Icons.Check style={{ color: '#4caf50' }} /></button>
                              <button style={styles.inlineBtn('239, 83, 80')} onClick={() => setEditingCell(null)}><Icons.X style={{ color: '#ef5350' }} /></button>
                            </div>
                          </div>
                        ) : (
                          <span style={day.startingBalance >= 0 ? styles.balancePositive : styles.balanceNegative}>
                            {formatCurrency(day.startingBalance)}
                            {day.isOverridden && (<span style={styles.overrideBadge} onClick={() => clearOverride(day.dateKey)} title="Click to clear override">Override</span>)}
                            <button style={styles.editButton} onClick={() => { setEditingCell(day.dateKey); setEditValue(day.startingBalance.toString()); }}><Icons.Edit /></button>
                          </span>
                        )}
                      </div>
                      <div className="app-table-cell app-hide-mobile" style={{ ...styles.tableCell, ...styles.expenseCell }}>{day.expenses > 0 ? `-${formatCurrency(day.expenses)}` : '-'}</div>
                      <div className="app-table-cell" style={styles.tableCell}><span style={day.endingBalance >= 0 ? styles.balancePositive : styles.balanceNegative}>{formatCurrency(day.endingBalance)}</span></div>
                      <div className="app-table-cell app-hide-mobile" style={styles.tableCell}><button style={styles.addExpenseBtn} onClick={() => openOneOffFormForDate(day.dateKey)} title="Add expense"><Icons.Plus /></button></div>
                    </div>
                  </Fragment>
                );
              })}
            </div>
          </div>
        );
      };

      return (
        <div style={styles.container}>
          <header className="app-header" style={styles.header}>
            <div className="app-header-content" style={styles.headerContent}>
              <div className="app-header-top">
                <div style={styles.logo} onClick={onBackToHome}><div style={styles.logoIcon}><Icons.TrendUp /></div><span className="app-logo-text" style={styles.logoText}>Mercury</span><span className="app-year-badge" style={styles.yearBadge}>{activeYear}</span></div>
                <div className="app-header-actions" style={styles.headerActions}>
                  <div className="app-hide-mobile" style={styles.cloudIndicator}><Icons.Cloud /> Cloud Sync</div>
                  <div style={styles.saveIndicator}><Icons.Save /> Saved</div>
                  {user && (
                    <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', padding: '0.375rem 0.75rem', background: 'rgba(255, 255, 255, 0.05)', borderRadius: '8px', border: '1px solid rgba(255, 255, 255, 0.1)' }}>
                      {user.profile_image ? (
                        <img src={user.profile_image} alt="" style={{ width: '28px', height: '28px', borderRadius: '50%', objectFit: 'cover', border: '2px solid rgba(212, 175, 55, 0.3)' }} />
                      ) : (
                        <div style={{ width: '28px', height: '28px', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'rgba(212, 175, 55, 0.2)', color: '#d4af37' }}><Icons.User /></div>
                      )}
                      <span className="app-hide-mobile" style={{ color: '#f5f5f0', fontSize: '0.8125rem', fontWeight: '500' }}>{user.first_name || user.email || 'User'}</span>
                      <a href="/api/logout" style={{ display: 'flex', alignItems: 'center', color: '#808080', padding: '0.25rem', borderRadius: '4px', transition: 'color 0.2s' }} title="Sign Out"><Icons.LogOut /></a>
                    </div>
                  )}
                </div>
              </div>
              <nav className="app-nav" style={styles.nav}><button className="app-nav-btn" style={styles.navButton(activeView === 'dashboard')} onClick={() => setActiveView('dashboard')}><Icons.Dashboard /> Dashboard</button><button className="app-nav-btn" style={styles.navButton(activeView === 'calendar')} onClick={() => setActiveView('calendar')}><Icons.Calendar /> Calendar</button></nav>
            </div>
          </header>
          <main className="app-main" style={styles.main}>{activeView === 'dashboard' ? renderDashboard() : renderCalendar()}</main>

          {showPayrollForm && (
            <div style={styles.formOverlay} onClick={() => setShowPayrollForm(false)}>
              <div className="app-form-card" style={styles.formCard} onClick={e => e.stopPropagation()}>
                <h3 style={styles.formTitle}>Add Income Source</h3>
                <div style={styles.formGroup}><label style={styles.formLabel}>Name</label><input type="text" placeholder="e.g., Salary, Freelance" value={newPayroll.name} onChange={e => setNewPayroll(p => ({ ...p, name: e.target.value }))} style={styles.formInput} /></div>
                <div style={styles.formGroup}><label style={styles.formLabel}>Amount (per payment)</label><input type="number" placeholder="0.00" value={newPayroll.amount} onChange={e => setNewPayroll(p => ({ ...p, amount: e.target.value }))} style={styles.formInput} /></div>
                <div style={styles.formGroup}><label style={styles.formLabel}>Frequency</label><select value={newPayroll.frequency} onChange={e => setNewPayroll(p => ({ ...p, frequency: e.target.value }))} style={styles.formSelect}><option value="weekly">Weekly</option><option value="biweekly">Biweekly</option><option value="monthly">Monthly (specific day)</option><option value="semimonthly">Semi-monthly (15th & EOM weekdays)</option><option value="last-weekday-15th">Last weekday before 15th only</option><option value="last-weekday-eom">Last weekday of month only</option></select></div>
                {['weekly', 'biweekly', 'monthly'].includes(newPayroll.frequency) && (<div style={styles.formGroup}><label style={styles.formLabel}>{newPayroll.frequency === 'monthly' ? 'Day of Month (1-31)' : 'Start Day (1-31)'}</label><input type="number" min="1" max="31" value={newPayroll.startDay} onChange={e => setNewPayroll(p => ({ ...p, startDay: e.target.value }))} style={styles.formInput} /><div style={styles.formHint}>{newPayroll.frequency === 'biweekly' && 'First paycheck date in January, then every 14 days'}{newPayroll.frequency === 'weekly' && 'First paycheck date in January, then every 7 days'}</div></div>)}
                <div className="app-form-actions" style={styles.formActions}><button style={styles.cancelBtn} onClick={() => setShowPayrollForm(false)}>Cancel</button><button style={styles.submitBtn} onClick={addPayroll}>Add Income</button></div>
              </div>
            </div>
          )}

          {showRecurringExpenseForm && (
            <div style={styles.formOverlay} onClick={() => setShowRecurringExpenseForm(false)}>
              <div className="app-form-card" style={styles.formCard} onClick={e => e.stopPropagation()}>
                <h3 style={styles.formTitle}>Add Recurring Expense</h3>
                <div style={styles.formGroup}><label style={styles.formLabel}>Name</label><input type="text" placeholder="e.g., Rent, Netflix, Groceries" value={newRecurringExpense.name} onChange={e => setNewRecurringExpense(p => ({ ...p, name: e.target.value }))} style={styles.formInput} /></div>
                <div style={styles.formGroup}><label style={styles.formLabel}>Amount</label><input type="number" placeholder="0.00" value={newRecurringExpense.amount} onChange={e => setNewRecurringExpense(p => ({ ...p, amount: e.target.value }))} style={styles.formInput} /></div>
                <div style={styles.formGroup}><label style={styles.formLabel}>Frequency</label><select value={newRecurringExpense.frequency} onChange={e => setNewRecurringExpense(p => ({ ...p, frequency: e.target.value }))} style={styles.formSelect}><option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="yearly">Yearly</option></select></div>
                {newRecurringExpense.frequency === 'weekly' && (<div style={styles.formGroup}><label style={styles.formLabel}>Day of Week</label><select value={newRecurringExpense.dayOfWeek} onChange={e => setNewRecurringExpense(p => ({ ...p, dayOfWeek: parseInt(e.target.value) }))} style={styles.formSelect}>{dayNames.map((day, idx) => <option key={day} value={idx}>{day}</option>)}</select></div>)}
                {newRecurringExpense.frequency === 'monthly' && (<div style={styles.formGroup}><label style={styles.formLabel}>Day of Month (1-31)</label><input type="number" min="1" max="31" value={newRecurringExpense.dayOfMonth} onChange={e => setNewRecurringExpense(p => ({ ...p, dayOfMonth: e.target.value }))} style={styles.formInput} /></div>)}
                {newRecurringExpense.frequency === 'yearly' && (<><div style={styles.formGroup}><label style={styles.formLabel}>Month</label><select value={newRecurringExpense.month} onChange={e => setNewRecurringExpense(p => ({ ...p, month: parseInt(e.target.value) }))} style={styles.formSelect}>{months.map((month, idx) => <option key={month} value={idx}>{month}</option>)}</select></div><div style={styles.formGroup}><label style={styles.formLabel}>Day</label><input type="number" min="1" max="31" value={newRecurringExpense.day} onChange={e => setNewRecurringExpense(p => ({ ...p, day: e.target.value }))} style={styles.formInput} /></div></>)}
                <div className="app-form-actions" style={styles.formActions}><button style={styles.cancelBtn} onClick={() => setShowRecurringExpenseForm(false)}>Cancel</button><button style={styles.submitBtn} onClick={addRecurringExpense}>Add Expense</button></div>
              </div>
            </div>
          )}

          {showOneOffExpenseForm && (
            <div style={styles.formOverlay} onClick={() => { setShowOneOffExpenseForm(false); setAddOneOffFromCalendar(null); }}>
              <div className="app-form-card" style={styles.formCard} onClick={e => e.stopPropagation()}>
                <h3 style={styles.formTitle}>Add One-Off Expense</h3>
                <div style={styles.formGroup}><label style={styles.formLabel}>Name</label><input type="text" placeholder="e.g., Car repair, Gift, Trip" value={newOneOffExpense.name} onChange={e => setNewOneOffExpense(p => ({ ...p, name: e.target.value }))} style={styles.formInput} /></div>
                <div style={styles.formGroup}><label style={styles.formLabel}>Amount</label><input type="number" placeholder="0.00" value={newOneOffExpense.amount} onChange={e => setNewOneOffExpense(p => ({ ...p, amount: e.target.value }))} style={styles.formInput} /></div>
                <div style={styles.formGroup}><label style={styles.formLabel}>Date</label><input type="date" value={newOneOffExpense.date} onChange={e => setNewOneOffExpense(p => ({ ...p, date: e.target.value }))} style={styles.formInput} />{addOneOffFromCalendar && <div style={styles.formHint}>Selected: {formatFullDate(new Date(addOneOffFromCalendar + 'T00:00:00'))}</div>}</div>
                <div className="app-form-actions" style={styles.formActions}><button style={styles.cancelBtn} onClick={() => { setShowOneOffExpenseForm(false); setAddOneOffFromCalendar(null); }}>Cancel</button><button style={styles.submitBtn} onClick={addOneOffExpense}>Add Expense</button></div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function AppShell() {
      const [currentView, setCurrentView] = useState('home');
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);

      useEffect(() => {
        api.getUser()
          .then(userData => {
            setUser(userData);
            setAuthLoading(false);
          })
          .catch(() => {
            setAuthLoading(false);
          });
      }, []);

      if (authLoading) {
        return (
          <div className="loading-screen">
            <div className="loading-spinner"></div>
            <span>Loading Mercury...</span>
          </div>
        );
      }

      if (currentView === 'app' && !user) {
        window.location.href = '/api/login';
        return null;
      }

      return currentView === 'home' 
        ? <HomePage onEnterApp={() => setCurrentView('app')} user={user} />
        : <FinancialTracker onBackToHome={() => setCurrentView('home')} user={user} />;
    }

    ReactDOM.render(<AppShell />, document.getElementById('root'));
  </script>
</body>
</html>
