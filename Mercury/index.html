<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mercury - Personal Finance Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2322d3ee'/%3E%3Cg fill='none' stroke='%23042027' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M11 6 Q16 11 21 6'/%3E%3Ccircle cx='16' cy='15' r='5'/%3E%3Cline x1='16' y1='20' x2='16' y2='27'/%3E%3Cline x1='12.5' y1='23.6' x2='19.5' y2='23.6'/%3E%3C/g%3E%3C/svg%3E">
  <meta name="theme-color" content="#22d3ee">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://unpkg.com/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* ===== Quicksilver — Liquid Glass (dark) ===== */
      --bg-primary: #060a12;
      --bg-secondary: #0a111c;
      --bg-tertiary: #0b1826;
      --bg-gradient: linear-gradient(165deg, #060a12 0%, #0a111c 45%, #0a1622 100%);
      --bg-surface: rgba(255, 255, 255, 0.035);
      --bg-surface-hover: rgba(255, 255, 255, 0.06);
      --bg-overlay: rgba(8, 14, 22, 0.68);
      --text-primary: #eef5f8;
      --text-secondary: #a3b6c1;
      --text-muted: #6f8693;
      --text-dim: #4b6271;
      --border-subtle: rgba(255, 255, 255, 0.06);
      --border-light: rgba(255, 255, 255, 0.1);
      --border-medium: rgba(255, 255, 255, 0.16);
      --accent: #22d3ee;
      --accent-2: #38bdf8;
      --accent-light: #a5f3fc;
      --accent-dark: #0e9bb8;
      --accent-gradient: linear-gradient(135deg, #2dd4bf 0%, #22d3ee 50%, #38bdf8 100%);
      --accent-bg: rgba(34, 211, 238, 0.09);
      --accent-bg-hover: rgba(34, 211, 238, 0.15);
      --accent-border: rgba(34, 211, 238, 0.22);
      --accent-border-strong: rgba(34, 211, 238, 0.42);
      --accent-text-on: #03121a;
      --success: #34d399;
      --success-bg: rgba(52, 211, 153, 0.12);
      --danger: #fb7185;
      --danger-bg: rgba(251, 113, 133, 0.12);
      --warning: #fbbf24;
      --warning-bg: rgba(251, 191, 36, 0.12);
      --scrollbar-track: rgba(255,255,255,0.02);
      --scrollbar-thumb: rgba(34,211,238,0.28);
      --shadow-color: rgba(0, 0, 0, 0.5);
      --chart-grid: rgba(255, 255, 255, 0.05);
      --rain-bg: rgba(6, 10, 18, 0.09);
      --rain-color: rgba(34, 211, 238, 0.16);
      /* Liquid glass surfaces */
      --glass-bg: rgba(255, 255, 255, 0.045);
      --glass-bg-strong: rgba(16, 28, 40, 0.55);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-highlight: rgba(255, 255, 255, 0.22);
      --glass-blur: 18px;
      --elev-1: 0 2px 10px rgba(0,0,0,0.28);
      --elev-2: 0 12px 36px rgba(0,0,0,0.40);
      --elev-3: 0 28px 70px rgba(0,0,0,0.50);
      --glow-accent: 0 0 28px rgba(34, 211, 238, 0.28);
      --aurora-1: rgba(34, 211, 238, 0.18);
      --aurora-2: rgba(45, 212, 191, 0.16);
      --aurora-3: rgba(56, 189, 248, 0.14);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    [data-theme="light"] {
      /* ===== Quicksilver — Liquid Glass (light) ===== */
      --bg-primary: #eef2f7;
      --bg-secondary: #ffffff;
      --bg-tertiary: #e6edf5;
      --bg-gradient: linear-gradient(165deg, #eef2f7 0%, #f7fafc 45%, #e6eef6 100%);
      --bg-surface: rgba(255, 255, 255, 0.6);
      --bg-surface-hover: rgba(255, 255, 255, 0.85);
      --bg-overlay: rgba(255, 255, 255, 0.72);
      --text-primary: #0c1b26;
      --text-secondary: #3c5260;
      --text-muted: #5c7382;
      --text-dim: #8499a6;
      --border-subtle: rgba(12, 27, 38, 0.07);
      --border-light: rgba(12, 27, 38, 0.11);
      --border-medium: rgba(12, 27, 38, 0.16);
      --accent: #0e9bb8;
      --accent-2: #0284c7;
      --accent-light: #22d3ee;
      --accent-dark: #0b7e96;
      --accent-gradient: linear-gradient(135deg, #0d9488 0%, #0e9bb8 50%, #0284c7 100%);
      --accent-bg: rgba(14, 155, 184, 0.1);
      --accent-bg-hover: rgba(14, 155, 184, 0.16);
      --accent-border: rgba(14, 155, 184, 0.26);
      --accent-border-strong: rgba(14, 155, 184, 0.42);
      --accent-text-on: #ffffff;
      --success: #059669;
      --success-bg: rgba(5, 150, 105, 0.1);
      --danger: #e11d48;
      --danger-bg: rgba(225, 29, 72, 0.1);
      --warning: #d97706;
      --warning-bg: rgba(217, 119, 6, 0.1);
      --scrollbar-track: rgba(0,0,0,0.03);
      --scrollbar-thumb: rgba(14,155,184,0.32);
      --shadow-color: rgba(20, 40, 60, 0.14);
      --chart-grid: rgba(12, 27, 38, 0.08);
      --rain-bg: rgba(238, 242, 247, 0.1);
      --rain-color: rgba(14, 155, 184, 0.22);
      --glass-bg: rgba(255, 255, 255, 0.55);
      --glass-bg-strong: rgba(255, 255, 255, 0.72);
      --glass-border: rgba(255, 255, 255, 0.7);
      --glass-highlight: rgba(255, 255, 255, 0.9);
      --glass-blur: 16px;
      --elev-1: 0 2px 10px rgba(20,40,60,0.08);
      --elev-2: 0 12px 36px rgba(20,40,60,0.12);
      --elev-3: 0 28px 70px rgba(20,40,60,0.16);
      --glow-accent: 0 0 28px rgba(14, 155, 184, 0.22);
      --aurora-1: rgba(14, 155, 184, 0.16);
      --aurora-2: rgba(13, 148, 136, 0.14);
      --aurora-3: rgba(2, 132, 199, 0.12);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg-primary); min-height: 100vh; color: var(--text-primary); transition: background 0.4s ease, color 0.4s ease; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; position: relative; overflow-x: hidden; }
    /* Ambient aurora field — subtle liquid-glass backdrop */
    body::before { content: ''; position: fixed; inset: -20%; z-index: -2; background: var(--bg-gradient); pointer-events: none; }
    body::after {
      content: ''; position: fixed; inset: -30%; z-index: -1; pointer-events: none; opacity: 0.9;
      background:
        radial-gradient(40% 38% at 18% 14%, var(--aurora-1) 0%, transparent 60%),
        radial-gradient(36% 34% at 84% 22%, var(--aurora-3) 0%, transparent 62%),
        radial-gradient(44% 42% at 70% 86%, var(--aurora-2) 0%, transparent 64%);
      filter: blur(20px); animation: auroraDrift 26s ease-in-out infinite alternate;
    }
    #root { min-height: 100vh; position: relative; z-index: 0; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent-border-strong); }
    input:focus, select:focus { border-color: var(--accent-border-strong) !important; outline: none; box-shadow: 0 0 0 3px var(--accent-bg-hover); }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
    option { background: var(--bg-secondary); color: var(--text-primary); }
    ::selection { background: var(--accent-border-strong); color: var(--text-primary); }
    .loading-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; color: var(--accent); gap: 0.25rem; }
    .loading-spinner { width: 42px; height: 42px; border: 3px solid var(--accent-border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; margin-bottom: 1rem; box-shadow: var(--glow-accent); }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-20px); } }
    @keyframes shimmer { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }
    @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.8; } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes glow { 0%, 100% { box-shadow: 0 0 22px rgba(34,211,238,0.30); } 50% { box-shadow: 0 0 44px rgba(34,211,238,0.55); } }
    @keyframes auroraDrift {
      0% { transform: translate3d(0,0,0) scale(1); }
      50% { transform: translate3d(2%, -2%, 0) scale(1.08); }
      100% { transform: translate3d(-2%, 1%, 0) scale(1.04); }
    }
    @keyframes popIn { from { opacity: 0; transform: scale(0.96) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    @keyframes sheen { 0% { transform: translateX(-130%) skewX(-18deg); } 100% { transform: translateX(230%) skewX(-18deg); } }

    /* ============ Liquid Glass surfaces ============ */
    .glass, .app-panel, .app-stat-card, .app-form-card, .cashflow-stat-card,
    .sankey-container, .cashflow-detail-panel, .mobile-feature-card, .mobile-demo-preview {
      position: relative;
      backdrop-filter: blur(var(--glass-blur)) saturate(150%);
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(150%);
    }
    /* Ensure the specular ::before anchors to the card itself */
    .app-panel, .cashflow-stat-card, .sankey-container, .cashflow-detail-panel { position: relative; }
    .app-panel, .cashflow-stat-card { overflow: hidden; }
    /* Specular top-edge highlight shared by glass cards */
    .app-panel::before, .app-stat-card::before, .mobile-feature-card::before, .cashflow-stat-card::before {
      content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      background: linear-gradient(180deg, var(--glass-highlight) 0%, transparent 18%); opacity: 0.5;
      -webkit-mask: linear-gradient(180deg, #000, transparent 40%); mask: linear-gradient(180deg, #000, transparent 40%);
    }

    /* ============ Micro-interactions ============ */
    .app-stat-card, .mobile-feature-card, .cashflow-stat-card {
      transition: transform 0.35s var(--ease-out), box-shadow 0.35s var(--ease-out), border-color 0.35s var(--ease-out);
      will-change: transform;
    }
    .app-stat-card:hover, .mobile-feature-card:hover, .cashflow-stat-card:hover {
      transform: translateY(-4px); box-shadow: var(--elev-2); border-color: var(--accent-border-strong) !important;
    }
    /* Reveal the feature card's top accent line on hover */
    .mobile-feature-card > div:first-child { opacity: 0; transition: opacity 0.4s ease; }
    .mobile-feature-card:hover > div:first-child { opacity: 1 !important; }
    .app-panel { transition: border-color 0.3s ease, box-shadow 0.3s ease; }
    .app-panel:hover { border-color: var(--border-light) !important; }
    .app-item-row { transition: transform 0.2s var(--ease-out), background 0.2s ease, border-color 0.2s ease; }
    .app-item-row:hover { transform: translateX(3px); background: var(--bg-surface-hover) !important; border-color: var(--accent-border) !important; }
    /* Keep the name/meta column from squeezing the amount; truncate instead of wrapping */
    .app-item-row > div:first-child { min-width: 0; flex: 1 1 auto; }
    .app-item-row > div:first-child > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .app-item-actions { flex-shrink: 0; }
    /* Buttons: press + hover lift + sheen */
    .app-nav-btn, .mobile-nav-cta, .mobile-primary-btn, .mobile-secondary-btn {
      transition: transform 0.18s var(--ease-spring), box-shadow 0.3s ease, background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }
    .mobile-primary-btn, .mobile-nav-cta { position: relative; overflow: hidden; }
    .mobile-primary-btn::after, .mobile-nav-cta::after {
      content: ''; position: absolute; top: 0; left: 0; width: 45%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent); opacity: 0;
    }
    .mobile-primary-btn:hover, .mobile-nav-cta:hover { transform: translateY(-2px); box-shadow: 0 10px 30px var(--accent-border-strong); }
    .mobile-primary-btn:hover::after, .mobile-nav-cta:hover::after { opacity: 1; animation: sheen 0.9s var(--ease-out); }
    .mobile-secondary-btn:hover { transform: translateY(-2px); background: var(--accent-bg) !important; border-color: var(--accent-border-strong) !important; }
    button:active { transform: scale(0.97); }
    .app-nav-btn:hover { color: var(--text-primary) !important; background: var(--bg-surface-hover) !important; }
    .app-add-btn, button[style*="addButton"] { transition: transform 0.18s var(--ease-spring), box-shadow 0.3s ease; }
    .icon-btn { transition: transform 0.18s var(--ease-spring), color 0.2s ease, background 0.2s ease, border-color 0.2s ease; }
    .icon-btn:hover { transform: translateY(-1px) scale(1.06); }
    .app-stat-value { transition: color 0.3s ease; }

    /* Theme toggle pill */
    .theme-toggle {
      display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px;
      border-radius: 50%; cursor: pointer; color: var(--text-secondary);
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      transition: transform 0.4s var(--ease-spring), color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .theme-toggle:hover { color: var(--accent); border-color: var(--accent-border-strong); transform: rotate(18deg) scale(1.08); box-shadow: var(--glow-accent); }
    .theme-toggle svg { width: 18px; height: 18px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
      body::after { animation: none; }
    }
    
    /* Mobile Responsive Styles */
    @media (max-width: 768px) {
      .mobile-nav { padding: 1rem !important; }
      .mobile-nav-content { flex-wrap: wrap; gap: 0.75rem; }
      .mobile-logo-text { font-size: 1.25rem !important; }
      .mobile-nav-actions { flex-wrap: wrap; justify-content: center; gap: 0.5rem !important; }
      .mobile-nav-cta { padding: 0.5rem 1rem !important; font-size: 0.8125rem !important; }
      .mobile-user-info { padding: 0.375rem 0.75rem !important; }
      .mobile-user-name { display: none; }
      .mobile-logout-btn { padding: 0.375rem 0.75rem !important; }
      .mobile-hero { padding: 6rem 1rem 3rem !important; min-height: auto !important; }
      .mobile-hero-content { padding: 0 0.5rem; }
      .mobile-hero-subtitle { font-size: 1rem !important; margin-bottom: 2rem !important; }
      .mobile-hero-actions { flex-direction: column; width: 100%; }
      .mobile-primary-btn, .mobile-secondary-btn { width: 100%; justify-content: center; padding: 0.875rem 1.5rem !important; }
      .mobile-scroll-indicator { display: none !important; }
      .mobile-section { padding: 3rem 1rem !important; }
      .mobile-features-grid { grid-template-columns: 1fr !important; gap: 1rem !important; }
      .mobile-feature-card { padding: 1.5rem !important; }
      .mobile-stats-section { padding: 2rem 1rem !important; }
      .mobile-stats-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 1.5rem !important; }
      .mobile-stat-number { font-size: 2rem !important; }
      .mobile-demo-preview { margin: 0 -0.5rem; border-radius: 16px !important; }
      .mobile-demo-body { padding: 1rem !important; }
      .mobile-demo-cards { grid-template-columns: 1fr !important; }
      .mobile-cta-section { padding: 4rem 1rem !important; }
      .mobile-footer { padding: 1.5rem 1rem !important; }
    }
    
    @media (max-width: 480px) {
      .mobile-stats-grid { grid-template-columns: 1fr !important; }
      .mobile-nav-actions { width: 100%; justify-content: flex-end; }
      .mobile-hero-tagline { font-size: 0.75rem !important; padding: 0.375rem 1rem !important; }
    }
    
    /* FinancialTracker App Responsive Styles */
    @media (max-width: 768px) {
      .app-header { padding: 0.75rem 1rem !important; }
      .app-header-content { gap: 0.75rem !important; row-gap: 0.75rem !important; }
      /* Brand + account share the top row; nav drops to a full-width second row */
      .app-header-brand { order: 1; }
      .app-header-actions { order: 2; margin-left: auto; }
      .app-nav { order: 3; flex-basis: 100% !important; justify-content: stretch; }
      .app-nav-btn { padding: 0.5rem 0.75rem !important; font-size: 0.75rem !important; flex: 1; justify-content: center; }
      .app-main { padding: 1rem !important; }
      .app-year-selector { flex-wrap: wrap; padding: 0.75rem 1rem !important; }
      .app-dashboard-grid { grid-template-columns: 1fr !important; }
      .app-stat-card { padding: 1rem !important; }
      .app-stat-value { font-size: 1.5rem !important; }
      .app-three-column { grid-template-columns: 1fr !important; }
      .app-panel { padding: 1rem !important; }
      .app-panel-header { flex-direction: column; align-items: stretch !important; }
      .app-item-row { flex-direction: column; align-items: stretch !important; gap: 0.5rem; padding: 0.75rem !important; }
      .app-item-actions { display: flex; justify-content: space-between; align-items: center; width: 100%; }
      .app-table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      /* 5 visible columns on mobile: Date · Day · Activity · Starting · Ending */
      .app-table-header, .app-table-row { grid-template-columns: 64px 38px minmax(120px, 1fr) 92px 92px !important; min-width: 430px; }
      .app-table-header-cell, .app-table-cell { font-size: 0.6875rem !important; }
      .app-hide-mobile { display: none !important; }
      .app-table-row { padding-top: 0.6rem !important; padding-bottom: 0.6rem !important; }
      /* Keep the inline balance editor from overflowing its column on phones */
      .app-table-row input[type="number"] { width: 58px !important; padding: 0.2rem 0.3rem !important; }
      .app-form-card { padding: 1.25rem !important; margin: 1rem; max-width: calc(100% - 2rem) !important; }
      .app-form-actions { flex-direction: column; }
      .app-month-selector { padding: 0.5rem !important; }
      .app-initial-balance-section { flex-direction: column; align-items: stretch !important; gap: 0.5rem !important; }
    }
    
    @media (max-width: 480px) {
      .app-logo-text { font-size: 1.25rem !important; }
      .app-year-badge { display: none; }
      /* Drop the weekday column so the calendar fits a phone with no sideways scroll.
         4 aligned columns: Date · Activity · Starting · Ending */
      .app-hide-xs { display: none !important; }
      .app-table-header, .app-table-row { grid-template-columns: 54px minmax(88px, 1fr) 76px 76px !important; min-width: 0; }
      .app-table-header-cell, .app-table-cell { font-size: 0.625rem !important; }
      .app-table-row { padding-left: 0.75rem !important; padding-right: 0.75rem !important; }
      .app-table-header { padding-left: 0.75rem !important; padding-right: 0.75rem !important; }
    }

    /* Sankey Diagram Styles */
    .app-cashflow-container {
      padding: 1.5rem;
      animation: fadeInUp 0.4s ease-out;
    }

    .cashflow-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .cashflow-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.75rem;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .cashflow-title-icon {
      color: var(--accent);
    }

    .cashflow-stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .cashflow-stat-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 1.25rem;
      box-shadow: var(--elev-1);
    }

    .cashflow-stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .cashflow-stat-value {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-primary);
      font-family: 'Playfair Display', serif;
    }

    .cashflow-stat-value.income { color: var(--success); }
    .cashflow-stat-value.expense { color: var(--danger); }
    .cashflow-stat-value.positive { color: var(--success); }
    .cashflow-stat-value.negative { color: var(--danger); }

    .sankey-container {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 1.5rem;
      min-height: 500px;
      position: relative;
      overflow: hidden;
      box-shadow: var(--elev-1);
    }

    .sankey-container svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .sankey-node {
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .sankey-node rect {
      transition: all 0.2s ease;
    }

    .sankey-node:hover rect {
      filter: brightness(1.2);
    }

    .sankey-node.dimmed {

    .sankey-link {

    .sankey-label {

    .sankey-tooltip-title {

    .sankey-tooltip-hint {

    .sankey-legend {

    /* Sankey Animation */

    /* Responsive adjustments for Sankey */
    @media (max-width: 768px) {
      .app-cashflow-container { padding: 1rem; }
      .cashflow-header { flex-direction: column; align-items: stretch; }

    @media (max-width: 480px) {

</head>
<body>
  <div id="root"><div class="loading-screen"><div class="loading-spinner"></div><span>Loading Mercury...</span></div></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo, Fragment, useCallback, useRef } = React;

    const THEME_KEY = 'mercury-theme';
    const systemTheme = () =>
      (typeof window !== 'undefined' && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    const storedTheme = () => {
      try { const v = localStorage.getItem(THEME_KEY); return v === 'light' || v === 'dark' ? v : null; }
      catch (e) { return null; }
    };

    // useTheme supports an explicit user override (persisted) that falls back to the
    // OS preference. All hook instances stay in sync via a custom event + storage event.
    function useTheme() {
      const [theme, setThemeState] = useState(() => storedTheme() || systemTheme());

      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
      }, [theme]);

      useEffect(() => {
        const mediaQuery = window.matchMedia('(prefers-color-scheme: light)');
        // OS changes only apply when the user hasn't chosen an explicit theme.
        const handleSystem = (e) => { if (!storedTheme()) setThemeState(e.matches ? 'light' : 'dark'); };
        const handleSync = () => setThemeState(storedTheme() || systemTheme());
        mediaQuery.addEventListener('change', handleSystem);
        window.addEventListener('mercury-theme-change', handleSync);
        window.addEventListener('storage', handleSync);
        return () => {
          mediaQuery.removeEventListener('change', handleSystem);
          window.removeEventListener('mercury-theme-change', handleSync);
          window.removeEventListener('storage', handleSync);
        };
      }, []);

      const setTheme = useCallback((next) => {
        try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
        setThemeState(next);
        window.dispatchEvent(new Event('mercury-theme-change'));
      }, []);

      const toggleTheme = useCallback(() => {
        setTheme((storedTheme() || systemTheme()) === 'dark' ? 'light' : 'dark');
      }, [setTheme]);

      return { theme, setTheme, toggleTheme, isDark: theme === 'dark' };
    }

    const DATA_VERSION = 2;

    const api = {
      async getUser() {
        const res = await fetch('/api/auth/user', { credentials: 'include' });
        if (!res.ok) return null;
        const data = await res.json();
        return data.user;
      },
      async loadData() {
        const res = await fetch('/api/data', { credentials: 'include' });
        if (res.status === 401) throw new Error('Unauthorized');
        if (!res.ok) throw new Error('Failed to load data');
        return res.json();
      },
      async saveData(data) {
        const res = await fetch('/api/data', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
          credentials: 'include'
        });
        if (res.status === 401) throw new Error('Unauthorized');
        if (!res.ok) throw new Error('Failed to save data');
        return res.json();
      },
      async updateField(field, value) {
        const res = await fetch(`/api/data/${field}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ value }),
          credentials: 'include'
        });
        if (res.status === 401) throw new Error('Unauthorized');
        if (!res.ok) throw new Error('Failed to update field');
        return res.json();
      }
    };

    const formatCurrency = (amount) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2 }).format(amount);
    const formatDate = (date) => date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    const formatFullDate = (date) => date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    const getDayOfWeek = (date) => date.toLocaleDateString('en-US', { weekday: 'short' });
    const getDayOfWeekIndex = (date) => date.getDay();
    const isWeekday = (date) => { const day = date.getDay(); return day !== 0 && day !== 6; };

    const getLastWeekdayOnOrBefore = (year, month, targetDay) => {
      let date = new Date(year, month, targetDay);
      while (!isWeekday(date)) date.setDate(date.getDate() - 1);
      return date.getDate();
    };

    const getLastDayOfMonth = (year, month) => new Date(year, month + 1, 0).getDate();
    const getLastWeekdayOfMonth = (year, month) => getLastWeekdayOnOrBefore(year, month, getLastDayOfMonth(year, month));
    const isLeapYear = (year) => (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
    const getDaysInYear = (year) => isLeapYear(year) ? 366 : 365;

    // Memoized date generation to avoid repeated calculations
    const datesCache = {};
    const generateDatesForYear = (year) => {
      if (datesCache[year]) return datesCache[year];
      const dates = [];
      const daysInYear = getDaysInYear(year);
      const startDate = new Date(year, 0, 1);
      for (let i = 0; i < daysInYear; i++) {
        const date = new Date(startDate);
        date.setDate(startDate.getDate() + i);
        dates.push(date);
      }
      datesCache[year] = dates;
      return dates;
    };

    const getCurrentYear = () => new Date().getFullYear();

    // Utility: Convert date to YYYY-MM-DD string using LOCAL date components.
    // (Using toISOString() here caused off-by-one date keys for users east of UTC,
    //  because the calendar dates are created at local midnight.)
    const toDateKey = (date) => {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    };

    // Parse a YYYY-MM-DD key as a LOCAL date (avoids UTC-shift display bugs)
    const parseDateKey = (key) => new Date(key + 'T00:00:00');

    // Utility: Extract all commonly-needed date components at once
    const getDateInfo = (date) => ({
      dateKey: toDateKey(date),
      dayOfMonth: date.getDate(),
      dayOfWeekIdx: getDayOfWeekIndex(date),
      month: date.getMonth(),
      year: date.getFullYear()
    });

    // Utility: Get cutoff date for YTD calculations
    const getYearCutoffDate = (year) => {
      const today = new Date();
      const todayStr = toDateKey(today);
      return year === today.getFullYear() ? todayStr : `${year}-12-31`;
    };

    // Returns true if `date` is the configured day-of-month, clamped to the last day
    // of the month so a "31st" schedule still fires on Feb 28/30-day months.
    const matchesDayOfMonth = (date, targetDay) => {
      const { dayOfMonth, month, year } = getDateInfo(date);
      const clamped = Math.min(targetDay, getLastDayOfMonth(year, month));
      return dayOfMonth === clamped;
    };

    // Single source of truth for payroll frequency calculation
    // Replaces duplicated logic in financialData, stats, and sankeyData useMemos
    const isPayday = (date, payroll, referenceYear) => {
      const { dayOfMonth, dayOfWeekIdx, month, year } = getDateInfo(date);

      switch (payroll.frequency) {
        case 'monthly':
          return matchesDayOfMonth(date, payroll.startDay);

        case 'biweekly': {
          const startDate = new Date(payroll.startYear || referenceYear, 0, payroll.startDay);
          const diffDays = Math.floor((date - startDate) / (1000 * 60 * 60 * 24));
          return diffDays >= 0 && diffDays % 14 === 0;
        }

        case 'weekly': {
          const startDate = new Date(payroll.startYear || referenceYear, 0, payroll.startDay);
          const diffDays = Math.floor((date - startDate) / (1000 * 60 * 60 * 24));
          return diffDays >= 0 && diffDays % 7 === 0;
        }

        case 'semimonthly': {
          const lastWeekdayBefore15th = getLastWeekdayOnOrBefore(year, month, 15);
          const lastWeekdayOfMonth = getLastWeekdayOfMonth(year, month);
          return dayOfMonth === lastWeekdayBefore15th || dayOfMonth === lastWeekdayOfMonth;
        }

        case 'last-weekday-15th': {
          const lastWeekdayBefore15th = getLastWeekdayOnOrBefore(year, month, 15);
          const lastWeekdayOfMonth = getLastWeekdayOfMonth(year, month);
          return dayOfMonth === lastWeekdayBefore15th || dayOfMonth === lastWeekdayOfMonth;
        }

        case 'last-weekday-eom':
          return dayOfMonth === getLastWeekdayOfMonth(year, month);

        default:
          return false;
      }
    };

    // Single source of truth for recurring expense frequency calculation
    // Replaces duplicated logic in financialData, stats, ytdExpensesByName, and sankeyData useMemos
    const isExpenseDue = (date, expense) => {
      const { dayOfMonth, dayOfWeekIdx, month, year } = getDateInfo(date);

      switch (expense.frequency) {
        case 'monthly':
          return matchesDayOfMonth(date, expense.dayOfMonth);
        case 'semimonthly':
          // Twice a month: the 15th and the last calendar day of the month.
          return dayOfMonth === 15 || dayOfMonth === getLastDayOfMonth(year, month);
        case 'weekly':
          return expense.dayOfWeek === dayOfWeekIdx;
        case 'yearly':
          return expense.month === month && matchesDayOfMonth(date, expense.day);
        default:
          return false;
      }
    };

    const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

    // ===== Debt payoff (amortization) =====
    // Monthly-equivalent of a recurring expense, used to value a linked debt payment.
    const monthlyEquivalent = (expense) => {
      switch (expense.frequency) {
        case 'weekly': return expense.amount * 52 / 12;
        case 'semimonthly': return expense.amount * 2;
        case 'yearly': return expense.amount / 12;
        case 'monthly':
        default: return expense.amount;
      }
    };

    // Effective monthly payment toward a debt: summed monthly-equivalent of any LINKED
    // recurring expenses (the source of truth), else the debt's own monthlyPayment;
    // plus extraPayment. Returns null when there is no payment source at all.
    const effectivePaymentForDebt = (debt, recurringExpenses) => {
      const linked = (recurringExpenses || []).filter(e => e.debtId != null && String(e.debtId) === String(debt.id));
      const extra = (debt.extraPayment > 0) ? debt.extraPayment : 0;
      if (linked.length > 0) return linked.reduce((s, e) => s + monthlyEquivalent(e), 0) + extra;
      if (typeof debt.monthlyPayment === 'number' && debt.monthlyPayment > 0) return debt.monthlyPayment + extra;
      return null;
    };

    // Amortize a balance at a fixed monthly payment. The month-by-month loop (capped at
    // 1200 months) is the source of truth for interest and the final partial payment.
    const amortize = (balance, apr, payment) => {
      const r = (apr / 100) / 12;
      if (!(balance > 0)) return { months: 0, totalInterest: 0, totalPaid: 0, neverPays: false };
      if (!(payment > 0)) return { months: Infinity, totalInterest: Infinity, totalPaid: Infinity, neverPays: true };
      if (r > 0 && payment <= balance * r) return { months: Infinity, totalInterest: Infinity, totalPaid: Infinity, neverPays: true };
      let bal = balance, totalInterest = 0, totalPaid = 0, months = 0;
      while (bal > 0 && months < 1200) {
        const interest = bal * r;
        const principal = Math.min(payment - interest, bal);
        bal -= principal;
        totalInterest += interest;
        totalPaid += principal + interest;
        months++;
      }
      return { months, totalInterest, totalPaid, neverPays: bal > 0 };
    };

    // Whole-month payoff date key from today (never via toISOString — see toDateKey).
    const payoffDateKeyFrom = (today, months) => {
      if (!isFinite(months)) return null;
      return toDateKey(new Date(today.getFullYear(), today.getMonth() + months, today.getDate()));
    };

    // Per-debt plan + a payoffDateByDebtId map. PURE over (debts, recurringExpenses) —
    // never reads financialData, so there is no circular memo dependency.
    const computeDebtPlan = (debts, recurringExpenses, today) => {
      const byDebt = {};
      const payoffDateByDebtId = {};
      (debts || []).forEach(debt => {
        const linkedNames = (recurringExpenses || [])
          .filter(e => e.debtId != null && String(e.debtId) === String(debt.id))
          .map(e => e.name);
        const payment = effectivePaymentForDebt(debt, recurringExpenses);
        if (payment == null) {
          byDebt[debt.id] = { payment: null, months: null, payoffDateKey: null, totalInterest: 0, totalPaid: 0, neverPays: false, noSource: true, linkedNames };
          return;
        }
        const a = amortize(debt.balance, debt.apr, payment);
        const payoffDateKey = a.neverPays ? null : payoffDateKeyFrom(today, a.months);
        byDebt[debt.id] = { payment, months: a.neverPays ? null : a.months, payoffDateKey, totalInterest: a.totalInterest, totalPaid: a.totalPaid, neverPays: a.neverPays, noSource: false, linkedNames };
        if (payoffDateKey) payoffDateByDebtId[debt.id] = payoffDateKey;
      });
      return { byDebt, payoffDateByDebtId };
    };

    // A debt-linked recurring expense stops occurring once its debt is paid off.
    // Unknown / never-pays debts => always active (the expense keeps appearing).
    const isRecurringActiveOn = (dateKey, expense, payoffDateByDebtId) =>
      expense.debtId == null
      || !payoffDateByDebtId[expense.debtId]
      || dateKey <= payoffDateByDebtId[expense.debtId];

    // Month-by-month total remaining balance across all payable debts, for the
    // motivating "watch your debt shrink to zero" chart. Non-payable debts (no
    // payment source / never-pays) are held flat as a residual so the line stays honest.
    // Month-by-month total remaining balance across payable debts, for the motivating
    // payoff chart. mode 'snowball' rolls a paid-off debt's payment into the remaining
    // debts (smallest balance first); 'independent' pays each on its own. Non-payable
    // debts are held flat as a residual so the line stays honest.
    const computeDebtProjection = (debts, debtPlan, today, mode = 'independent', maxMonths = 1200) => {
      const sims = (debts || []).map(d => {
        const p = debtPlan.byDebt[d.id] || {};
        const payable = !!(p.payment && !p.neverPays && !p.noSource);
        return { bal: d.balance || 0, r: (d.apr / 100) / 12, min: payable ? p.payment : 0, payable };
      });
      const payable = sims.filter(s => s.payable);
      const hasResidual = sims.some(s => !s.payable && s.bal > 0);
      if (payable.length === 0) return { points: [], months: 0, totalInterest: 0, hasResidual };
      const pool = payable.reduce((t, s) => t + s.min, 0); // constant total paid each month (snowball)
      const totalOf = () => sims.reduce((t, s) => t + s.bal, 0);
      const dateAt = (m) => new Date(today.getFullYear(), today.getMonth() + m, 1);
      const points = [{ date: dateAt(0), total: totalOf() }];
      let totalInterest = 0, month = 0;
      while (sims.some(s => s.payable && s.bal > 0.005) && month < maxMonths) {
        month++;
        sims.forEach(s => { if (s.payable && s.bal > 0) { const i = s.bal * s.r; s.bal += i; totalInterest += i; } });
        if (mode === 'snowball') {
          // Active debts smallest-balance first; pay each its minimum, then cascade the
          // freed-up pool (minimums of already-cleared debts) onto the smallest balances.
          const active = sims.filter(s => s.payable && s.bal > 0).sort((a, b) => a.bal - b.bal);
          let avail = pool;
          active.forEach(s => { const pay = Math.min(s.min, s.bal, avail); s.bal -= pay; avail -= pay; });
          for (const s of active) { if (avail <= 0.005) break; if (s.bal <= 0) continue; const pay = Math.min(s.bal, avail); s.bal -= pay; avail -= pay; }
        } else {
          sims.forEach(s => { if (s.payable && s.bal > 0) { s.bal = Math.max(0, s.bal - Math.min(s.min, s.bal)); } });
        }
        points.push({ date: dateAt(month), total: totalOf() });
      }
      return { points, months: month, totalInterest, hasResidual };
    };

    // ===== Occurrence engine =====
    // Recurring rules expand into concrete dated occurrences, applying per-occurrence
    // exceptions keyed by the rule's natural ("origin") date:
    //   rule.exceptions = { [originDateKey]: { amount?: number, moveTo?: dateKey, skip?: true } }
    // This lets a single paycheck/bill be re-priced, moved (e.g. off a weekend), or skipped
    // without disturbing the rest of the schedule.
    const resolveOccurrence = (defaultAmount, originKey, exceptions) => {
      const e = exceptions && exceptions[originKey];
      if (e && e.skip) return null;
      const amount = e && typeof e.amount === 'number' ? e.amount : defaultAmount;
      const dateKey = e && e.moveTo ? e.moveTo : originKey;
      return { amount, dateKey, moved: !!(e && e.moveTo), adjusted: !!(e && typeof e.amount === 'number'), skippable: true };
    };

    const generateOccurrences = (year, payrolls, recurringExpenses, oneOffExpenses, oneOffIncomes, payoffDateByDebtId = {}) => {
      const dates = generateDatesForYear(year);
      const incomeByDate = {};
      const expenseByDate = {};
      const add = (map, key, item) => { (map[key] = map[key] || []).push(item); };

      payrolls.forEach(p => {
        const ex = p.exceptions || {};
        dates.forEach(date => {
          if (!isPayday(date, p, year)) return;
          const origin = toDateKey(date);
          const occ = resolveOccurrence(p.amount, origin, ex);
          if (!occ) return;
          add(incomeByDate, occ.dateKey, { name: p.name, amount: occ.amount, id: p.id, kind: 'recurring', origin, moved: occ.moved, adjusted: occ.adjusted });
        });
      });
      recurringExpenses.forEach(x => {
        const ex = x.exceptions || {};
        dates.forEach(date => {
          if (!isExpenseDue(date, x)) return;
          const origin = toDateKey(date);
          // A debt-linked expense terminates once the debt is paid off (single
          // integration point => Calendar, Dashboard, and Cash Flow can't drift).
          if (!isRecurringActiveOn(origin, x, payoffDateByDebtId)) return;
          const occ = resolveOccurrence(x.amount, origin, ex);
          if (!occ) return;
          add(expenseByDate, occ.dateKey, { name: x.name, amount: occ.amount, id: x.id, kind: 'recurring', origin, moved: occ.moved, adjusted: occ.adjusted });
        });
      });
      const prefix = String(year);
      (oneOffExpenses || []).forEach(e => { if (e.date && e.date.startsWith(prefix)) add(expenseByDate, e.date, { name: e.name, amount: e.amount, id: e.id, kind: 'oneoff', origin: e.date }); });
      (oneOffIncomes || []).forEach(e => { if (e.date && e.date.startsWith(prefix)) add(incomeByDate, e.date, { name: e.name, amount: e.amount, id: e.id, kind: 'oneoff', origin: e.date }); });
      return { incomeByDate, expenseByDate };
    };

    // Project the daily running balance for a year from pre-expanded occurrences.
    // Balance check-ins (balanceOverrides) re-base the running balance on their date.
    const buildYearSeries = (year, occ, initialBalance, balanceOverrides, today, todayKey) => {
      const dates = generateDatesForYear(year);
      let running = initialBalance;
      return dates.map(date => {
        const dateKey = toDateKey(date);
        const hasCheckIn = balanceOverrides[dateKey] !== undefined;
        let startingBalance = hasCheckIn ? balanceOverrides[dateKey] : running;
        const incomes = occ.incomeByDate[dateKey] || [];
        const expensesArr = occ.expenseByDate[dateKey] || [];
        const payrollAmount = incomes.reduce((s, i) => s + i.amount, 0);
        startingBalance += payrollAmount;
        let recurringExpenseAmount = 0, oneOffExpenseAmount = 0;
        expensesArr.forEach(e => { if (e.kind === 'recurring') recurringExpenseAmount += e.amount; else oneOffExpenseAmount += e.amount; });
        const expenses = recurringExpenseAmount + oneOffExpenseAmount;
        const endingBalance = startingBalance - expenses;
        running = endingBalance;
        const expenseDetails = expensesArr.map(e => ({ ...e, isRecurring: e.kind === 'recurring' }));
        return {
          date, dateKey, dayOfWeek: getDayOfWeek(date), dayOfWeekIdx: getDayOfWeekIndex(date), dayOfMonth: date.getDate(), month: date.getMonth(), year,
          startingBalance, endingBalance, expenses,
          recurringExpenses: recurringExpenseAmount, oneOffExpenses: oneOffExpenseAmount,
          payrollAmount, payrollDetails: incomes,
          expenseDetails, recurringExpenseDetails: expenseDetails.filter(e => e.isRecurring), oneOffExpenseDetails: expenseDetails.filter(e => !e.isRecurring),
          isOverridden: hasCheckIn, isPast: date < today, isToday: dateKey === todayKey,
        };
      });
    };

    // Per-occurrence editor — adjust the amount, move the date, or skip a single
    // paycheck/charge without changing the underlying recurring rule.
    function OccurrenceEditor({ editor, onClose, onApply, onReset, styles }) {
      const { kind, ruleId, name, originKey, effectiveAmount, defaultAmount, effectiveDate, hasException } = editor;
      const isIncome = kind === 'income';
      const [amount, setAmount] = useState(String(effectiveAmount));
      const [date, setDate] = useState(effectiveDate || originKey);

      const save = () => {
        const amt = parseFloat(amount);
        onApply(kind, ruleId, originKey, {
          amount: (!isNaN(amt) && amt !== defaultAmount) ? Math.abs(amt) : null,
          moveTo: (date && date !== originKey) ? date : null,
          skip: false,
        });
        onClose();
      };
      const skip = () => { onApply(kind, ruleId, originKey, { skip: true, amount: null, moveTo: null }); onClose(); };
      const reset = () => { onReset(kind, ruleId, originKey); onClose(); };

      return (
        <div style={styles.formOverlay} onClick={onClose}>
          <div className="app-form-card" style={styles.formCard} onClick={e => e.stopPropagation()}>
            <h3 style={styles.formTitle}>Adjust this {isIncome ? 'paycheck' : 'charge'}</h3>
            <div style={{ fontSize: '0.8125rem', color: 'var(--text-muted)', marginBottom: '1.25rem', lineHeight: 1.5 }}>
              <strong style={{ color: 'var(--text-primary)' }}>{name}</strong> — normally due {formatFullDate(parseDateKey(originKey))}. Changes here affect only this one occurrence.
            </div>
            <div style={styles.formGroup}><label style={styles.formLabel}>Amount for this occurrence</label><input type="number" value={amount} onChange={e => setAmount(e.target.value)} style={styles.formInput} /><div style={styles.formHint}>Rule default is {formatCurrency(defaultAmount)}</div></div>
            <div style={styles.formGroup}><label style={styles.formLabel}>Date for this occurrence</label><input type="date" value={date} onChange={e => setDate(e.target.value)} style={styles.formInput} /><div style={styles.formHint}>Move it if it lands on a weekend or holiday</div></div>
            <button style={{ ...styles.cancelBtn, width: '100%', color: 'var(--danger)', borderColor: 'var(--danger)', marginBottom: '0.625rem' }} onClick={skip}>Skip this occurrence entirely</button>
            <div className="app-form-actions" style={styles.formActions}>
              {hasException
                ? <button style={styles.cancelBtn} onClick={reset}>Reset to default</button>
                : <button style={styles.cancelBtn} onClick={onClose}>Cancel</button>}
              <button style={styles.submitBtn} onClick={save}>Save</button>
            </div>
          </div>
        </div>
      );
    }

    function MoneyRain({ containerRef }) {
      const canvasRef = useRef(null);
      const mouseRef = useRef({ x: -1000, y: -1000 });
      const animationRef = useRef(null);
      const { isDark } = useTheme();
      
      useEffect(() => {
        const canvas = canvasRef.current;
        const container = containerRef?.current;
        if (!canvas || !container) return;
        
        const ctx = canvas.getContext('2d');
        const chars = '$$$$$¢¢€€£¥₿%0123456789.+-';
        const charArray = chars.split('');
        const fontSize = 18;
        
        const bgFade = isDark ? 'rgba(6, 10, 18, 0.09)' : 'rgba(238, 242, 247, 0.10)';
        const charColor = isDark ? 'rgba(34, 211, 238, 0.16)' : 'rgba(14, 155, 184, 0.22)';
        const glowColor = isDark ? '#22d3ee' : '#0e9bb8';
        
        let columns = Math.floor(container.offsetWidth / fontSize);
        let drops = new Array(columns).fill(0).map(() => Math.random() * -100);
        let speeds = new Array(columns).fill(0).map(() => 0.3 + Math.random() * 0.7);
        
        const handleResize = () => {
          canvas.width = container.offsetWidth;
          canvas.height = container.offsetHeight;
          columns = Math.floor(canvas.width / fontSize);
          drops = new Array(columns).fill(0).map(() => Math.random() * -100);
          speeds = new Array(columns).fill(0).map(() => 0.3 + Math.random() * 0.7);
        };
        handleResize();
        window.addEventListener('resize', handleResize);
        
        const handleMouseMove = (e) => {
          const rect = container.getBoundingClientRect();
          mouseRef.current = { x: e.clientX - rect.left, y: e.clientY - rect.top };
        };
        const handleMouseLeave = () => {
          mouseRef.current = { x: -1000, y: -1000 };
        };
        container.addEventListener('mousemove', handleMouseMove);
        container.addEventListener('mouseleave', handleMouseLeave);
        
        const draw = () => {
          ctx.fillStyle = bgFade;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          
          ctx.font = `${fontSize}px "Playfair Display", serif`;
          
          const { x: mouseX, y: mouseY } = mouseRef.current;
          const glowRadius = 200;
          
          for (let i = 0; i < drops.length; i++) {
            const char = charArray[Math.floor(Math.random() * charArray.length)];
            const x = i * fontSize;
            const y = drops[i] * fontSize;
            
            const dx = mouseX - x;
            const dy = mouseY - y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            if (distance < glowRadius) {
              const brightness = 1 - (distance / glowRadius);
              const alpha = 0.3 + brightness * 0.7;
              ctx.shadowBlur = 25 * brightness;
              ctx.shadowColor = glowColor;
              ctx.fillStyle = isDark ? `rgba(34, 211, 238, ${alpha})` : `rgba(14, 155, 184, ${alpha})`;
            } else {
              ctx.shadowBlur = 0;
              ctx.fillStyle = charColor;
            }
            
            ctx.fillText(char, x, y);
            
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.98) {
              drops[i] = 0;
            }
            drops[i] += speeds[i];
          }
          
          animationRef.current = requestAnimationFrame(draw);
        };
        
        draw();
        
        return () => {
          window.removeEventListener('resize', handleResize);
          container.removeEventListener('mousemove', handleMouseMove);
          container.removeEventListener('mouseleave', handleMouseLeave);
          if (animationRef.current) {
            cancelAnimationFrame(animationRef.current);
          }
        };
      }, [containerRef, isDark]);
      
      return (
        <canvas
          ref={canvasRef}
          style={{
            position: 'absolute',
            top: 0,
            left: 0,
            width: '100%',
            height: '100%',
            pointerEvents: 'none',
            zIndex: 0
          }}
        />
      );
    }

    // ========================================
    // Form State Management
    // ========================================

    // Form state reducer - consolidates 7 useState calls into 1
    const initialFormState = {
      payroll: { name: '', amount: '', frequency: 'semimonthly', startDay: 1, dayOfWeek: 5 },
      recurring: { name: '', amount: '', frequency: 'monthly', dayOfMonth: 1, dayOfWeek: 5, month: 0, day: 1, debtId: '' },
      oneOff: { name: '', amount: '', date: '' },
      oneOffIncome: { name: '', amount: '', date: '' },
      debt: { name: '', type: 'credit-card', balance: '', apr: '', monthlyPayment: '', extraPayment: '' },
      activeForm: null, // 'payroll' | 'recurring' | 'oneOff' | 'oneOffIncome' | 'debt' | null
      calendarDate: null, // for adding from calendar
      editingId: null // id of the entry being edited (null = creating new)
    };

    const formKeyFor = { payroll: 'payroll', recurring: 'recurring', oneOff: 'oneOff', oneOffIncome: 'oneOffIncome', debt: 'debt' };

    const formReducer = (state, action) => {
      switch (action.type) {
        case 'UPDATE_PAYROLL':
          return { ...state, payroll: { ...state.payroll, ...action.payload } };
        case 'UPDATE_RECURRING':
          return { ...state, recurring: { ...state.recurring, ...action.payload } };
        case 'UPDATE_ONEOFF':
          return { ...state, oneOff: { ...state.oneOff, ...action.payload } };
        case 'UPDATE_ONEOFF_INCOME':
          return { ...state, oneOffIncome: { ...state.oneOffIncome, ...action.payload } };
        case 'UPDATE_DEBT':
          return { ...state, debt: { ...state.debt, ...action.payload } };
        case 'SHOW_FORM':
          return { ...state, activeForm: action.formType, calendarDate: action.calendarDate || null, editingId: null };
        case 'EDIT_ENTRY':
          return { ...state, [formKeyFor[action.formType]]: action.values, activeForm: action.formType, calendarDate: null, editingId: action.id };
        case 'HIDE_FORM':
          return { ...state, activeForm: null, calendarDate: null, editingId: null };
        case 'RESET_PAYROLL':
          return { ...state, payroll: initialFormState.payroll, activeForm: null, editingId: null };
        case 'RESET_RECURRING':
          return { ...state, recurring: initialFormState.recurring, activeForm: null, editingId: null };
        case 'RESET_ONEOFF':
          return { ...state, oneOff: initialFormState.oneOff, activeForm: null, calendarDate: null, editingId: null };
        case 'RESET_ONEOFF_INCOME':
          return { ...state, oneOffIncome: initialFormState.oneOffIncome, activeForm: null, calendarDate: null, editingId: null };
        case 'RESET_DEBT':
          return { ...state, debt: initialFormState.debt, activeForm: null, editingId: null };
        default:
          return state;
      }
    };

    function FinancialTracker({ onBackToHome, user }) {
      const today = new Date();
      const realCurrentYear = getCurrentYear();

      const [isLoading, setIsLoading] = useState(true);
      const [loadError, setLoadError] = useState(null);

      const [activeYear, setActiveYear] = useState(realCurrentYear);
      const [dashboardYear, setDashboardYear] = useState(realCurrentYear);
      const [archivedYears, setArchivedYears] = useState([]);
      const [initialBalances, setInitialBalances] = useState({ [realCurrentYear]: 5000 });
      const [payrolls, setPayrolls] = useState([]);
      const [recurringExpenses, setRecurringExpenses] = useState([]);
      const [oneOffExpenses, setOneOffExpenses] = useState([]);
      const [oneOffIncomes, setOneOffIncomes] = useState([]);
      const [debts, setDebts] = useState([]);
      const [balanceOverrides, setBalanceOverrides] = useState({});
      const [rolloverNotice, setRolloverNotice] = useState(null); // summary of an automatic year rollover
      const [snowballMode, setSnowballMode] = useState(false); // debt projection: snowball vs independent
      const didRolloverRef = useRef(false);
      const getInitialActiveView = () => {
        const hash = window.location.hash;
        if (hash.includes('/calendar')) return 'calendar';
        if (hash.includes('/cashflow')) return 'cashflow';
        if (hash.includes('/debt')) return 'debt';
        return 'dashboard';
      };
      const [activeView, setActiveViewState] = useState(getInitialActiveView);

      const setActiveView = (view) => {
        setActiveViewState(view);
        window.history.replaceState(null, '', '#app/' + view);
      };

      useEffect(() => {
        const handleHashChange = () => {
          const hash = window.location.hash;
          if (hash.includes('/calendar')) {
            setActiveViewState('calendar');
          } else if (hash.includes('/cashflow')) {
            setActiveViewState('cashflow');
          } else if (hash.includes('/debt')) {
            setActiveViewState('debt');
          } else if (hash.includes('/dashboard')) {
            setActiveViewState('dashboard');
          }
        };
        window.addEventListener('hashchange', handleHashChange);
        return () => window.removeEventListener('hashchange', handleHashChange);
      }, []);

      const [editingCell, setEditingCell] = useState(null);
      const [editValue, setEditValue] = useState('');
      const [scrollToMonth, setScrollToMonth] = useState(today.getMonth());
      const [saveState, setSaveState] = useState('idle'); // 'idle' | 'saving' | 'saved' | 'error'
      const savedTimeoutRef = useRef(null);

      // Consolidated form state using reducer (replaces 7 useState calls)
      const [formState, formDispatch] = React.useReducer(formReducer, initialFormState);

      // Derived values for backward compatibility with existing code
      const newPayroll = formState.payroll;
      const newRecurringExpense = formState.recurring;
      const newOneOffExpense = formState.oneOff;
      const newOneOffIncome = formState.oneOffIncome;
      const showPayrollForm = formState.activeForm === 'payroll';
      const showRecurringExpenseForm = formState.activeForm === 'recurring';
      const showOneOffExpenseForm = formState.activeForm === 'oneOff';
      const showOneOffIncomeForm = formState.activeForm === 'oneOffIncome';
      const newDebt = formState.debt;
      const showDebtForm = formState.activeForm === 'debt';
      const isEditing = formState.editingId != null;
      const addOneOffFromCalendar = formState.calendarDate;

      // Helper functions for form updates (maintaining similar API)
      const setNewPayroll = (updater) => {
        const newVal = typeof updater === 'function' ? updater(formState.payroll) : updater;
        formDispatch({ type: 'UPDATE_PAYROLL', payload: newVal });
      };
      const setNewRecurringExpense = (updater) => {
        const newVal = typeof updater === 'function' ? updater(formState.recurring) : updater;
        formDispatch({ type: 'UPDATE_RECURRING', payload: newVal });
      };
      const setNewOneOffExpense = (updater) => {
        const newVal = typeof updater === 'function' ? updater(formState.oneOff) : updater;
        formDispatch({ type: 'UPDATE_ONEOFF', payload: newVal });
      };
      const setNewOneOffIncome = (updater) => {
        const newVal = typeof updater === 'function' ? updater(formState.oneOffIncome) : updater;
        formDispatch({ type: 'UPDATE_ONEOFF_INCOME', payload: newVal });
      };
      const setShowOneOffIncomeForm = (show) => formDispatch({ type: show ? 'SHOW_FORM' : 'HIDE_FORM', formType: 'oneOffIncome' });
      const setNewDebt = (updater) => {
        const newVal = typeof updater === 'function' ? updater(formState.debt) : updater;
        formDispatch({ type: 'UPDATE_DEBT', payload: newVal });
      };
      const setShowDebtForm = (show) => formDispatch({ type: show ? 'SHOW_FORM' : 'HIDE_FORM', formType: 'debt' });
      const setShowPayrollForm = (show) => formDispatch({ type: show ? 'SHOW_FORM' : 'HIDE_FORM', formType: 'payroll' });
      const setShowRecurringExpenseForm = (show) => formDispatch({ type: show ? 'SHOW_FORM' : 'HIDE_FORM', formType: 'recurring' });
      const setShowOneOffExpenseForm = (show) => formDispatch({ type: show ? 'SHOW_FORM' : 'HIDE_FORM', formType: 'oneOff' });
      const setAddOneOffFromCalendar = (date) => formDispatch({ type: date ? 'SHOW_FORM' : 'HIDE_FORM', formType: 'oneOff', calendarDate: date });
      const [draggedItem, setDraggedItem] = useState(null); // { type:'oneoffExpense'|'oneoffIncome'|'recurringExpense'|'recurringIncome', id, origin? }

      const handleDragStart = (e, item) => {
        setDraggedItem(item);
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', String(item.id)); } catch (_) {}
      };

      const handleDragOver = (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
      };

      // Dropping on a day moves that occurrence there. One-offs change their own date;
      // recurring occurrences get a per-occurrence moveTo exception (cleared if dropped
      // back on their natural date).
      const handleDrop = (e, targetDateKey) => {
        e.preventDefault();
        const item = draggedItem;
        setDraggedItem(null);
        if (!item) return;
        if (item.type === 'oneoffExpense') setOneOffExpenses(prev => prev.map(x => x.id === item.id ? { ...x, date: targetDateKey } : x));
        else if (item.type === 'oneoffIncome') setOneOffIncomes(prev => prev.map(x => x.id === item.id ? { ...x, date: targetDateKey } : x));
        else if (item.type === 'recurringIncome') applyOccurrenceException('income', item.id, item.origin, { moveTo: targetDateKey === item.origin ? null : targetDateKey, skip: false });
        else if (item.type === 'recurringExpense') applyOccurrenceException('expense', item.id, item.origin, { moveTo: targetDateKey === item.origin ? null : targetDateKey, skip: false });
      };

      const handleDragEnd = () => setDraggedItem(null);

      const saveTimeoutRef = useRef(null);
      const monthRefs = useRef({});
      const todayRowRef = useRef(null);
      const hasScrolledToToday = useRef(false);
      const ytdChartRef = useRef(null);
      const ytdChartInstance = useRef(null);
      const balanceChartRef = useRef(null);
      const balanceChartInstance = useRef(null);
      const debtChartRef = useRef(null);
      const debtChartInstance = useRef(null);

      useEffect(() => {
        if (monthRefs.current[scrollToMonth]) {
          monthRefs.current[scrollToMonth].scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }, [scrollToMonth]);

      useEffect(() => {
        if (activeView === 'calendar' && todayRowRef.current && !hasScrolledToToday.current) {
          setTimeout(() => {
            todayRowRef.current.scrollIntoView({ behavior: 'auto', block: 'center' });

        }
      }, [activeView, isLoading]);

      useEffect(() => {
        api.loadData()
          .then(data => {
            if (data.initialBalances) setInitialBalances(data.initialBalances);
            if (data.payrolls) setPayrolls(data.payrolls);
            if (data.recurringExpenses) setRecurringExpenses(data.recurringExpenses);
            if (data.oneOffExpenses) setOneOffExpenses(data.oneOffExpenses);
            if (data.oneOffIncomes) setOneOffIncomes(data.oneOffIncomes);
            setDebts(Array.isArray(data.debts) ? data.debts : []);
            if (data.balanceOverrides) setBalanceOverrides(data.balanceOverrides);
            if (data.currentYear) {
              setActiveYear(data.currentYear);
              setDashboardYear(data.currentYear);
            }
            if (data.archivedYears) setArchivedYears(data.archivedYears);

          })
          .catch(err => {
            console.error('Failed to load data:', err);
            if (err.message === 'Unauthorized') {
              window.location.href = '/api/login';
